    function useChart(canvasRef, buildConfig, deps) {
      const chartRef = useRef(null);
      useEffect(() => {
        if (!canvasRef.current || !window.Chart) return;
        if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; }
        const config = buildConfig();
        if (!config) return;
        chartRef.current = new window.Chart(canvasRef.current, config);
        return () => { if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; } };
      }, deps);
    }

    function toHours(sec) { return Math.round((sec / 3600) * 10) / 10; }

    function isoWeek(date) {
      const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
      const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
      return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    }

    function ProgressPage() {
      const [subjects] = useLocalStorage('studyflow-subjects', []);
      const [sessions] = useLocalStorage('studyflow-sessions', []);
      const [histFilter, setHistFilter] = useState('');
      const [histPage, setHistPage]     = useState(1);
      const HIST_PER_PAGE = 10;

      const weeklyChartRef   = useRef(null);
      const subjectsChartRef = useRef(null);

      const now   = new Date();
      const today = now.toDateString();

      const currentWeek  = isoWeek(now);
      const currentYear  = now.getFullYear();
      const currentMonth = now.getMonth();

      const weekSec   = sessions.filter(s => {
        const d = new Date(s.date);
        return isoWeek(d) === currentWeek && d.getFullYear() === currentYear;
      }).reduce((a, s) => a + s.durationSeconds, 0);

      const monthSec = sessions.filter(s => {
        const d = new Date(s.date);
        return d.getMonth() === currentMonth && d.getFullYear() === currentYear;
      }).reduce((a, s) => a + s.durationSeconds, 0);

      const totalSec = sessions.reduce((a, s) => a + s.durationSeconds, 0);

      const todaySec = sessions.filter(s => new Date(s.date).toDateString() === today)
        .reduce((a, s) => a + s.durationSeconds, 0);

      const totalSessions = sessions.length;

      const last7 = Array.from({ length: 7 }, (_, i) => {
        const d = new Date(now);
        d.setDate(d.getDate() - (6 - i));
        return d;
      });

      const last7Labels = last7.map(d =>
        d.toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit' })
      );

      const last7Hours = last7.map(d => {
        const ds = d.toDateString();
        return toHours(
          sessions.filter(s => new Date(s.date).toDateString() === ds)
            .reduce((a, s) => a + s.durationSeconds, 0)
        );
      });

      const isDark = document.documentElement.classList.contains('dark');
      const gridColor   = isDark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.07)';
      const tickColor   = isDark ? '#94a3b8' : '#64748b';
      const tooltipBg   = isDark ? '#1e293b' : '#fff';
      const tooltipText = isDark ? '#f1f5f9' : '#1e293b';

      useChart(weeklyChartRef, () => ({
        type: 'bar',
        data: {
          labels: last7Labels,
          datasets: [{
            label: 'Horas estudadas',
            data: last7Hours,
            backgroundColor: last7Hours.map((_, i) =>
              i === 6 ? '#10B981' : (isDark ? 'rgba(99,102,241,0.55)' : 'rgba(99,102,241,0.45)')
            ),
            borderColor: last7Hours.map((_, i) => i === 6 ? '#059669' : '#6366f1'),
            borderWidth: 1.5,
            borderRadius: 8,
            borderSkipped: false,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: tooltipBg,
              titleColor: tooltipText,
              bodyColor: tickColor,
              borderColor: isDark ? '#334155' : '#e2e8f0',
              borderWidth: 1,
              padding: 10,
              callbacks: {
                label: ctx => ` ${ctx.parsed.y}h estudadas`,
              }
            }
          },
          scales: {
            x: {
              grid: { color: gridColor },
              ticks: { color: tickColor, font: { size: 11, family: 'Inter' } },
            },
            y: {
              beginAtZero: true,
              grid: { color: gridColor },
              ticks: {
                color: tickColor,
                font: { size: 11, family: 'Inter' },
                callback: v => `${v}h`,
              },
            }
          }
        }
      }), [sessions.length, isDark]);

      const subjectSecs = subjects.map(s => ({
        subject: s,
        sec: sessions.filter(sess => sess.subjectId === s.id)
          .reduce((a, sess) => a + sess.durationSeconds, 0)
      })).filter(x => x.sec > 0);

      const doughnutColors = [
        '#6366f1','#10B981','#3B82F6','#EC4899','#F97316',
        '#8B5CF6','#14B8A6','#F59E0B','#EF4444','#84CC16',
      ];

      useChart(subjectsChartRef, () => {
        if (subjectSecs.length === 0) return null;
        return {
          type: 'doughnut',
          data: {
            labels: subjectSecs.map(x => x.subject.name),
            datasets: [{
              data: subjectSecs.map(x => toHours(x.sec)),
              backgroundColor: subjectSecs.map((_, i) => doughnutColors[i % doughnutColors.length]),
              borderColor: isDark ? '#1e293b' : '#fff',
              borderWidth: 3,
              hoverOffset: 8,
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '68%',
            plugins: {
              legend: {
                position: 'bottom',
                labels: {
                  color: tickColor,
                  font: { size: 11, family: 'Inter' },
                  padding: 14,
                  boxWidth: 12,
                  boxHeight: 12,
                  usePointStyle: true,
                }
              },
              tooltip: {
                backgroundColor: tooltipBg,
                titleColor: tooltipText,
                bodyColor: tickColor,
                borderColor: isDark ? '#334155' : '#e2e8f0',
                borderWidth: 1,
                padding: 10,
                callbacks: {
                  label: ctx => ` ${ctx.label}: ${ctx.parsed}h`,
                }
              }
            }
          }
        };
      }, [sessions.length, subjects.length, isDark]);

      const filteredSessions = [...sessions]
        .filter(s => !histFilter || s.subjectId === histFilter)
        .sort((a, b) => new Date(b.date) - new Date(a.date));

      const totalPages   = Math.ceil(filteredSessions.length / HIST_PER_PAGE);
      const pagedSessions = filteredSessions.slice((histPage - 1) * HIST_PER_PAGE, histPage * HIST_PER_PAGE);

      useEffect(() => setHistPage(1), [histFilter]);

      const summaryCards = [
        {
          label: 'Hoje',
          value: formatTime(todaySec),
          sub: `${sessions.filter(s => new Date(s.date).toDateString() === today).length} sessões`,
          color: '#10B981', bg: 'rgba(16,185,129,0.1)',
          icon: (
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
            </svg>
          )
        },
        {
          label: 'Esta Semana',
          value: formatTime(weekSec),
          sub: `Semana ${currentWeek}`,
          color: '#6366F1', bg: 'rgba(99,102,241,0.1)',
          icon: (
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
          )
        },
        {
          label: 'Este Mês',
          value: formatTime(monthSec),
          sub: now.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }),
          color: '#3B82F6', bg: 'rgba(59,130,246,0.1)',
          icon: (
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
            </svg>

        },
        {
          label: 'Total Acumulado',
          value: formatTime(totalSec),

          icon: (
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">

      return (
        <div className="animate-fade-in">

                <div className="flex items-start justify-between gap-2">

                    <p className="text-xs font-bold uppercase tracking-widest text-slate-400 dark:text-slate-500 mb-1">{card.label}</p>
                    <p className="text-2xl font-black tabular-nums" style={{ color: card.color }}>{card.value}</p>
                    <p className="text-xs text-slate-400 mt-0.5">{card.sub}</p>
                  </div>
                  <div
                    className="flex-shrink-0 w-10 h-10 rounded-xl flex items-center justify-center"

          </div>

          <div className="grid grid-cols-1 lg:grid-cols-5 gap-6 mb-8">
            <div className="lg:col-span-3 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-6 shadow-sm">
              <div className="flex items-center justify-between mb-5">
                <div>
                  <h2 className="text-sm font-bold text-slate-700 dark:text-slate-200">Últimos 7 Dias</h2>
                  <p className="text-xs text-slate-400 mt-0.5">Horas estudadas por dia</p>
                </div>
                <div className="flex items-center gap-2">
                  <span className="w-3 h-3 rounded-sm" style={{ backgroundColor: '#10B981' }} />
                  <span className="text-xs text-slate-400">Hoje</span>
                  <span className="w-3 h-3 rounded-sm ml-1" style={{ backgroundColor: 'rgba(99,102,241,0.55)' }} />
                  <span className="text-xs text-slate-400">Anteriores</span>
                </div>
              </div>
              {sessions.length === 0 ? (
                <div className="flex items-center justify-center h-48 text-slate-400 dark:text-slate-600 text-sm">
                  Nenhuma sessão registrada ainda.
                </div>
              ) : (
                <div style={{ height: 220, position: 'relative' }}>
                  <canvas id="weeklyChart" ref={weeklyChartRef} />
                </div>
              )}
            </div>

            <div className="lg:col-span-2 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-6 shadow-sm">
              <div className="mb-5">
                <h2 className="text-sm font-bold text-slate-700 dark:text-slate-200">Por Disciplina</h2>
                <p className="text-xs text-slate-400 mt-0.5">Proporção de tempo acumulado</p>
              </div>

              ) : (
                <div style={{ height: 220, position: 'relative' }}>
                  <canvas id="subjectsChart" ref={subjectsChartRef} />

              )}
            </div>
          </div>

          <div className="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 p-5 border-b border-slate-200 dark:border-slate-700">
              <div>
                <h2 className="text-sm font-bold text-slate-700 dark:text-slate-200">Histórico de Sessões</h2>
                <p className="text-xs text-slate-400 mt-0.5">{filteredSessions.length} registro(s)</p>
              </div>
              <select
                id="history-subject-filter"
                value={histFilter}
                onChange={e => setHistFilter(e.target.value)}
                className="text-xs px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-400 transition-all"
              >
                <option value="">Todas as disciplinas</option>
                {subjects.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
              </select>
            </div>

            {filteredSessions.length === 0 ? (
              <div className="flex items-center justify-center py-12 text-sm text-slate-400 dark:text-slate-600">
                Nenhuma sessão encontrada.
              </div>
            ) : (
              <>
                <div className="overflow-x-auto">
                  <table className="w-full text-sm">
                    <thead>
                      <tr className="bg-slate-50 dark:bg-slate-900/50">
                        <th className="text-left px-5 py-3 text-xs font-bold uppercase tracking-widest text-slate-400 dark:text-slate-500">Disciplina</th>
                        <th className="text-left px-5 py-3 text-xs font-bold uppercase tracking-widest text-slate-400 dark:text-slate-500">Data</th>
                        <th className="text-left px-5 py-3 text-xs font-bold uppercase tracking-widest text-slate-400 dark:text-slate-500">Duração</th>
                        <th className="text-left px-5 py-3 text-xs font-bold uppercase tracking-widest text-slate-400 dark:text-slate-500">Anotações</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100 dark:divide-slate-700/60">
                      {pagedSessions.map((session, idx) => {
                        const subj = subjects.find(s => s.id === session.subjectId);
                        const c    = SUBJECT_COLORS.find(col => col.id === subj?.color);
                        const d    = new Date(session.date);
                        return (
                          <tr
                            key={session.id}
                            className="hover:bg-slate-50 dark:hover:bg-slate-700/30 transition-colors"
                          >
                            <td className="px-5 py-3.5">
                              <div className="flex items-center gap-2">
                                <span
                                  className="flex-shrink-0 w-2 h-6 rounded-full"
                                  style={{ backgroundColor: c?.bg || '#64748b' }}
                                />
                                <span className="font-semibold text-slate-700 dark:text-slate-200 truncate max-w-[140px]">
                                  {subj?.name || <span className="text-slate-400 italic">Removida</span>}
                                </span>
                              </div>
                            </td>
                            <td className="px-5 py-3.5 text-slate-500 dark:text-slate-400 whitespace-nowrap">
                              <div>
                                <span className="font-medium text-slate-700 dark:text-slate-300">
                                  {d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' })}
                                </span>
                                <span className="block text-xs mt-0.5 text-slate-400">
                                  {d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}
                                </span>
                              </div>
                            </td>
                            <td className="px-5 py-3.5">
                              <span
                                className="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold"
                                style={{ backgroundColor: (c?.bg || '#64748b') + '20', color: c?.bg || '#64748b' }}
                              >
                                {formatTime(session.durationSeconds)}
                              </span>
                            </td>
                            <td className="px-5 py-3.5 text-xs text-slate-500 dark:text-slate-400 max-w-[200px]">
                              {session.notes
                                ? <span className="truncate block" title={session.notes}>📝 {session.notes}</span>
                                : <span className="text-slate-300 dark:text-slate-600">—</span>
                              }
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>

                {totalPages > 1 && (
                  <div className="flex items-center justify-between px-5 py-3 border-t border-slate-100 dark:border-slate-700">
                    <p className="text-xs text-slate-400">
                      Página {histPage} de {totalPages} &middot; {filteredSessions.length} registros
                    </p>
                    <div className="flex gap-1.5">
                      <button
                        onClick={() => setHistPage(p => Math.max(1, p - 1))}
                        disabled={histPage === 1}
                        className="px-3 py-1.5 text-xs font-semibold rounded-lg border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed transition-all"
                      >
                        ← Anterior
                      </button>
                      <button
                        onClick={() => setHistPage(p => Math.min(totalPages, p + 1))}
                        disabled={histPage === totalPages}
                        className="px-3 py-1.5 text-xs font-semibold rounded-lg border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed transition-all"
                      >
                        Próxima →
                      </button>
                    </div>
                  </div>
                )}
              </>
            )}
          </div>
        </div>
      );
    }

    // =============================================
    // COMPONENTE & ÁUDIO: POMODORO
    // =============================================

    function playPomodoroAlertSound(isFocusFinish = true) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        if (ctx.state === 'suspended') {
          ctx.resume();
        }
        const now = ctx.currentTime;

        if (isFocusFinish) {
          // Três notas harmônicas suaves: C5 (523Hz), E5 (659Hz), G5 (784Hz)
          [523.25, 659.25, 783.99].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.15);
            gain.gain.setValueAtTime(0, now + idx * 0.15);
            gain.gain.linearRampToValueAtTime(0.2, now + idx * 0.15 + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.15 + 0.28);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + idx * 0.15);
            osc.stop(now + idx * 0.15 + 0.3);
          });
        } else {
          // Dois tons suaves para fim de descanso
          [659.25, 523.25].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.18);
            gain.gain.setValueAtTime(0, now + idx * 0.18);
            gain.gain.linearRampToValueAtTime(0.18, now + idx * 0.18 + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.18 + 0.3);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + idx * 0.18);
            osc.stop(now + idx * 0.18 + 0.32);
          });
        }
      } catch (e) {
        console.warn('Web Audio indisponível:', e);
      }
    }

    const POMODORO_CONFIGS = {
      focus: {
        id: 'focus',
        label: 'Foco',
        minutes: 25,
        totalSeconds: 25 * 60,
        color: '#EF4444',
        accentBg: 'rgba(239, 68, 68, 0.1)',
        badge: '🍅 Ciclo de Foco (25 min)',
      },
      shortBreak: {
        id: 'shortBreak',
        label: 'Pausa Curta',
        minutes: 5,
        totalSeconds: 5 * 60,
        color: '#10B981',
        accentBg: 'rgba(16, 185, 129, 0.1)',
        badge: '☕ Pausa Curta (5 min)',
      },
      longBreak: {
        id: 'longBreak',
        label: 'Pausa Longa',
        minutes: 15,
        totalSeconds: 15 * 60,
        color: '#3B82F6',
        accentBg: 'rgba(59, 130, 246, 0.1)',
        badge: '🌴 Pausa Longa (15 min)',
      },
    };

    function PomodoroPage() {
      const [subjects] = useLocalStorage('studyflow-subjects', []);
      const [sessions, setSessions] = useLocalStorage('studyflow-sessions', []);
      const [dailyCycles, setDailyCycles] = useLocalStorage('studyflow-pomodoro-cycles', { date: '', count: 0 });
      const [selectedSubject, setSelectedSubject] = useState('');
      const [mode, setMode] = useState('focus');
      const [status, setStatus] = useState('idle'); // 'idle' | 'running' | 'paused'
      const [timeLeft, setTimeLeft] = useState(25 * 60);
      const [feedbackMsg, setFeedbackMsg] = useState(null);

      const endTimeRef = useRef(null);
      const todayStr = new Date().toDateString();
      const todayCycles = dailyCycles.date === todayStr ? dailyCycles.count : 0;

      const currentConfig = POMODORO_CONFIGS[mode];
      const activeSubject = subjects.find(s => s.id === selectedSubject);
      const subjectColorDef = SUBJECT_COLORS.find(c => c.id === activeSubject?.color) || SUBJECT_COLORS[0];

      // Sincronização do temporizador resiliente a aba em segundo plano
      const tick = useCallback(() => {
        if (!endTimeRef.current) return;
        const now = Date.now();
        const diff = Math.max(0, Math.ceil((endTimeRef.current - now) / 1000));
        setTimeLeft(diff);

        if (diff <= 0) {
          endTimeRef.current = null;
          setStatus('idle');

          const wasFocus = mode === 'focus';
          playPomodoroAlertSound(wasFocus);

          if (wasFocus) {
            // Salva sessão de 25 min no histórico da disciplina selecionada
            if (selectedSubject) {
              const newSession = {
                id: `sess-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
                subjectId: selectedSubject,
                durationSeconds: 25 * 60,
                date: new Date().toISOString(),
                notes: '🍅 Ciclo Pomodoro concluído (25 min)',
              };
              setSessions(prev => [newSession, ...prev]);
            }

            const newCount = todayCycles + 1;
            setDailyCycles({ date: todayStr, count: newCount });

            // A cada 4 ciclos de foco completados, recomenda pausa longa
            const nextMode = newCount % 4 === 0 ? 'longBreak' : 'shortBreak';
            setFeedbackMsg({
              type: 'success',
              title: '🎉 Ciclo de Foco Concluído!',
              desc: selectedSubject
                ? `25 minutos registrados para "${activeSubject?.name}". Aproveite sua pausa!`
                : '25 minutos concluídos com sucesso! Aproveite sua pausa.',
            });
            setMode(nextMode);
            setTimeLeft(POMODORO_CONFIGS[nextMode].totalSeconds);
          } else {
            setFeedbackMsg({
              type: 'info',
              title: '☕ Pausa Finalizada!',
              desc: 'Energias recarregadas. Pronto para o próximo ciclo de foco?',
            });
            setMode('focus');
            setTimeLeft(POMODORO_CONFIGS.focus.totalSeconds);
          }
        }
      }, [mode, selectedSubject, activeSubject, todayCycles, todayStr, setSessions, setDailyCycles]);

      useEffect(() => {
        if (status !== 'running') return;
        tick();
        const intervalId = setInterval(tick, 500);

        function handleVisibilityChange() {
          if (document.visibilityState === 'visible') {
            tick();
          }
        }
        document.addEventListener('visibilitychange', handleVisibilityChange);

        return () => {
          clearInterval(intervalId);
          document.removeEventListener('visibilitychange', handleVisibilityChange);
        };
      }, [status, tick]);

      function handleSelectMode(newMode) {
        if (status === 'running') {
          const confirmChange = window.confirm('O temporizador está ativo. Deseja mudar de modo e reiniciar a contagem?');
          if (!confirmChange) return;
        }
        endTimeRef.current = null;
        setStatus('idle');
        setMode(newMode);
        setTimeLeft(POMODORO_CONFIGS[newMode].totalSeconds);
      }

      function handleStart() {
        if (status === 'running') return;
        endTimeRef.current = Date.now() + timeLeft * 1000;
        setStatus('running');
      }

      function handlePause() {
        if (status !== 'running') return;
        if (endTimeRef.current) {
          const remaining = Math.max(0, Math.ceil((endTimeRef.current - Date.now()) / 1000));
          setTimeLeft(remaining);
        }
        endTimeRef.current = null;
        setStatus('paused');
      }

      function handleResume() {
        if (status !== 'paused') return;
        endTimeRef.current = Date.now() + timeLeft * 1000;
        setStatus('running');
      }

      function handleReset() {
        endTimeRef.current = null;
        setStatus('idle');
        setTimeLeft(currentConfig.totalSeconds);
      }

      function handleSkip() {
        const confirmSkip = window.confirm('Deseja pular esta etapa?');
        if (!confirmSkip) return;
        endTimeRef.current = null;
        setStatus('idle');
        const nextMode = mode === 'focus'
          ? (todayCycles > 0 && todayCycles % 4 === 0 ? 'longBreak' : 'shortBreak')
          : 'focus';
        setMode(nextMode);
        setTimeLeft(POMODORO_CONFIGS[nextMode].totalSeconds);
      }

      const totalSec = currentConfig.totalSeconds;
      const progressPercent = Math.min(100, Math.max(0, Math.round(((totalSec - timeLeft) / totalSec) * 100)));
      const minutesDisplay = String(Math.floor(timeLeft / 60)).padStart(2, '0');
      const secondsDisplay = String(timeLeft % 60).padStart(2, '0');

      return (
        <div className="max-w-2xl mx-auto animate-fade-in">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
            <div>
              <h1 className="text-2xl font-bold text-slate-800 dark:text-white flex items-center gap-2.5">
                <span>🍅</span> Pomodoro
              </h1>
              <p className="text-sm text-slate-500 dark:text-slate-400 mt-0.5">
                Aumente sua produtividade alternando blocos de foco total com pausas regulares.
              </p>
            </div>

            {/* Contador de Ciclos do Dia */}
            <div className="flex items-center gap-3 px-4 py-2.5 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm self-start sm:self-auto">
              <div className="w-10 h-10 rounded-xl bg-red-100 dark:bg-red-900/30 flex items-center justify-center text-xl">
                🍅
              </div>
              <div>
                <p className="text-[11px] font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500">
                  Ciclos Hoje
                </p>
                <div className="flex items-center gap-1.5">
                  <span className="text-lg font-black text-slate-800 dark:text-white">
                    {todayCycles}
                  </span>
                  <span className="text-xs text-slate-400">
                    {todayCycles === 1 ? 'concluído' : 'concluídos'}
                  </span>
                </div>
              </div>
            </div>
          </div>

          {/* Feedback Toast */}
          {feedbackMsg && (
            <div className="mb-6 p-4 rounded-2xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 flex items-start justify-between gap-3 animate-slide-up">
              <div className="flex items-start gap-3">
                <span className="text-2xl">✨</span>
                <div>
                  <h4 className="text-sm font-bold text-emerald-800 dark:text-emerald-300">
                    {feedbackMsg.title}
                  </h4>
                  <p className="text-xs text-emerald-700 dark:text-emerald-400 mt-0.5">
                    {feedbackMsg.desc}
                  </p>
                </div>
              </div>
              <button
                onClick={() => setFeedbackMsg(null)}
                className="text-emerald-500 hover:text-emerald-700 dark:hover:text-emerald-300 text-xs font-bold px-2 py-1 cursor-pointer"
              >
                ✕
              </button>
            </div>
          )}

          {/* Card Principal do Pomodoro */}
          <div className="relative bg-white dark:bg-slate-800 rounded-3xl shadow-xl dark:shadow-slate-900/60 overflow-hidden border border-slate-200 dark:border-slate-700">
            {/* Faixa colorida do modo */}
            <div
              className="h-2 w-full transition-all duration-500"
              style={{ backgroundColor: currentConfig.color }}
            />

            <div className="p-6 sm:p-8">
              {/* Seletor de Modo (Foco, Pausa Curta, Pausa Longa) */}
              <div className="flex p-1.5 rounded-2xl bg-slate-100 dark:bg-slate-900/80 mb-6 gap-1.5">
                {Object.values(POMODORO_CONFIGS).map(cfg => {
                  const isSelected = mode === cfg.id;
                  return (
                    <button
                      key={cfg.id}
                      type="button"
                      onClick={() => handleSelectMode(cfg.id)}
                      className={`flex-1 py-2.5 px-3 rounded-xl text-xs sm:text-sm font-bold transition-all duration-200 flex items-center justify-center gap-1.5 cursor-pointer ${
                        isSelected
                          ? 'bg-white dark:bg-slate-800 text-slate-800 dark:text-white shadow-sm'
                          : 'text-slate-500 hover:text-slate-800 dark:hover:text-white'
                      }`}
                    >
                      <span className="w-2 h-2 rounded-full" style={{ backgroundColor: cfg.color }} />
                      <span>{cfg.label}</span>
                      <span className="text-[11px] opacity-60 font-normal">({cfg.minutes}m)</span>
                    </button>
                  );
                })}
              </div>

              {/* Vínculo com Disciplina */}
              <div className="mb-6">
                <div className="flex items-center justify-between mb-2">
                  <label htmlFor="pomodoro-subject-select" className="text-xs font-bold uppercase tracking-widest text-slate-400 dark:text-slate-500">
                    Associar Disciplina {mode === 'focus' && <span className="text-red-500">*</span>}
                  </label>
                  {activeSubject && (
                    <span className="text-xs font-semibold px-2 py-0.5 rounded-full" style={{ backgroundColor: `${subjectColorDef.bg}20`, color: subjectColorDef.bg }}>
                      Salvará nesta matéria
                    </span>
                  )}
                </div>

                <div className="relative">
                  <select
                    id="pomodoro-subject-select"
                    value={selectedSubject}
                    onChange={e => setSelectedSubject(e.target.value)}
                    disabled={status === 'running'}
                    className={`w-full appearance-none px-4 py-3 pr-10 rounded-xl text-sm font-semibold border transition-all focus:outline-none focus:ring-2 ${
                      status === 'running'
                        ? 'bg-slate-100 dark:bg-slate-700/50 text-slate-400 dark:text-slate-500 border-slate-200 dark:border-slate-700 cursor-not-allowed'
                        : 'bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-100 border-slate-300 dark:border-slate-600 focus:ring-red-400 hover:border-red-400 cursor-pointer'
                    }`}
                  >
                    <option value="">-- Nenhuma disciplina (modo avulso) --</option>
                    {subjects.map(s => (
                      <option key={s.id} value={s.id}>
                        {s.name}{s.weeklyHours ? ` · Meta: ${s.weeklyHours}h/sem` : ''}
                      </option>
                    ))}
                  </select>
                  <span className="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                      <polyline points="6 9 12 15 18 9"/>
                    </svg>
                  </span>
                </div>
                {mode === 'focus' && !selectedSubject && (
                  <p className="mt-1.5 text-xs text-slate-400 dark:text-slate-500">
                    💡 Dica: Selecione uma disciplina para que os 25 minutos sejam computados automaticamente no seu progresso de estudos.
                  </p>
                )}
              </div>

              {/* Display do Timer e Progresso */}
              <div className="flex flex-col items-center justify-center py-6">
                <div className="mb-4 px-3.5 py-1 rounded-full text-xs font-bold uppercase tracking-widest"
                  style={{ backgroundColor: currentConfig.accentBg, color: currentConfig.color }}>
                  {currentConfig.badge}
                </div>

                {/* Display Numérico */}
                <div
                  id="pomodoro-display"
                  className="text-7xl sm:text-8xl font-black tabular-nums tracking-tight transition-all my-2"
                  style={{
                    color: status === 'running' ? currentConfig.color : undefined,
                    fontVariantNumeric: 'tabular-nums',
                    textShadow: status === 'running' ? `0 0 35px ${currentConfig.color}40` : 'none',
                  }}
                >
                  <span className={status === 'running' ? '' : 'text-slate-700 dark:text-slate-200'}>
                    {minutesDisplay}:{secondsDisplay}
                  </span>
                </div>

                {/* Barra de Progresso com Porcentagem */}
                <div className="w-full max-w-sm mt-4">
                  <div className="flex items-center justify-between text-xs text-slate-400 font-semibold mb-1.5">
                    <span>{progressPercent}% decorrido</span>
                    <span>{formatTime(timeLeft)} restantes</span>
                  </div>
                  <div className="h-2.5 w-full bg-slate-100 dark:bg-slate-700 rounded-full overflow-hidden">
                    <div
                      className="h-full rounded-full transition-all duration-500"
                      style={{
                        width: `${progressPercent}%`,
                        backgroundColor: currentConfig.color,
                      }}
                    />
                  </div>
                </div>
              </div>

              {/* Botões de Ação */}
              <div className="mt-6 flex flex-wrap gap-3 justify-center items-center">
                {status === 'idle' && (
                  <button
                    id="btn-pomodoro-start"
                    onClick={handleStart}
                    className="flex items-center gap-2 px-8 py-3.5 rounded-xl text-sm font-bold text-white shadow-lg hover:scale-[1.03] active:scale-[0.97] transition-all cursor-pointer"
                    style={{
                      backgroundColor: currentConfig.color,
                      boxShadow: `0 10px 25px -5px ${currentConfig.color}60`,
                    }}
                  >
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                      <polygon points="5 3 19 12 5 21 5 3"/>
                    </svg>
                    Iniciar {currentConfig.label}
                  </button>
                )}

                {status === 'running' && (
                  <button
                    id="btn-pomodoro-pause"
                    onClick={handlePause}
                    className="flex items-center gap-2 px-8 py-3.5 rounded-xl text-sm font-bold bg-amber-500 hover:bg-amber-600 text-white shadow-lg shadow-amber-500/30 hover:scale-[1.03] active:scale-[0.97] transition-all cursor-pointer"
                  >
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                      <rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>
                    </svg>
                    Pausar
                  </button>
                )}

                {status === 'paused' && (
                  <button
                    id="btn-pomodoro-resume"
                    onClick={handleResume}
                    className="flex items-center gap-2 px-8 py-3.5 rounded-xl text-sm font-bold text-white shadow-lg hover:scale-[1.03] active:scale-[0.97] transition-all cursor-pointer"
                    style={{
                      backgroundColor: currentConfig.color,
                      boxShadow: `0 10px 25px -5px ${currentConfig.color}60`,
                    }}
                  >
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                      <polygon points="5 3 19 12 5 21 5 3"/>
                    </svg>
                    Retomar
                  </button>
                )}

                {/* Reiniciar */}
                <button
                  id="btn-pomodoro-reset"
                  onClick={handleReset}
                  title="Reiniciar tempo desta etapa"
                  className="flex items-center gap-1.5 px-4 py-3.5 rounded-xl text-sm font-semibold bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-600 dark:text-slate-300 transition-all cursor-pointer"
                >
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                    <path d="M3 3v5h5"/>
                  </svg>
                  Reiniciar
                </button>

                {/* Pular Etapa */}
                <button
                  id="btn-pomodoro-skip"
                  onClick={handleSkip}
                  title="Pular para a próxima etapa"
                  className="flex items-center gap-1.5 px-4 py-3.5 rounded-xl text-sm font-semibold border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-500 dark:text-slate-400 transition-all cursor-pointer"
                >
                  <span>Pular</span>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <polygon points="5 4 15 12 5 20 5 4"/>
                    <line x1="19" y1="5" x2="19" y2="19"/>
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // =============================================
    // COMPONENTE: CRONOGRAMA SEMANAL (SchedulePage)
    // =============================================

    const SCHEDULE_DAYS = [
      { id: 'seg', label: 'Segunda-feira', short: 'Seg', dayNum: 1 },
      { id: 'ter', label: 'Terça-feira',   short: 'Ter', dayNum: 2 },
      { id: 'qua', label: 'Quarta-feira',  short: 'Qua', dayNum: 3 },
      { id: 'qui', label: 'Quinta-feira',  short: 'Qui', dayNum: 4 },
      { id: 'sex', label: 'Sexta-feira',   short: 'Sex', dayNum: 5 },
      { id: 'sab', label: 'Sábado',        short: 'Sáb', dayNum: 6 },
      { id: 'dom', label: 'Domingo',       short: 'Dom', dayNum: 0 },
    ];

    function SchedulePage() {
      const [subjects] = useLocalStorage('studyflow-subjects', []);
      const [schedule, setSchedule] = useLocalStorage('studyflow-schedule', []);

      const [isModalOpen, setIsModalOpen] = useState(false);
      const [formDay, setFormDay] = useState('seg');
      const [formSubjectId, setFormSubjectId] = useState('');
      const [formStartTime, setFormStartTime] = useState('08:00');
      const [formEndTime, setFormEndTime] = useState('10:00');
      const [formNotes, setFormNotes] = useState('');
      const [formError, setFormError] = useState('');

      // Data de hoje formatada YYYY-MM-DD para marcar/desmarcar conclusão
      const today = new Date();
      const todayStr = today.toISOString().split('T')[0];
      const todayDayNum = today.getDay(); // 0 = Domingo, 1 = Segunda, etc.

      function openNewBlockModal(dayId = 'seg') {
        setFormDay(dayId);
        setFormSubjectId(subjects[0]?.id || '');
        setFormStartTime('08:00');
        setFormEndTime('10:00');
        setFormNotes('');
        setFormError('');
        setIsModalOpen(true);
      }

      function handleSaveBlock(e) {
        e?.preventDefault();
        if (!formSubjectId) {
          setFormError('Por favor, selecione uma disciplina.');
          return;
        }
        if (!formStartTime || !formEndTime) {
          setFormError('Informe os horários de início e término.');
          return;
        }
        if (formStartTime >= formEndTime) {
          setFormError('O horário de término deve ser posterior ao horário de início.');
          return;
        }

        const newBlock = {
          id: `block-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
          day: formDay,
          subjectId: formSubjectId,
          startTime: formStartTime,
          endTime: formEndTime,
          notes: formNotes.trim(),
          completedDates: [],
        };

        setSchedule(prev => [...prev, newBlock]);
        setIsModalOpen(false);
      }

      function handleDeleteBlock(blockId) {
        if (window.confirm('Tem certeza que deseja excluir este bloco do cronograma?')) {
          setSchedule(prev => prev.filter(b => b.id !== blockId));
        }
      }

      function handleToggleComplete(blockId) {
        setSchedule(prev => prev.map(block => {
          if (block.id !== blockId) return block;
          const completedList = block.completedDates || [];
          const isDoneToday = completedList.includes(todayStr);
          return {
            ...block,
            completedDates: isDoneToday
              ? completedList.filter(d => d !== todayStr)
              : [...completedList, todayStr],
          };
        }));
      }

      // Estatísticas rápidas da semana
      const totalBlocks = schedule.length;
      const todayScheduleDay = SCHEDULE_DAYS.find(d => d.dayNum === todayDayNum)?.id;
      const todayBlocks = schedule.filter(b => b.day === todayScheduleDay);
      const todayDone = todayBlocks.filter(b => (b.completedDates || []).includes(todayStr)).length;

      return (
        <div className="max-w-7xl mx-auto animate-fade-in">
          {/* Header da Página */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
            <div>
              <h1 className="text-2xl font-bold text-slate-800 dark:text-white flex items-center gap-2.5">
                <span>📅</span> Cronograma Semanal
              </h1>
              <p className="text-sm text-slate-500 dark:text-slate-400 mt-0.5">
                Organize seus horários de estudo por dia da semana e acompanhe seu cumprimento diário.
              </p>
            </div>

            <div className="flex items-center gap-3">
              <button
                id="btn-add-schedule-block"
                onClick={() => openNewBlockModal(todayScheduleDay || 'seg')}
                disabled={subjects.length === 0}
                className={`flex items-center gap-2 px-5 py-2.5 rounded-xl text-sm font-bold transition-all shadow-lg cursor-pointer ${
                  subjects.length === 0
                    ? 'bg-slate-200 dark:bg-slate-700 text-slate-400 cursor-not-allowed'
                    : 'bg-emerald-500 hover:bg-emerald-600 text-white shadow-emerald-500/30 hover:scale-[1.02] active:scale-[0.98]'
                }`}
              >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                  <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
                Novo Bloco de Estudo
              </button>
            </div>
          </div>

          {/* Cards de Resumo */}
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
            <div className="p-4 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 flex items-center gap-3.5 shadow-sm">
              <div className="w-11 h-11 rounded-xl bg-blue-100 dark:bg-blue-900/40 text-blue-600 dark:text-blue-400 flex items-center justify-center">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                  <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
                </svg>
              </div>
              <div>
                <p className="text-xs text-slate-400 font-semibold uppercase tracking-wider">Total Planejado</p>
                <p className="text-xl font-bold text-slate-800 dark:text-white">{totalBlocks} {totalBlocks === 1 ? 'bloco' : 'blocos'}</p>
              </div>
            </div>

            <div className="p-4 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 flex items-center gap-3.5 shadow-sm">
              <div className="w-11 h-11 rounded-xl bg-emerald-100 dark:bg-emerald-900/40 text-emerald-600 dark:text-emerald-400 flex items-center justify-center">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                  <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
                </svg>
              </div>
              <div>
                <p className="text-xs text-slate-400 font-semibold uppercase tracking-wider">Meta de Hoje</p>
                <p className="text-xl font-bold text-slate-800 dark:text-white">
                  {todayDone} / {todayBlocks.length} concluídos
                </p>
              </div>
            </div>

            <div className="p-4 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 flex items-center gap-3.5 shadow-sm">
              <div className="w-11 h-11 rounded-xl bg-purple-100 dark:bg-purple-900/40 text-purple-600 dark:text-purple-400 flex items-center justify-center">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                  <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                </svg>
              </div>
              <div>
                <p className="text-xs text-slate-400 font-semibold uppercase tracking-wider">Disciplinas em Grade</p>
                <p className="text-xl font-bold text-slate-800 dark:text-white">
                  {new Set(schedule.map(b => b.subjectId)).size} de {subjects.length}
                </p>
              </div>
            </div>
          </div>

          {subjects.length === 0 && (
            <div className="mb-6 p-4 rounded-2xl bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800 flex items-center gap-3 text-amber-800 dark:text-amber-300 text-sm">
              <span>⚠️</span>
              <p>Cadastre disciplinas na aba <strong>Disciplinas</strong> antes de criar blocos de estudo no cronograma.</p>
            </div>
          )}

          {/* Grade Semanal (Segunda a Domingo) */}
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-7 gap-3">
            {SCHEDULE_DAYS.map(day => {
              const isToday = day.dayNum === todayDayNum;
              const dayBlocks = schedule
                .filter(b => b.day === day.id)
                .sort((a, b) => a.startTime.localeCompare(b.startTime));

              return (
                <div
                  key={day.id}
                  className={`flex flex-col rounded-2xl bg-white dark:bg-slate-800/90 border transition-all ${
                    isToday
                      ? 'border-emerald-500 shadow-md shadow-emerald-500/10 ring-1 ring-emerald-500/50'
                      : 'border-slate-200 dark:border-slate-700/80 shadow-sm'
                  }`}
                >
                  {/* Cabeçalho da Coluna do Dia */}
                  <div className={`p-3 border-b flex items-center justify-between ${
                    isToday
                      ? 'bg-emerald-500/10 dark:bg-emerald-950/40 border-emerald-500/20'
                      : 'border-slate-100 dark:border-slate-700/60'
                  }`}>
                    <div>
                      <div className="flex items-center gap-1.5">
                        <span className="font-bold text-sm text-slate-800 dark:text-white">
                          {day.short}
                        </span>
                        {isToday && (
                          <span className="text-[10px] font-bold bg-emerald-500 text-white px-1.5 py-0.5 rounded-full uppercase tracking-wider">
                            Hoje
                          </span>
                        )}
                      </div>
                      <p className="text-[10px] text-slate-400 font-medium hidden sm:block">
                        {day.label}
                      </p>
                    </div>

                    <button
                      onClick={() => openNewBlockModal(day.id)}
                      disabled={subjects.length === 0}
                      title={`Adicionar bloco na ${day.label}`}
                      className="w-7 h-7 rounded-lg bg-slate-100 dark:bg-slate-700 hover:bg-emerald-500 hover:text-white dark:hover:bg-emerald-500 text-slate-500 dark:text-slate-300 flex items-center justify-center text-xs transition-colors cursor-pointer disabled:opacity-30 disabled:cursor-not-allowed"
                    >
                      +
                    </button>
                  </div>

                  {/* Lista de Blocos do Dia */}
                  <div className="p-2.5 flex-1 flex flex-col gap-2 min-h-[140px]">
                    {dayBlocks.length === 0 ? (
                      <div className="flex-1 flex flex-col items-center justify-center text-center p-3 border-2 border-dashed border-slate-100 dark:border-slate-700/50 rounded-xl">
                        <span className="text-xs text-slate-400">Sem estudos</span>
                        <button
                          onClick={() => openNewBlockModal(day.id)}
                          disabled={subjects.length === 0}
                          className="text-[11px] text-emerald-600 dark:text-emerald-400 font-semibold hover:underline mt-1 disabled:opacity-30 cursor-pointer"
                        >
                          + Adicionar
                        </button>
                      </div>
                    ) : (
                      dayBlocks.map(block => {
                        const subj = subjects.find(s => s.id === block.subjectId);
                        const cDef = SUBJECT_COLORS.find(c => c.id === subj?.color) || SUBJECT_COLORS[0];
                        const isDoneToday = (block.completedDates || []).includes(todayStr);

                        return (
                          <div
                            key={block.id}
                            className={`group relative p-2.5 rounded-xl border transition-all text-xs ${
                              isDoneToday
                                ? 'bg-slate-50 dark:bg-slate-900/60 border-slate-200 dark:border-slate-700/60 opacity-75'
                                : 'bg-white dark:bg-slate-800 border-slate-200/90 dark:border-slate-700 hover:shadow-md'
                            }`}
                            style={{
                              borderLeftWidth: '4px',
                              borderLeftColor: cDef.bg,
                            }}
                          >
                            {/* Topo do Card: Matéria e Excluir */}
                            <div className="flex items-start justify-between gap-1 mb-1">
                              <span className={`font-bold truncate ${isDoneToday ? 'line-through text-slate-400' : 'text-slate-800 dark:text-white'}`}>
                                {subj?.name || 'Disciplina excluída'}
                              </span>

                              <button
                                onClick={() => handleDeleteBlock(block.id)}
                                title="Excluir bloco"
                                className="opacity-0 group-hover:opacity-100 text-slate-400 hover:text-red-500 transition-opacity p-0.5 cursor-pointer"
                              >
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                  <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                                </svg>
                              </button>
                            </div>

                            {/* Horário */}
                            <div className="flex items-center gap-1 text-[11px] text-slate-500 dark:text-slate-400 font-medium mb-1.5">
                              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                              </svg>
                              <span>{block.startTime} — {block.endTime}</span>
                            </div>

                            {/* Notas / Meta */}
                            {block.notes && (
                              <p className="text-[11px] text-slate-600 dark:text-slate-300 italic mb-2 bg-slate-50 dark:bg-slate-900/40 p-1.5 rounded-lg border border-slate-100 dark:border-slate-700/40">
                                📌 {block.notes}
                              </p>
                            )}

                            {/* Botão de Concluir no Dia */}
                            <button
                              type="button"
                              onClick={() => handleToggleComplete(block.id)}
                              className={`w-full py-1 px-2 rounded-lg text-[10px] font-bold flex items-center justify-center gap-1.5 transition-all cursor-pointer ${
                                isDoneToday
                                  ? 'bg-emerald-500 text-white shadow-sm'
                                  : 'bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-600 dark:text-slate-300'
                              }`}
                            >
                              {isDoneToday ? (
                                <>
                                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3">
                                    <polyline points="20 6 9 17 4 12"/>
                                  </svg>
                                  <span>Concluído hoje</span>
                                </>
                              ) : (
                                <>
                                  <span className="w-2.5 h-2.5 rounded-sm border border-slate-400 inline-block" />
                                  <span>Marcar concluído</span>
                                </>
                              )}
                            </button>
                          </div>
                        );
                      })
                    )}
                  </div>
                </div>
              );
            })}
          </div>

          {/* Modal Adicionar Bloco de Estudo */}
          <Modal
            isOpen={isModalOpen}
            onClose={() => setIsModalOpen(false)}
            title="Adicionar Bloco de Estudo"
          >
            <form onSubmit={handleSaveBlock} className="space-y-4">
              {formError && (
                <div className="p-3 rounded-xl bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-800 text-xs text-red-600 dark:text-red-400">
                  {formError}
                </div>
              )}

              {/* Dia da Semana */}
              <div>
                <label className="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">
                  Dia da Semana
                </label>
                <select
                  value={formDay}
                  onChange={e => setFormDay(e.target.value)}
                  className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-sm font-semibold text-slate-800 dark:text-white focus:ring-2 focus:ring-emerald-400 focus:outline-none cursor-pointer"
                >

                    <option key={d.id} value={d.id}>

              <div>

                </label>

                  value={formSubjectId}
                  onChange={e => setFormSubjectId(e.target.value)}

                >
                  <option value="">-- Selecione uma disciplina --</option>

                    const c = SUBJECT_COLORS.find(col => col.id === s.color);
                    return (
                      <option key={s.id} value={s.id}>
                        {s.name} {c ? `(${c.label})` : ''}

                    );
                  })}
                </select>
              </div>

              {/* Horários Início e Término */}
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">
                    Início
                  </label>
                  <input
                    type="time"
                    value={formStartTime}
                    onChange={e => setFormStartTime(e.target.value)}
                    required
                    className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-sm font-semibold text-slate-800 dark:text-white focus:ring-2 focus:ring-emerald-400 focus:outline-none cursor-pointer"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">
                    Término
                  </label>
                  <input
                    type="time"
                    value={formEndTime}
                    onChange={e => setFormEndTime(e.target.value)}
                    required
                    className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-sm font-semibold text-slate-800 dark:text-white focus:ring-2 focus:ring-emerald-400 focus:outline-none cursor-pointer"
                  />
                </div>
              </div>

              {/* Anotação / Meta Rápida */}
              <div>
                <label className="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">
                  Anotação / Meta rápida (opcional)
                </label>
                <input
                  type="text"
                  placeholder="Ex: Resolver Lista 2, Revisão cap. 4"
                  value={formNotes}
                  onChange={e => setFormNotes(e.target.value)}
                  maxLength={80}
                  className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-sm text-slate-800 dark:text-white focus:ring-2 focus:ring-emerald-400 focus:outline-none"
                />
              </div>

              {/* Botões do Modal */}
              <div className="flex justify-end gap-2 pt-3 border-t border-slate-200 dark:border-slate-700">
                <button
                  type="button"
                  onClick={() => setIsModalOpen(false)}
                  className="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors cursor-pointer"
                >
                  Cancelar
                </button>
                <button
                  type="submit"
                  className="px-5 py-2 rounded-xl text-xs font-bold bg-emerald-500 hover:bg-emerald-600 text-white shadow-lg shadow-emerald-500/30 transition-all cursor-pointer"
                >
                  Salvar Bloco
                </button>
              </div>
            </form>
          </Modal>
        </div>
      );
    }

    // =============================================
    // COMPONENTE: GERENCIADOR DE TAREFAS (TasksPage)
    // =============================================

    const TASK_PRIORITIES = {
      urgent: { id: 'urgent', label: 'Urgente', badge: 'bg-rose-500/15 text-rose-600 dark:text-rose-400 border-rose-500/30', dot: 'bg-rose-500' },
      high:   { id: 'high',   label: 'Alta',    badge: 'bg-amber-500/15 text-amber-600 dark:text-amber-400 border-amber-500/30', dot: 'bg-amber-500' },
      medium: { id: 'medium', label: 'Média',   badge: 'bg-blue-500/15 text-blue-600 dark:text-blue-400 border-blue-500/30',     dot: 'bg-blue-500' },
      low:    { id: 'low',    label: 'Baixa',   badge: 'bg-slate-500/15 text-slate-600 dark:text-slate-400 border-slate-500/30', dot: 'bg-slate-400' },

          </svg>
        )

      {
        id: 'in_progress',

        dot: 'bg-blue-500',
        icon: (
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
            <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
          </svg>
        )
      },
      {
        id: 'done',

          </svg>

    const SUGGESTED_TASK_TAGS = ['Exercícios', 'Prova', 'Trabalho', 'Revisão', 'Leitura', 'Artigo', 'Projeto', 'Seminário'];

    const INITIAL_TASKS_DATA = [
      {
        id: 'task-1',

        description: 'Fazer as questões de cálculo e anotar dúvidas para tirar com o professor.',
        subjectId: null,

        dueDate: new Date(Date.now() + 86400000).toISOString().split('T')[0],

          { id: 'sub-1', title: 'Questões 1 a 5 (básicas)', completed: true },
          { id: 'sub-2', title: 'Questões 6 a 12 (avançadas)', completed: false },

        ],

      },
      {
