<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyFlow — Organização de Estudos</title>
  <meta name="description" content="Aplicativo de organização de estudos para gerenciar disciplinas, metas de horas e progresso acadêmico." />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            navy: {
              900: '#0F172A',
              800: '#1E293B',
              700: '#1E3A8A',
              600: '#2563EB',
            },
            emerald: {
              500: '#10B981',
              600: '#059669',
            },
            surface: {
              light: '#F8FAFC',
              dark: '#0F172A',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
          animation: {
            'fade-in': 'fadeIn 0.2s ease-out',
            'slide-up': 'slideUp 0.25s ease-out',
            'scale-in': 'scaleIn 0.15s ease-out',
          },
          keyframes: {
            fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
            slideUp: { '0%': { opacity: '0', transform: 'translateY(12px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
            scaleIn: { '0%': { opacity: '0', transform: 'scale(0.95)' }, '100%': { opacity: '1', transform: 'scale(1)' } },
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- React + ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone para JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, sans-serif; }

    /* Scrollbar personalizada */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    .dark ::-webkit-scrollbar-thumb { background: #334155; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }

    /* Transição suave de tema */
    *, *::before, *::after {
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.15s ease;
    }

    /* Glassmorphism */
    .glass {
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    /* Gradiente animado para o header da sidebar */
    .sidebar-gradient {
      background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 50%, #1d4ed8 100%);
    }

    /* Hover suave nos cards */
    .card-hover {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card-hover:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-navy-900 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, createContext, useContext, useRef } = React;

    // =============================================
    // HOOKS UTILITÁRIOS
    // =============================================

    function useLocalStorage(key, initialValue) {
      const [storedValue, setStoredValue] = useState(() => {
        try {
          const item = window.localStorage.getItem(key);
          return item ? JSON.parse(item) : initialValue;
        } catch (error) {
          console.warn(`Erro ao ler LocalStorage [${key}]:`, error);
          return initialValue;
        }
      });

      const setValue = useCallback((value) => {
        try {
          const valueToStore = value instanceof Function ? value(storedValue) : value;
          setStoredValue(valueToStore);
          window.localStorage.setItem(key, JSON.stringify(valueToStore));
        } catch (error) {
          console.warn(`Erro ao salvar no LocalStorage [${key}]:`, error);
        }
      }, [key, storedValue]);

      return [storedValue, setValue];
    }

    // =============================================
    // CONTEXTO DE TEMA
    // =============================================
    const ThemeContext = createContext(null);

    function ThemeProvider({ children }) {
      const [theme, setTheme] = useLocalStorage('studyflow-theme', 'dark');

      useEffect(() => {
        const root = document.documentElement;
        if (theme === 'dark') {
          root.classList.add('dark');
        } else {
          root.classList.remove('dark');
        }
      }, [theme]);

      const toggleTheme = useCallback(() => {
        setTheme(prev => prev === 'dark' ? 'light' : 'dark');
      }, [setTheme]);

      return (
        <ThemeContext.Provider value={{ theme, toggleTheme }}>
          {children}
        </ThemeContext.Provider>
      );
    }

    function useTheme() {
      return useContext(ThemeContext);
    }

    // =============================================
    // PALETA DE CORES PARA DISCIPLINAS
    // =============================================
    const SUBJECT_COLORS = [
      { id: 'blue',    label: 'Azul',     bg: '#3B82F6', light: '#EFF6FF', dark: '#1e3a8a' },
      { id: 'indigo',  label: 'Índigo',   bg: '#6366F1', light: '#EEF2FF', dark: '#312e81' },
      { id: 'purple',  label: 'Roxo',     bg: '#8B5CF6', light: '#F5F3FF', dark: '#4c1d95' },
      { id: 'pink',    label: 'Rosa',     bg: '#EC4899', light: '#FDF2F8', dark: '#831843' },
      { id: 'red',     label: 'Vermelho', bg: '#EF4444', light: '#FEF2F2', dark: '#7f1d1d' },
      { id: 'orange',  label: 'Laranja',  bg: '#F97316', light: '#FFF7ED', dark: '#7c2d12' },
      { id: 'amber',   label: 'Âmbar',    bg: '#F59E0B', light: '#FFFBEB', dark: '#78350f' },
      { id: 'lime',    label: 'Lima',     bg: '#84CC16', light: '#F7FEE7', dark: '#365314' },
      { id: 'emerald', label: 'Verde',    bg: '#10B981', light: '#ECFDF5', dark: '#064e3b' },
      { id: 'teal',    label: 'Teal',     bg: '#14B8A6', light: '#F0FDFA', dark: '#134e4a' },
      { id: 'cyan',    label: 'Ciano',    bg: '#06B6D4', light: '#ECFEFF', dark: '#164e63' },
      { id: 'slate',   label: 'Ardósia',  bg: '#64748B', light: '#F8FAFC', dark: '#1e293b' },
    ];

    // =============================================
    // COMPONENTE: COLOR PICKER
    // =============================================
    function ColorPicker({ selectedColor, onSelect }) {
      return (
        <div>
          <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">
            Cor da Disciplina
          </label>
          <div className="grid grid-cols-6 gap-2">
            {SUBJECT_COLORS.map(color => (
              <button
                key={color.id}
                type="button"
                title={color.label}
                onClick={() => onSelect(color.id)}
                className="relative w-9 h-9 rounded-lg transition-all duration-150 hover:scale-110 focus:outline-none"
                style={{ backgroundColor: color.bg }}
              >
                {selectedColor === color.id && (
                  <span className="absolute inset-0 flex items-center justify-center">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
                      <polyline points="20 6 9 17 4 12" />
                    </svg>
                  </span>
                )}
                {selectedColor === color.id && (
                  <span
                    className="absolute -inset-1 rounded-xl border-2 pointer-events-none"
                    style={{ borderColor: color.bg }}
                  />
                )}
              </button>
            ))}
          </div>
          {selectedColor && (
            <p className="mt-2 text-xs text-slate-500 dark:text-slate-400">
              Selecionado: <span className="font-semibold" style={{ color: SUBJECT_COLORS.find(c => c.id === selectedColor)?.bg }}>
                {SUBJECT_COLORS.find(c => c.id === selectedColor)?.label}
              </span>
            </p>
          )}
        </div>
      );
    }

    // =============================================
    // COMPONENTE: MODAL GENÉRICO
    // =============================================
    function Modal({ isOpen, onClose, title, children }) {
      useEffect(() => {
        if (isOpen) {
          document.body.style.overflow = 'hidden';
        } else {
          document.body.style.overflow = '';
        }
        return () => { document.body.style.overflow = ''; };
      }, [isOpen]);

      if (!isOpen) return null;

      return (
        <div
          className="fixed inset-0 z-50 flex items-center justify-center p-4 animate-fade-in"
          style={{ backgroundColor: 'rgba(0, 0, 0, 0.6)' }}
          onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}
        >
          <div className="bg-white dark:bg-navy-800 rounded-2xl shadow-2xl w-full max-w-md animate-scale-in">
            <div className="flex items-center justify-between p-5 border-b border-slate-200 dark:border-slate-700">
              <h2 className="text-lg font-bold text-slate-800 dark:text-white">{title}</h2>
              <button
                onClick={onClose}
                className="p-1.5 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 transition-all"
              >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                  <line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" />
                </svg>
              </button>
            </div>
            <div className="p-5">{children}</div>
          </div>
        </div>
      );
    }

    // =============================================
    // COMPONENTE: FORMULÁRIO DE DISCIPLINA
    // =============================================
    const EMPTY_FORM = { name: '', color: 'blue', weeklyHours: '' };

    function SubjectForm({ initialData, onSave, onCancel }) {
      const [form, setForm] = useState(initialData || EMPTY_FORM);
      const [errors, setErrors] = useState({});
      const nameRef = useRef(null);

      useEffect(() => {
        if (nameRef.current) nameRef.current.focus();
      }, []);

      function validate() {
        const errs = {};
        if (!form.name.trim()) errs.name = 'O nome da disciplina é obrigatório.';
        if (form.weeklyHours !== '' && (isNaN(form.weeklyHours) || Number(form.weeklyHours) < 0 || Number(form.weeklyHours) > 168)) {
          errs.weeklyHours = 'Informe um valor entre 0 e 168 horas.';
        }
        return errs;
      }

      function handleSubmit(e) {
        e.preventDefault();
        const errs = validate();
        if (Object.keys(errs).length > 0) {
          setErrors(errs);
          return;
        }
        onSave({
          ...form,
          name: form.name.trim(),
          weeklyHours: form.weeklyHours === '' ? null : Number(form.weeklyHours),
        });
      }

      return (
        <form onSubmit={handleSubmit} className="space-y-5">
          <div>
            <label htmlFor="subjectName" className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">
              Nome da Disciplina <span className="text-red-500">*</span>
            </label>
            <input
              id="subjectName"
              ref={nameRef}
              type="text"
              maxLength={60}
              placeholder="Ex: Cálculo I, História do Brasil..."
              value={form.name}
              onChange={e => { setForm(f => ({ ...f, name: e.target.value })); setErrors(er => ({ ...er, name: '' })); }}
              className={`w-full px-4 py-2.5 rounded-xl border text-sm bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 transition-all ${
                errors.name
                  ? 'border-red-400 focus:ring-red-300'
                  : 'border-slate-300 dark:border-slate-600 focus:ring-emerald-400 dark:focus:ring-emerald-500'
              }`}
            />
            {errors.name && <p className="mt-1.5 text-xs text-red-500">{errors.name}</p>}
          </div>

          <ColorPicker
            selectedColor={form.color}
            onSelect={color => setForm(f => ({ ...f, color }))}
          />

          <div>
            <label htmlFor="weeklyHours" className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">
              Meta de Horas Semanais
              <span className="ml-1.5 text-xs text-slate-400 font-normal">(opcional)</span>
            </label>
            <div className="relative">
              <input
                id="weeklyHours"
                type="number"
                min="0"
                max="168"
                step="0.5"
                placeholder="Ex: 10"
                value={form.weeklyHours}
                onChange={e => { setForm(f => ({ ...f, weeklyHours: e.target.value })); setErrors(er => ({ ...er, weeklyHours: '' })); }}
                className={`w-full px-4 py-2.5 pr-14 rounded-xl border text-sm bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 transition-all ${
                  errors.weeklyHours
                    ? 'border-red-400 focus:ring-red-300'
                    : 'border-slate-300 dark:border-slate-600 focus:ring-emerald-400 dark:focus:ring-emerald-500'
                }`}
              />
              <span className="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-slate-400 dark:text-slate-500 font-medium pointer-events-none">
                h/sem
              </span>
            </div>
            {errors.weeklyHours && <p className="mt-1.5 text-xs text-red-500">{errors.weeklyHours}</p>}
          </div>

          <div className="flex gap-3 pt-1">
            <button
              type="button"
              onClick={onCancel}
              className="flex-1 py-2.5 rounded-xl text-sm font-semibold border border-slate-300 dark:border-slate-600 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition-all"
            >
              Cancelar
            </button>
            <button
              type="submit"
              className="flex-1 py-2.5 rounded-xl text-sm font-semibold bg-emerald-500 hover:bg-emerald-600 text-white transition-all shadow-lg shadow-emerald-500/25 hover:shadow-emerald-500/40 hover:scale-[1.02] active:scale-[0.98]"
            >
              {initialData ? 'Salvar Alterações' : 'Adicionar Disciplina'}
            </button>
          </div>
        </form>
      );
    }

    // =============================================
    // COMPONENTE: CARD DE DISCIPLINA
    // =============================================
    function SubjectCard({ subject, onEdit, onDelete, dbFiles = [], onUploadFile, onViewFile, onDeleteFile, onPreviewFile }) {
      const [confirmDelete, setConfirmDelete] = useState(false);
      const [uploading, setUploading]         = useState(false);
      const colorDef = SUBJECT_COLORS.find(c => c.id === subject.color) || SUBJECT_COLORS[0];
      const isDark   = document.documentElement.classList.contains('dark');

      const subjectFiles = dbFiles.filter(f => f.subjectId === subject.id);

      async function handleFileSelect(e) {
        const file = e.target.files?.[0];
        if (!file) return;
        setUploading(true);
        try {
          await onUploadFile(file, subject.id);
        } catch (err) {
          alert('Erro ao salvar arquivo no IndexedDB: ' + err.message);
        } finally {
          setUploading(false);
          e.target.value = '';
        }
      }

      return (
        <div className="card-hover group relative bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl overflow-hidden shadow-sm hover:shadow-lg dark:hover:shadow-slate-900/60 animate-slide-up flex flex-col justify-between">
          <div>
            <div className="h-1.5 w-full" style={{ backgroundColor: colorDef.bg }} />

            <div className="p-5 pb-3">
              <div className="flex items-start justify-between gap-3">
                <div className="flex items-center gap-3 min-w-0">
                  <div
                    className="flex-shrink-0 w-11 h-11 rounded-xl flex items-center justify-center"
                    style={{ backgroundColor: isDark ? colorDef.dark + '80' : colorDef.light, border: `1.5px solid ${colorDef.bg}30` }}
                  >
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={colorDef.bg} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                      <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
                      <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
                    </svg>
                  </div>
                  <div className="min-w-0">
                    <h3 className="text-base font-bold text-slate-800 dark:text-white truncate leading-snug" title={subject.name}>
                      {subject.name}
                    </h3>
                    <div className="flex items-center gap-1.5 mt-1">
                      <span
                        className="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-semibold"
                        style={{ backgroundColor: isDark ? colorDef.dark + '80' : colorDef.light, color: colorDef.bg }}
                      >
                        {colorDef.label}
                      </span>
                    </div>
                  </div>
                </div>

                {!confirmDelete && (
                  <div className="flex-shrink-0 flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                    <button
                      id={`edit-subject-${subject.id}`}
                      onClick={() => onEdit(subject)}
                      className="p-1.5 rounded-lg text-slate-400 hover:text-blue-500 hover:bg-blue-50 dark:hover:bg-blue-900/30 transition-all"
                      title="Editar disciplina"
                    >
                      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                      </svg>
                    </button>
                    <button
                      id={`delete-subject-${subject.id}`}
                      onClick={() => setConfirmDelete(true)}
                      className="p-1.5 rounded-lg text-slate-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 transition-all"
                      title="Excluir disciplina"
                    >
                      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                        <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
                      </svg>
                    </button>
                  </div>
                )}
              </div>

              {subject.weeklyHours != null && (
                <div className="mt-3 pt-3 border-t border-slate-100 dark:border-slate-700/60 flex items-center gap-2">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={colorDef.bg} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                  </svg>
                  <span className="text-xs text-slate-500 dark:text-slate-400">
                    Meta: <strong className="text-slate-700 dark:text-slate-200 font-semibold">{subject.weeklyHours}h</strong>
                    <span className="ml-0.5 text-slate-400 dark:text-slate-500">/semana</span>
                  </span>
                </div>
              )}
            </div>

            <div className="px-5 pb-4">
              <div className="pt-3 border-t border-slate-100 dark:border-slate-700/60">
                <div className="flex items-center justify-between gap-2 mb-2.5">
                  <span className="text-xs font-bold text-slate-700 dark:text-slate-200 flex items-center gap-1.5">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#10B981" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                      <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                    </svg>
                    Drive Local ({subjectFiles.length})
                  </span>

                  <label
                    htmlFor={`file-upload-${subject.id}`}
                    className={`cursor-pointer inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-xs font-bold transition-all ${
                      uploading
                        ? 'bg-slate-100 text-slate-400 cursor-wait'
                        : 'bg-emerald-50 hover:bg-emerald-100 dark:bg-emerald-900/30 dark:hover:bg-emerald-900/50 text-emerald-600 dark:text-emerald-400'
                    }`}
                    title="Salvar arquivo no IndexedDB da disciplina"
                  >
                    {uploading ? (
                      <span className="animate-pulse">Salvando...</span>
                    ) : (
                      <>
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                        + Anexar Arquivo
                      </>
                    )}
                    <input
                      id={`file-upload-${subject.id}`}
                      type="file"
                      accept="application/pdf,image/*,.doc,.docx,.ppt,.pptx"
                      className="hidden"
                      disabled={uploading}
                      onChange={handleFileSelect}
                    />
                  </label>
                </div>

                {subjectFiles.length === 0 ? (
                  <p className="text-[11px] text-slate-400 dark:text-slate-500 italic py-1">
                    Nenhum PDF ou imagem no Drive local.
                  </p>
                ) : (
                  <div className="grid grid-cols-2 gap-2 max-h-48 overflow-y-auto pr-1">
                    {subjectFiles.map(file => {
                      const isPdf   = file.type?.includes('pdf');
                      const isImage = file.type?.includes('image');

                      return (
                        <div
                          key={file.id}
                          onClick={() => onPreviewFile(file)}
                          className="group/file relative flex flex-col justify-between p-2.5 rounded-xl bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-700/60 hover:border-emerald-500 dark:hover:border-emerald-400 hover:shadow-md transition-all cursor-pointer select-none"
                          title="Clique para visualizar no navegador"
                        >
                          <button
                            onClick={(e) => {
                              e.stopPropagation();
                              onDeleteFile(file.id);
                            }}
                            className="absolute top-1.5 right-1.5 p-1 rounded-lg bg-slate-200/80 dark:bg-slate-800/80 text-slate-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-950/60 opacity-0 group-hover/file:opacity-100 transition-all z-10"
                            title="Apagar arquivo do IndexedDB"
                          >
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                              <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/>
                            </svg>
                          </button>

                          <div className="flex items-center gap-2 mb-2">
                            <div className={`w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0 font-bold text-[10px] ${
                              isPdf

    // =============================================
    // HOOK: CRONÔMETRO (useTimer)
    // =============================================

    function useTimer() {
      const [seconds, setSeconds] = useState(0);
      const [status, setStatus] = useState('idle');
      const intervalRef = useRef(null);

      function start() {
        if (status === 'running') return;
        setStatus('running');
        intervalRef.current = setInterval(() => {
          setSeconds(s => s + 1);
        }, 1000);
      }

      function pause() {
        if (status !== 'running') return;
        clearInterval(intervalRef.current);
        intervalRef.current = null;
        setStatus('paused');
      }

      function resume() {
        if (status !== 'paused') return;
        start();
      }

      function reset() {
        clearInterval(intervalRef.current);
        intervalRef.current = null;
        setSeconds(0);
        setStatus('idle');
      }

      useEffect(() => {
        return () => clearInterval(intervalRef.current);
      }, []);

      return { seconds, status, start, pause, resume, reset };
    }

    function formatTime(totalSeconds) {
      const h = Math.floor(totalSeconds / 3600);
      const m = Math.floor((totalSeconds % 3600) / 60);
      const s = totalSeconds % 60;
      return [
        String(h).padStart(2, '0'),
        String(m).padStart(2, '0'),
        String(s).padStart(2, '0'),
      ].join(':');
    }

                      </div>
                      <div className="flex-shrink-0 text-right">
                        <p className="text-sm font-bold tabular-nums text-slate-700 dark:text-slate-200">
                          {formatTime(session.durationSeconds)}
                        </p>
                        <p className="text-xs text-slate-400 dark:text-slate-500">
                          {sessionDate.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' })}
                          {' · '}
                          {sessionDate.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}
                        </p>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          <Modal
            isOpen={showFinishModal}
            onClose={() => { setShowFinishModal(false); if (isPaused && seconds > 0) resume(); }}
            title="Concluir Sessão de Estudos"
          >
            <div className="space-y-5">
              <div className="bg-slate-50 dark:bg-slate-900/50 rounded-xl p-4 flex items-center gap-4">
                <div
                  className="flex-shrink-0 w-12 h-12 rounded-xl flex items-center justify-center"
                  style={{ backgroundColor: colorDef.bg + '20', border: `1.5px solid ${colorDef.bg}40` }}
                >
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke={colorDef.bg} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                  </svg>
                </div>
                <div>
                  <p className="text-xs text-slate-400 uppercase tracking-widest font-bold">Tempo total</p>
                  <p className="text-2xl font-black tabular-nums" style={{ color: colorDef.bg }}>
                    {formatTime(seconds)}
                  </p>
                  <p className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
                    {currentSubject?.name}
                  </p>
                </div>
              </div>

              <div>
                <label htmlFor="session-notes" className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">
                  Anotações rápidas
                  <span className="ml-1.5 text-xs text-slate-400 font-normal">(opcional)</span>
                </label>
                <textarea
                  id="session-notes"
                  rows={4}
                  maxLength={500}
                  placeholder="O que você estudou? Dúvidas, resumos, pontos importantes..."
                  value={notes}
                  onChange={e => setNotes(e.target.value)}
                  className="w-full px-4 py-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-sm text-slate-700 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-400 resize-none transition-all"
                />
                <p className="mt-1 text-right text-xs text-slate-400">{notes.length}/500</p>
              </div>

              <div className="flex gap-3">
                <button
                  id="btn-session-discard"
                  type="button"
                  onClick={handleCancel}
                  className="flex-1 py-2.5 rounded-xl text-sm font-semibold border border-slate-300 dark:border-slate-600 text-slate-600 dark:text-slate-300 hover:bg-red-50 hover:border-red-300 hover:text-red-600 dark:hover:bg-red-900/20 dark:hover:text-red-400 transition-all"
                >
                  Descartar
                </button>
                <button
                  id="btn-session-save"
                  type="button"
                  onClick={handleSaveSession}
                  className="flex-1 py-2.5 rounded-xl text-sm font-bold bg-emerald-500 hover:bg-emerald-600 text-white shadow-lg shadow-emerald-500/25 hover:shadow-emerald-500/40 hover:scale-[1.02] active:scale-[0.98] transition-all"
                >
                  Salvar Sessão
                </button>
              </div>
            </div>
          </Modal>
        </div>
      );
    }

    // =============================================
    // PALETA DE CORES DOS POST-ITS
    // =============================================

    const NOTE_COLORS = [
      { id: 'yellow', bg: '#FEF9C3', border: '#FDE047', text: '#713F12', shadow: 'rgba(250,204,21,0.35)' },
      { id: 'green',  bg: '#DCFCE7', border: '#86EFAC', text: '#14532D', shadow: 'rgba(74,222,128,0.30)' },
      { id: 'blue',   bg: '#DBEAFE', border: '#93C5FD', text: '#1E3A8A', shadow: 'rgba(96,165,250,0.30)' },
      { id: 'pink',   bg: '#FCE7F3', border: '#F9A8D4', text: '#831843', shadow: 'rgba(244,114,182,0.30)' },
      { id: 'purple', bg: '#EDE9FE', border: '#C4B5FD', text: '#581C87', shadow: 'rgba(167,139,250,0.30)' },
    ];

    // =============================================
    // COMPONENTE: CARD DO POST-IT
    // =============================================

    function PostitCard({ note, subjects, onUpdate, onDelete, onTogglePin, isDragging, isDragOver, onDragStart, onDragOver, onDrop, onDragEnd }) {
      const [showColorPicker, setShowColorPicker] = useState(false);
      const [showSubjectPicker, setShowSubjectPicker] = useState(false);
      const [confirmDelete, setConfirmDelete] = useState(false);

      const colorDef      = NOTE_COLORS.find(c => c.id === note.color) || NOTE_COLORS[0];
      const linkedSubject = subjects.find(s => s.id === note.subjectId);
      const subjColor     = SUBJECT_COLORS.find(c => c.id === linkedSubject?.color);

      function addTask() {
        const newTask = { id: `t-${Date.now()}`, text: '', done: false };
        onUpdate(note.id, { tasks: [...(note.tasks || []), newTask] });
        setTimeout(() => {
          const inputs = document.querySelectorAll(`[data-note-id="${note.id}"] .task-input`);
          if (inputs.length) inputs[inputs.length - 1].focus();
        }, 50);
      }

      function toggleTask(taskId) {
        onUpdate(note.id, { tasks: note.tasks.map(t => t.id === taskId ? { ...t, done: !t.done } : t) });
      }

      function updateTaskText(taskId, text) {
        onUpdate(note.id, { tasks: note.tasks.map(t => t.id === taskId ? { ...t, text } : t) });
      }

      function removeTask(taskId) {
        onUpdate(note.id, { tasks: note.tasks.filter(t => t.id !== taskId) });
      }

      function handleTaskKeyDown(e, taskId, idx) {
        if (e.key === 'Enter') { e.preventDefault(); addTask(); }
        if (e.key === 'Backspace' && note.tasks[idx].text === '') {
          e.preventDefault();
          removeTask(taskId);
        }
      }

      function switchToTasks() {
        const existingTasks = (note.content || '')
          .split('\n')
          .map(l => l.trim())
          .filter(Boolean)
          .map(text => ({ id: `t-${Date.now()}-${Math.random().toString(36).slice(2,5)}`, text, done: false }));
        onUpdate(note.id, {
          mode: 'tasks',
          tasks: existingTasks.length ? existingTasks : [{ id: `t-${Date.now()}`, text: '', done: false }],
        });
      }

      function switchToText() {
        const content = (note.tasks || []).map(t => t.text).filter(Boolean).join('\n');
        onUpdate(note.id, { mode: 'text', content });
      }

      const isTaskMode = note.mode === 'tasks';
      const doneTasks  = (note.tasks || []).filter(t => t.done).length;
      const totalTasks = (note.tasks || []).length;

      return (
        <div
          data-note-id={note.id}
          draggable
          onDragStart={e => onDragStart(e, note.id)}
          onDragOver={e => onDragOver(e, note.id)}
          onDrop={e => onDrop(e, note.id)}
          onDragEnd={onDragEnd}
          className="relative flex flex-col rounded-2xl p-0 overflow-hidden transition-all duration-200"
          style={{
            backgroundColor: colorDef.bg,
            border: isDragOver ? `2px dashed ${colorDef.border}` : `1px solid ${colorDef.border}`,
            boxShadow: isDragging
              ? `0 2px 8px ${colorDef.shadow}`
              : `0 6px 24px ${colorDef.shadow}, 0 2px 6px rgba(0,0,0,0.08)`,
            opacity: isDragging ? 0.45 : 1,
            transform: isDragOver ? 'scale(1.025) rotate(0.5deg)' : 'scale(1)',
            cursor: isDragging ? 'grabbing' : 'grab',
            minHeight: 180,
          }}
        >
          <div
            className="flex items-center justify-between px-3 py-2 select-none"
            style={{ backgroundColor: colorDef.border + '80' }}
          >
            <div className="flex flex-col gap-0.5 opacity-50">
              <div className="w-5 h-0.5 rounded" style={{ backgroundColor: colorDef.text }} />
              <div className="w-5 h-0.5 rounded" style={{ backgroundColor: colorDef.text }} />
              <div className="w-5 h-0.5 rounded" style={{ backgroundColor: colorDef.text }} />
            </div>

            <div className="flex items-center gap-1" onClick={e => e.stopPropagation()}>
              <button
                title={note.pinned ? 'Desafixar' : 'Fixar no topo'}
                onClick={() => onTogglePin(note.id)}
                className="p-1 rounded-lg transition-all hover:scale-110"
                style={{ color: note.pinned ? colorDef.text : colorDef.text + '70' }}
              >
                <svg width="14" height="14" viewBox="0 0 24 24" fill={note.pinned ? 'currentColor' : 'none'} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <line x1="12" y1="17" x2="12" y2="22"/>
                  <path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"/>
                </svg>
              </button>

              <div className="relative">
                <button
                  title="Mudar cor"
                  onClick={() => { setShowColorPicker(v => !v); setShowSubjectPicker(false); }}
                  className="w-4 h-4 rounded-full border-2 transition-all hover:scale-125"
                  style={{ backgroundColor: colorDef.border, borderColor: colorDef.text + '60' }}
                />
                {showColorPicker && (
                  <div
                    className="absolute right-0 top-6 z-50 flex gap-1.5 p-2 rounded-xl shadow-xl"
                    style={{ backgroundColor: '#fff', border: '1px solid #e2e8f0' }}
                  >
                    {NOTE_COLORS.map(c => (
                      <button
                        key={c.id}
                        title={c.id}
                        onClick={() => { onUpdate(note.id, { color: c.id }); setShowColorPicker(false); }}
                        className="w-5 h-5 rounded-full border-2 transition-all hover:scale-125"
                        style={{
                          backgroundColor: c.bg,
                          borderColor: note.color === c.id ? c.text : c.border,
                          outline: note.color === c.id ? `2px solid ${c.text}` : 'none',
                        }}
                      />
                    ))}
                  </div>
                )}
              </div>

              {confirmDelete ? (
                <>
                  <button
                    onClick={() => { setConfirmDelete(false); }}
                    className="text-[10px] font-bold px-1.5 py-0.5 rounded"
                    style={{ color: colorDef.text, backgroundColor: colorDef.border + '60' }}
                  >Não</button>
                  <button
                    onClick={() => onDelete(note.id)}
                    className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-red-500 text-white"
                  >Sim</button>
                </>
              ) : (
                <button
                  title="Excluir nota"
                  onClick={() => setConfirmDelete(true)}
                  className="p-1 rounded-lg transition-all hover:scale-110"
                  style={{ color: colorDef.text + '80' }}
                >
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                  </svg>
                </button>
              )}
            </div>
          </div>

          <div className="flex flex-col flex-1 px-4 py-3 gap-2" onClick={() => { setShowColorPicker(false); setShowSubjectPicker(false); }}>
            <input
              type="text"
              placeholder="Título..."
              value={note.title}
              maxLength={60}
              onChange={e => onUpdate(note.id, { title: e.target.value })}
              onClick={e => e.stopPropagation()}
              className="w-full bg-transparent border-none outline-none text-sm font-bold placeholder-opacity-50 truncate"
              style={{ color: colorDef.text, caretColor: colorDef.text }}
            />

            <div className="h-px" style={{ backgroundColor: colorDef.border }} />

            {!isTaskMode && (
              <textarea
                placeholder="Escreva sua nota aqui..."
                value={note.content || ''}
                onChange={e => onUpdate(note.id, { content: e.target.value })}
                onClick={e => e.stopPropagation()}
                rows={4}
                className="flex-1 w-full bg-transparent border-none outline-none text-xs resize-none placeholder-opacity-60 leading-relaxed"
                style={{ color: colorDef.text, caretColor: colorDef.text, minHeight: 80 }}
              />
            )}

            {isTaskMode && (
              <div className="flex flex-col gap-1.5" onClick={e => e.stopPropagation()}>
                {(note.tasks || []).map((task, idx) => (
                  <div key={task.id} className="flex items-center gap-2 group/task">
                    <input
                      type="checkbox"
                      checked={task.done}
                      onChange={() => toggleTask(task.id)}
                      className="flex-shrink-0 w-3.5 h-3.5 rounded cursor-pointer"
                      style={{ accentColor: colorDef.text }}
                    />
                    <input
                      type="text"
                      value={task.text}
                      placeholder="Nova tarefa..."
                      onChange={e => updateTaskText(task.id, e.target.value)}
                      onKeyDown={e => handleTaskKeyDown(e, task.id, idx)}
                      className={`task-input flex-1 bg-transparent border-none outline-none text-xs ${
                        task.done ? 'line-through opacity-50' : ''
                      }`}
                      style={{ color: colorDef.text, caretColor: colorDef.text }}
                    />
                    <button
                      onClick={() => removeTask(task.id)}
                      className="opacity-0 group-hover/task:opacity-100 transition-opacity p-0.5"
                      style={{ color: colorDef.text + '80' }}
                    >
                      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                      </svg>
                    </button>
                  </div>
                ))}
                <button
                  onClick={addTask}
                  className="flex items-center gap-1 text-[10px] font-semibold mt-1 opacity-60 hover:opacity-100 transition-opacity"
                  style={{ color: colorDef.text }}
                >
                  <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                  </svg>
                  Adicionar item
                </button>
              </div>
            )}
          </div>

          <div
            className="flex items-center justify-between gap-2 px-3 py-2 mt-auto"
            style={{ borderTop: `1px solid ${colorDef.border}` }}
            onClick={e => e.stopPropagation()}
          >
            <div className="relative flex-1 min-w-0">
              <button
                onClick={() => { setShowSubjectPicker(v => !v); setShowColorPicker(false); }}
                className="flex items-center gap-1.5 max-w-full text-left"
              >
                {linkedSubject ? (
                  <span
                    className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold truncate max-w-[120px]"
                    style={{
                      backgroundColor: subjColor?.light || '#e2e8f0',
                      color: subjColor?.bg || '#475569',
                      border: `1px solid ${subjColor?.bg || '#cbd5e1'}`,
                    }}
                  >
                    <span className="w-1.5 h-1.5 rounded-full flex-shrink-0" style={{ backgroundColor: subjColor?.bg || '#64748b' }} />
                    {linkedSubject.name}
                  </span>
                ) : (
                  <span className="text-[10px] opacity-50 hover:opacity-80 transition-opacity" style={{ color: colorDef.text }}>
                    + disciplina
                  </span>
                )}
              </button>

              {showSubjectPicker && (
                <div
                  className="absolute left-0 bottom-7 z-50 min-w-[160px] rounded-xl shadow-xl overflow-hidden"
                  style={{ backgroundColor: '#fff', border: '1px solid #e2e8f0' }}
                >
                  <button
                    onClick={() => { onUpdate(note.id, { subjectId: null }); setShowSubjectPicker(false); }}
                    className="w-full text-left text-xs px-3 py-2 text-slate-500 hover:bg-slate-50"
                  >
                    Sem disciplina
                  </button>
                  {subjects.map(s => {
                    const sc = SUBJECT_COLORS.find(c => c.id === s.color);
                    return (
                      <button
                        key={s.id}
                        onClick={() => { onUpdate(note.id, { subjectId: s.id }); setShowSubjectPicker(false); }}
                        className="w-full flex items-center gap-2 text-left text-xs px-3 py-2 hover:bg-slate-50"
                      >
                        <span className="w-2 h-2 rounded-full flex-shrink-0" style={{ backgroundColor: sc?.bg || '#64748b' }} />
                        <span className="truncate text-slate-700">{s.name}</span>
                      </button>
                    );
                  })}
                  {subjects.length === 0 && (
                    <p className="text-xs text-slate-400 px-3 py-2">Nenhuma disciplina</p>
                  )}
                </div>
              )}
            </div>

            <div className="flex items-center gap-2 flex-shrink-0">
              {isTaskMode && totalTasks > 0 && (
                <span className="text-[10px] font-bold opacity-60" style={{ color: colorDef.text }}>
                  {doneTasks}/{totalTasks}
                </span>
              )}
              <button
                title={isTaskMode ? 'Modo texto' : 'Modo lista de tarefas'}
                onClick={isTaskMode ? switchToText : switchToTasks}
                className="p-1 rounded-lg transition-all hover:scale-110 opacity-60 hover:opacity-100"
                style={{ color: colorDef.text }}
              >
                {isTaskMode ? (
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <line x1="17" y1="10" x2="3" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="17" y1="18" x2="3" y2="18"/>
                  </svg>
                ) : (
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                  </svg>
                )}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // =============================================
    // PÁGINA: MURAL DE ANOTAÇÕES
    // =============================================

    const NOTE_DEFAULT_COLORS = ['yellow','green','blue','pink','purple'];
    let _noteColorIdx = 0;
    function nextNoteColor() {
      const c = NOTE_DEFAULT_COLORS[_noteColorIdx % NOTE_DEFAULT_COLORS.length];
      _noteColorIdx++;
      return c;
    }

    function NotesPage() {
      const [subjects]             = useLocalStorage('studyflow-subjects', []);
      const [notes, setNotes]      = useLocalStorage('studyflow-notes', []);
      const [draggedId, setDraggedId]   = useState(null);
      const [dragOverId, setDragOverId] = useState(null);
      const [filterColor, setFilterColor] = useState(null);
      const [filterSubject, setFilterSubject] = useState(null);

      const sortedNotes = [...notes]
        .filter(n => !filterColor   || n.color     === filterColor)
        .filter(n => !filterSubject || n.subjectId === filterSubject)
        .sort((a, b) => {
          if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
          return (a.order ?? 0) - (b.order ?? 0);
        });

      function addNote() {
        const newNote = {
          id: `note-${Date.now()}-${Math.random().toString(36).slice(2,5)}`,
          title: '',
          content: '',
          color: nextNoteColor(),
          subjectId: null,
          pinned: false,
          order: notes.length,
          mode: 'text',
          tasks: [],
          createdAt: new Date().toISOString(),
        };
        setNotes(prev => [newNote, ...prev]);
      }

      function updateNote(id, updates) {
        setNotes(prev => prev.map(n => n.id === id ? { ...n, ...updates } : n));
      }

      function deleteNote(id) {
        setNotes(prev => prev.filter(n => n.id !== id));
      }

      function togglePin(id) {
        setNotes(prev => prev.map(n => n.id === id ? { ...n, pinned: !n.pinned } : n));
      }

      function handleDragStart(e, id) {
        setDraggedId(id);
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', id);
      }

      function handleDragOver(e, id) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        if (id !== draggedId) setDragOverId(id);
      }

      function handleDrop(e, targetId) {
        e.preventDefault();
        if (!draggedId || draggedId === targetId) {
          setDraggedId(null); setDragOverId(null); return;
        }
        setNotes(prev => {
          const arr = [...prev];
          const fromIdx = arr.findIndex(n => n.id === draggedId);
          const toIdx   = arr.findIndex(n => n.id === targetId);
          if (fromIdx === -1 || toIdx === -1) return prev;
          const [removed] = arr.splice(fromIdx, 1);
          arr.splice(toIdx, 0, removed);
          return arr.map((n, i) => ({ ...n, order: i }));
        });
        setDraggedId(null); setDragOverId(null);
      }

      function handleDragEnd() {
        setDraggedId(null); setDragOverId(null);
      }

      const pinnedCount = notes.filter(n => n.pinned).length;

      return (
        <div className="animate-fade-in">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
            <div>
              <h1 className="text-2xl font-bold text-slate-800 dark:text-white">Mural de Anotações</h1>
              <p className="text-sm text-slate-500 dark:text-slate-400 mt-0.5">
                {notes.length === 0 ? 'Nenhuma nota ainda' : `${notes.length} nota${notes.length > 1 ? 's' : ''}${pinnedCount > 0 ? ` · ${pinnedCount} fixada${pinnedCount > 1 ? 's' : ''}` : ''}`}
              </p>
            </div>
            <button
              id="btn-add-note"
              onClick={addNote}
              className="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl text-sm font-bold bg-emerald-500 hover:bg-emerald-600 text-white shadow-lg shadow-emerald-500/30 hover:scale-[1.02] active:scale-[0.98] transition-all"
            >
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
              Novo Post-it
            </button>
          </div>

          {notes.length > 0 && (
            <div className="flex flex-wrap items-center gap-2 mb-6">
              <span className="text-xs font-bold uppercase tracking-widest text-slate-400 dark:text-slate-500 mr-1">Filtrar:</span>
              {NOTE_COLORS.map(c => (
                <button
                  key={c.id}
                  onClick={() => setFilterColor(filterColor === c.id ? null : c.id)}
                  title={c.id}
                  className="w-5 h-5 rounded-full border-2 transition-all hover:scale-125"
                  style={{
                    backgroundColor: c.bg,
                    borderColor: filterColor === c.id ? c.text : c.border,
                    outline: filterColor === c.id ? `2px solid ${c.text}` : 'none',
                  }}
                />
              ))}
              {subjects.length > 0 && (
                <select
                  value={filterSubject || ''}
                  onChange={e => setFilterSubject(e.target.value || null)}
                  className="ml-2 text-xs px-2 py-1 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 focus:outline-none focus:ring-1 focus:ring-emerald-400"
                >

    // =============================================
    // BANCO DE DADOS NATIVO: INDEXEDDB
    // =============================================

    const DB_NAME    = 'StudyFlowFilesDB';
    const DB_VERSION = 1;
    const STORE_NAME = 'files';

    function openStudyFlowDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (event) => {
          const db = event.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            const store = db.createObjectStore(STORE_NAME, { keyPath: 'id' });
            store.createIndex('subjectId', 'subjectId', { unique: false });
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror   = () => reject(request.error);
      });
    }

    function formatFileSize(bytes) {
      if (!bytes || bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    function useIndexedDBFiles() {
      const [filesList, setFilesList] = useState([]);
      const [loading, setLoading]     = useState(true);
      const [isClearModalOpen, setIsClearModalOpen] = useState(false);
      const [previewFile, setPreviewFile] = useState(null); // <-- CORRIGIDO: Estado adicionado

      useEffect(() => {
        loadFiles();
      }, []);

      async function loadFiles() {
        try {
          const db = await openStudyFlowDB();
          const tx = db.transaction(STORE_NAME, 'readonly');
          const store = tx.objectStore(STORE_NAME);
          const req = store.getAll();
          req.onsuccess = () => {
            const list = req.result.map(f => ({
              id: f.id,
              subjectId: f.subjectId,
              name: f.name,
              type: f.type,
              size: f.size,
              uploadedAt: f.uploadedAt,
            }));
            setFilesList(list);
            setLoading(false);
          };
          req.onerror = () => setLoading(false);
        } catch (err) {
          console.error('Erro ao abrir IndexedDB:', err);
          setLoading(false);
        }
      }

      async function uploadFile(file, subjectId) {
        const db = await openStudyFlowDB();
        const id = `file-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;
        const fileRecord = {
          id,
          subjectId,
          name: file.name,
          type: file.type || 'application/octet-stream',
          size: file.size,
          uploadedAt: new Date().toISOString(),
          data: file,
        };

        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, 'readwrite');
          const store = tx.objectStore(STORE_NAME);
          const req = store.put(fileRecord);
          req.onsuccess = () => {
            const metadata = {
              id: fileRecord.id,
              subjectId: fileRecord.subjectId,
              name: fileRecord.name,
              type: fileRecord.type,
              size: fileRecord.size,
              uploadedAt: fileRecord.uploadedAt,
            };
            setFilesList(prev => [metadata, ...prev]);
            resolve(metadata);
          };
          req.onerror = () => reject(req.error);
        });
      }

      async function viewOrDownloadFile(fileId) {
        const db = await openStudyFlowDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, 'readonly');
          const store = tx.objectStore(STORE_NAME);
          const req = store.get(fileId);
          req.onsuccess = () => {
            const record = req.result;
            if (!record || !record.data) {
              alert('Arquivo não encontrado no banco de dados local.');
              return resolve();
            }
            const blob = record.data instanceof Blob ? record.data : new Blob([record.data], { type: record.type });
            const url  = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = url;
            a.target = '_blank';
            a.download = record.name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            setTimeout(() => URL.revokeObjectURL(url), 10000);
            resolve();
          };
          req.onerror = () => reject(req.error);
        });
      }

      async function deleteFile(fileId) {
        const db = await openStudyFlowDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, 'readwrite');
          const store = tx.objectStore(STORE_NAME);
          const req = store.delete(fileId);
          req.onsuccess = () => {
            setFilesList(prev => prev.filter(f => f.id !== fileId));
            resolve();
          };
          req.onerror = () => reject(req.error);
        });
      }

      async function clearAllFiles() {
        const db = await openStudyFlowDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, 'readwrite');
          const store = tx.objectStore(STORE_NAME);
          const req = store.clear();
          req.onsuccess = () => {
            setFilesList([]);
            setIsClearModalOpen(false);
            resolve();
          };
          req.onerror = () => reject(req.error);
        });
      }

      return {
        filesList,
        loading,
        previewFile,
        setPreviewFile,
        isClearModalOpen,
        setIsClearModalOpen,
        uploadFile,
        viewOrDownloadFile,
        deleteFile,
        clearAllFiles,
      };
    }

    function FilePreviewModal({ file, onClose, onDownload }) {
      const [blobUrl, setBlobUrl] = useState(null);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        if (!file) return;

        let isMounted = true;
        let url = null;

        async function loadBlob() {
          try {
            const db = await openStudyFlowDB();
            const tx = db.transaction(STORE_NAME, 'readonly');
            const store = tx.objectStore(STORE_NAME);
            const req = store.get(file.id);
            req.onsuccess = () => {
              if (!isMounted) return;
              const record = req.result;
              if (record && record.data) {
                const blob = record.data instanceof Blob ? record.data : new Blob([record.data], { type: record.type });
                url = URL.createObjectURL(blob);
                setBlobUrl(url);
              }
              setLoading(false);
            };
            req.onerror = () => {
              if (isMounted) setLoading(false);
            };
          } catch (err) {
            console.error('Erro ao carregar preview:', err);
            if (isMounted) setLoading(false);
          }
        }

        loadBlob();

        function handleKeyDown(e) {
          if (e.key === 'Escape') onClose();
        }
        window.addEventListener('keydown', handleKeyDown);

        return () => {
          isMounted = false;
          window.removeEventListener('keydown', handleKeyDown);
          if (url) {
            URL.revokeObjectURL(url);
          }
        };
      }, [file]);

      if (!file) return null;

      const isPdf   = file.type?.includes('pdf');
      const isImage = file.type?.includes('image');

      return (
        <div className="fixed inset-0 z-50 flex flex-col bg-slate-950/90 backdrop-blur-md animate-fade-in">

                <p className="text-xs text-slate-400 mt-0.5">
                  {formatFileSize(file.size)} · Enviado em {new Date(file.uploadedAt).toLocaleDateString('pt-BR')}

              </div>
            </div>

            <div className="flex items-center gap-3 flex-shrink-0">
              <button
                id="btn-preview-download"
                onClick={() => onDownload(file.id)}

                title="Baixar cópia do arquivo"
              >
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                Baixar Cópia
              </button>

              <button
                id="btn-close-preview"
                onClick={onClose}
                className="p-2 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition-all"
                title="Fechar visualização (Esc)"
              >
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
              </button>
            </div>
          </div>

          <div className="flex-1 p-4 md:p-8 flex items-center justify-center overflow-hidden relative">
            {loading ? (
              <div className="flex flex-col items-center gap-3 text-slate-400 animate-pulse">
                <div className="w-10 h-10 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
                <p className="text-xs font-medium">Carregando visualizador de arquivo...</p>
              </div>
            ) : !blobUrl ? (
              <div className="text-center text-slate-400">
                <p className="text-sm font-bold text-slate-200">Não foi possível carregar o arquivo.</p>
              </div>
            ) : isPdf ? (
              <iframe
                src={blobUrl}
                title={file.name}
                className="w-full h-full max-w-6xl rounded-2xl bg-white shadow-2xl border border-slate-800"

            ) : isImage ? (
              <div className="max-w-5xl max-h-full flex items-center justify-center p-2">
                <img
                  src={blobUrl}
                  alt={file.name}
                  className="max-h-[82vh] max-w-full object-contain rounded-2xl shadow-2xl border border-slate-800"
                />
              </div>
            ) : (
              <div className="text-center p-8 bg-slate-900 border border-slate-800 rounded-2xl max-w-md">
                <div className="w-16 h-16 rounded-2xl bg-blue-500/20 text-blue-400 flex items-center justify-center mx-auto mb-4">
                  <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>
