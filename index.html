    function useChart(canvasRef, buildConfig, deps) {
      const chartRef = useRef(null);
      useEffect(() => {
        if (!canvasRef.current || !window.Chart) return;
        if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; }
        const config = buildConfig();
        if (!config) return;
        chartRef.current = new window.Chart(canvasRef.current, config);
        return () => { if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; } };
      }, deps);
    }

    function toHours(sec) { return Math.round((sec / 3600) * 10) / 10; }

    function isoWeek(date) {
      const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
      const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
      return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    }

    function ProgressPage() {
      const [subjects] = useLocalStorage('studyflow-subjects', []);
      const [sessions] = useLocalStorage('studyflow-sessions', []);
      const [histFilter, setHistFilter] = useState('');
      const [histPage, setHistPage]     = useState(1);
      const HIST_PER_PAGE = 10;

      const weeklyChartRef   = useRef(null);
      const subjectsChartRef = useRef(null);

      const now   = new Date();
      const today = now.toDateString();

      const currentWeek  = isoWeek(now);
      const currentYear  = now.getFullYear();
      const currentMonth = now.getMonth();

      const weekSec   = sessions.filter(s => {
        const d = new Date(s.date);
        return isoWeek(d) === currentWeek && d.getFullYear() === currentYear;
      }).reduce((a, s) => a + s.durationSeconds, 0);

      const monthSec = sessions.filter(s => {
        const d = new Date(s.date);
        return d.getMonth() === currentMonth && d.getFullYear() === currentYear;
      }).reduce((a, s) => a + s.durationSeconds, 0);

      const totalSec = sessions.reduce((a, s) => a + s.durationSeconds, 0);

      const todaySec = sessions.filter(s => new Date(s.date).toDateString() === today)
        .reduce((a, s) => a + s.durationSeconds, 0);

      const totalSessions = sessions.length;

      const last7 = Array.from({ length: 7 }, (_, i) => {
        const d = new Date(now);
        d.setDate(d.getDate() - (6 - i));
        return d;
      });

      const last7Labels = last7.map(d =>
        d.toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit' })
      );

      const last7Hours = last7.map(d => {
        const ds = d.toDateString();
        return toHours(
          sessions.filter(s => new Date(s.date).toDateString() === ds)
            .reduce((a, s) => a + s.durationSeconds, 0)
        );
      });

      const isDark = document.documentElement.classList.contains('dark');
      const gridColor   = isDark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.07)';
      const tickColor   = isDark ? '#94a3b8' : '#64748b';
      const tooltipBg   = isDark ? '#1e293b' : '#fff';
      const tooltipText = isDark ? '#f1f5f9' : '#1e293b';

      useChart(weeklyChartRef, () => ({
        type: 'bar',
        data: {
          labels: last7Labels,
          datasets: [{
            label: 'Horas estudadas',
            data: last7Hours,
            backgroundColor: last7Hours.map((_, i) =>
              i === 6 ? '#10B981' : (isDark ? 'rgba(99,102,241,0.55)' : 'rgba(99,102,241,0.45)')
            ),
            borderColor: last7Hours.map((_, i) => i === 6 ? '#059669' : '#6366f1'),
            borderWidth: 1.5,
            borderRadius: 8,
            borderSkipped: false,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: tooltipBg,
              titleColor: tooltipText,
              bodyColor: tickColor,
              borderColor: isDark ? '#334155' : '#e2e8f0',
              borderWidth: 1,
              padding: 10,
              callbacks: {
                label: ctx => ` ${ctx.parsed.y}h estudadas`,
              }
            }
          },
          scales: {
            x: {
              grid: { color: gridColor },
              ticks: { color: tickColor, font: { size: 11, family: 'Inter' } },
            },
            y: {
              beginAtZero: true,
              grid: { color: gridColor },
              ticks: {
                color: tickColor,
                font: { size: 11, family: 'Inter' },
                callback: v => `${v}h`,
              },
            }
          }
        }
      }), [sessions.length, isDark]);

      const subjectSecs = subjects.map(s => ({
        subject: s,
        sec: sessions.filter(sess => sess.subjectId === s.id)
          .reduce((a, sess) => a + sess.durationSeconds, 0)
      })).filter(x => x.sec > 0);

      const doughnutColors = [
        '#6366f1','#10B981','#3B82F6','#EC4899','#F97316',
        '#8B5CF6','#14B8A6','#F59E0B','#EF4444','#84CC16',
      ];

      useChart(subjectsChartRef, () => {
        if (subjectSecs.length === 0) return null;
        return {
          type: 'doughnut',
          data: {
            labels: subjectSecs.map(x => x.subject.name),
            datasets: [{
              data: subjectSecs.map(x => toHours(x.sec)),
              backgroundColor: subjectSecs.map((_, i) => doughnutColors[i % doughnutColors.length]),
              borderColor: isDark ? '#1e293b' : '#fff',
              borderWidth: 3,
              hoverOffset: 8,
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '68%',
            plugins: {
              legend: {
                position: 'bottom',
                labels: {
                  color: tickColor,
                  font: { size: 11, family: 'Inter' },
                  padding: 14,
                  boxWidth: 12,
                  boxHeight: 12,
                  usePointStyle: true,
                }
              },
              tooltip: {
                backgroundColor: tooltipBg,
                titleColor: tooltipText,
                bodyColor: tickColor,
                borderColor: isDark ? '#334155' : '#e2e8f0',
                borderWidth: 1,
                padding: 10,
                callbacks: {
                  label: ctx => ` ${ctx.label}: ${ctx.parsed}h`,
                }
              }
            }
          }
        };
      }, [sessions.length, subjects.length, isDark]);

      const filteredSessions = [...sessions]
        .filter(s => !histFilter || s.subjectId === histFilter)
        .sort((a, b) => new Date(b.date) - new Date(a.date));

      const totalPages   = Math.ceil(filteredSessions.length / HIST_PER_PAGE);
      const pagedSessions = filteredSessions.slice((histPage - 1) * HIST_PER_PAGE, histPage * HIST_PER_PAGE);

      useEffect(() => setHistPage(1), [histFilter]);

      const summaryCards = [
        {
          label: 'Hoje',
          value: formatTime(todaySec),
          sub: `${sessions.filter(s => new Date(s.date).toDateString() === today).length} sessões`,
          color: '#10B981', bg: 'rgba(16,185,129,0.1)',
          icon: (
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
            </svg>
          )
        },
        {
          label: 'Esta Semana',
          value: formatTime(weekSec),
          sub: `Semana ${currentWeek}`,
          color: '#6366F1', bg: 'rgba(99,102,241,0.1)',
          icon: (
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
          )
        },
        {
          label: 'Este Mês',
          value: formatTime(monthSec),
          sub: now.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }),
          color: '#3B82F6', bg: 'rgba(59,130,246,0.1)',
          icon: (
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
          )
        },
        {
          label: 'Total Acumulado',
          value: formatTime(totalSec),
          sub: `${totalSessions} sessão(ões)`,
          color: '#F97316', bg: 'rgba(249,115,22,0.1)',
          icon: (
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
            </svg>
          )
        },
      ];

      return (
        <div className="animate-fade-in">
          <div className="mb-8">
            <h1 className="text-2xl font-bold text-slate-800 dark:text-white">Progresso</h1>
            <p className="text-sm text-slate-500 dark:text-slate-400 mt-0.5">
              Acompanhe sua evolução e tempo dedicado aos estudos.
            </p>
          </div>

          <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            {summaryCards.map((card, i) => (
              <div
                key={i}
                className="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-5 shadow-sm hover:shadow-md transition-shadow"
              >
                <div className="flex items-start justify-between gap-2">
                  <div>
                    <p className="text-xs font-bold uppercase tracking-widest text-slate-400 dark:text-slate-500 mb-1">{card.label}</p>
                    <p className="text-2xl font-black tabular-nums" style={{ color: card.color }}>{card.value}</p>
                    <p className="text-xs text-slate-400 mt-0.5">{card.sub}</p>
                  </div>
                  <div
                    className="flex-shrink-0 w-10 h-10 rounded-xl flex items-center justify-center"
                    style={{ backgroundColor: card.bg, color: card.color }}
                  >
                    {card.icon}
                  </div>
                </div>
              </div>
            ))}
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-5 gap-6 mb-8">
            <div className="lg:col-span-3 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-6 shadow-sm">
              <div className="flex items-center justify-between mb-5">
                <div>
                  <h2 className="text-sm font-bold text-slate-700 dark:text-slate-200">Últimos 7 Dias</h2>
                  <p className="text-xs text-slate-400 mt-0.5">Horas estudadas por dia</p>
                </div>
                <div className="flex items-center gap-2">
                  <span className="w-3 h-3 rounded-sm" style={{ backgroundColor: '#10B981' }} />
                  <span className="text-xs text-slate-400">Hoje</span>
                  <span className="w-3 h-3 rounded-sm ml-1" style={{ backgroundColor: 'rgba(99,102,241,0.55)' }} />
                  <span className="text-xs text-slate-400">Anteriores</span>
                </div>
              </div>
              {sessions.length === 0 ? (
                <div className="flex items-center justify-center h-48 text-slate-400 dark:text-slate-600 text-sm">
                  Nenhuma sessão registrada ainda.
                </div>
              ) : (
                <div style={{ height: 220, position: 'relative' }}>
                  <canvas id="weeklyChart" ref={weeklyChartRef} />
                </div>
              )}
            </div>

            <div className="lg:col-span-2 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-6 shadow-sm">
              <div className="mb-5">
                <h2 className="text-sm font-bold text-slate-700 dark:text-slate-200">Por Disciplina</h2>
                <p className="text-xs text-slate-400 mt-0.5">Proporção de tempo acumulado</p>
              </div>
              {subjectSecs.length === 0 ? (
                <div className="flex items-center justify-center h-48 text-slate-400 dark:text-slate-600 text-sm text-center">
                  Nenhum dado por disciplina ainda.
                </div>
              ) : (
                <div style={{ height: 220, position: 'relative' }}>
                  <canvas id="subjectsChart" ref={subjectsChartRef} />
                </div>
              )}
            </div>
          </div>

          <div className="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 p-5 border-b border-slate-200 dark:border-slate-700">
              <div>
                <h2 className="text-sm font-bold text-slate-700 dark:text-slate-200">Histórico de Sessões</h2>
                <p className="text-xs text-slate-400 mt-0.5">{filteredSessions.length} registro(s)</p>
              </div>
              <select
                id="history-subject-filter"
                value={histFilter}
                onChange={e => setHistFilter(e.target.value)}
                className="text-xs px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-400 transition-all"
              >
                <option value="">Todas as disciplinas</option>
                {subjects.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
              </select>
            </div>

            {filteredSessions.length === 0 ? (
              <div className="flex items-center justify-center py-12 text-sm text-slate-400 dark:text-slate-600">
                Nenhuma sessão encontrada.
              </div>
            ) : (
              <>
                <div className="overflow-x-auto">
                  <table className="w-full text-sm">
                    <thead>
                      <tr className="bg-slate-50 dark:bg-slate-900/50">
                        <th className="text-left px-5 py-3 text-xs font-bold uppercase tracking-widest text-slate-400 dark:text-slate-500">Disciplina</th>
                        <th className="text-left px-5 py-3 text-xs font-bold uppercase tracking-widest text-slate-400 dark:text-slate-500">Data</th>
                        <th className="text-left px-5 py-3 text-xs font-bold uppercase tracking-widest text-slate-400 dark:text-slate-500">Duração</th>
                        <th className="text-left px-5 py-3 text-xs font-bold uppercase tracking-widest text-slate-400 dark:text-slate-500">Anotações</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100 dark:divide-slate-700/60">
                      {pagedSessions.map((session, idx) => {
                        const subj = subjects.find(s => s.id === session.subjectId);
                        const c    = SUBJECT_COLORS.find(col => col.id === subj?.color);
                        const d    = new Date(session.date);
                        return (
                          <tr
                            key={session.id}
                            className="hover:bg-slate-50 dark:hover:bg-slate-700/30 transition-colors"
                          >
                            <td className="px-5 py-3.5">
                              <div className="flex items-center gap-2">
                                <span
                                  className="flex-shrink-0 w-2 h-6 rounded-full"
                                  style={{ backgroundColor: c?.bg || '#64748b' }}
                                />
                                <span className="font-semibold text-slate-700 dark:text-slate-200 truncate max-w-[140px]">
                                  {subj?.name || <span className="text-slate-400 italic">Removida</span>}
                                </span>
                              </div>
                            </td>
                            <td className="px-5 py-3.5 text-slate-500 dark:text-slate-400 whitespace-nowrap">
                              <div>
                                <span className="font-medium text-slate-700 dark:text-slate-300">
                                  {d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' })}
                                </span>
                                <span className="block text-xs mt-0.5 text-slate-400">
                                  {d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}
                                </span>
                              </div>
                            </td>
                            <td className="px-5 py-3.5">
                              <span
                                className="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold"
                                style={{ backgroundColor: (c?.bg || '#64748b') + '20', color: c?.bg || '#64748b' }}
                              >
                                {formatTime(session.durationSeconds)}
                              </span>
                            </td>
                            <td className="px-5 py-3.5 text-xs text-slate-500 dark:text-slate-400 max-w-[200px]">
                              {session.notes
                                ? <span className="truncate block" title={session.notes}>📝 {session.notes}</span>
                                : <span className="text-slate-300 dark:text-slate-600">—</span>
                              }
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>

                {totalPages > 1 && (
                  <div className="flex items-center justify-between px-5 py-3 border-t border-slate-100 dark:border-slate-700">
                    <p className="text-xs text-slate-400">
                      Página {histPage} de {totalPages} &middot; {filteredSessions.length} registros
                    </p>
                    <div className="flex gap-1.5">
                      <button
                        onClick={() => setHistPage(p => Math.max(1, p - 1))}
                        disabled={histPage === 1}
                        className="px-3 py-1.5 text-xs font-semibold rounded-lg border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed transition-all"
                      >
                        ← Anterior
                      </button>
                      <button
                        onClick={() => setHistPage(p => Math.min(totalPages, p + 1))}
                        disabled={histPage === totalPages}
                        className="px-3 py-1.5 text-xs font-semibold rounded-lg border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed transition-all"
                      >
                        Próxima →
                      </button>
                    </div>
                  </div>
                )}
              </>
            )}
          </div>
        </div>
      );
    }

    // =============================================
    // COMPONENTES DE LAYOUT
    // =============================================

    const NAV_ITEMS = [
      {
        id: 'subjects',
        label: 'Disciplinas',
        icon: (
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
        )
      },
      {
        id: 'study',
        label: 'Estudar Agora',
        icon: (
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
        )
      },
      {
        id: 'notes',
        label: 'Mural de Notas',
        icon: (
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
          </svg>
        )
      },
      {
        id: 'schedule',
        label: 'Cronograma',
        icon: (
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
        )
      },
      {
        id: 'timer',
        label: 'Pomodoro',
        icon: (
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
          </svg>
        )
      },
      {
        id: 'progress',
        label: 'Progresso',
        icon: (
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
          </svg>
        )
      },
      {
        id: 'tasks',
        label: 'Tarefas',
        icon: (
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
          </svg>
        )
      },
    ];

    function Sidebar({ activeNav, onNavChange, isCollapsed, onToggleCollapse }) {
      return (
        <aside
          className={`flex flex-col h-screen fixed left-0 top-0 z-40 transition-all duration-300 ${
            isCollapsed ? 'w-16' : 'w-60'
          }`}
          style={{ background: 'linear-gradient(180deg, #1e3a8a 0%, #1e40af 60%, #1d4ed8 100%)' }}
        >
          <div className={`flex items-center gap-3 px-4 py-5 border-b border-white/10 ${isCollapsed ? 'justify-center' : ''}`}>
            <div className="flex-shrink-0 w-9 h-9 rounded-xl bg-emerald-500 flex items-center justify-center shadow-lg shadow-emerald-500/40">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
              </svg>
            </div>
            {!isCollapsed && (
              <div className="min-w-0">
                <span className="text-white font-black text-base tracking-tight">StudyFlow</span>
                <p className="text-blue-200/70 text-[10px] font-medium tracking-widest uppercase mt-0.5">Organize seus estudos</p>
              </div>
            )}
          </div>

          <nav className="flex-1 overflow-y-auto px-2 py-4 space-y-1">
            {NAV_ITEMS.map(item => {
              const isActive = activeNav === item.id;
              const isComingSoon = !['subjects', 'study', 'notes', 'progress'].includes(item.id);
              return (
                <button
                  key={item.id}
                  id={`nav-${item.id}`}
                  onClick={() => !isComingSoon && onNavChange(item.id)}
                  title={isCollapsed ? item.label : undefined}
                  className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all duration-150 group relative ${
                    isActive
                      ? 'bg-white/20 text-white shadow-lg'
                      : isComingSoon
                        ? 'text-blue-200/50 cursor-not-allowed'
                        : 'text-blue-100/80 hover:bg-white/10 hover:text-white'
                  } ${isCollapsed ? 'justify-center' : ''}`}
                >
                  <span className={`flex-shrink-0 ${isActive ? 'text-white' : ''}`}>
                    {item.icon}
                  </span>
                  {!isCollapsed && (
                    <>
                      <span className="flex-1 text-left">{item.label}</span>
                      {isComingSoon && (
                        <span className="text-[9px] font-bold bg-white/10 text-blue-200/60 px-1.5 py-0.5 rounded-full uppercase tracking-wider">
                          Em breve
                        </span>
                      )}
                    </>
                  )}
                  {isActive && (
                    <span className="absolute right-0 top-1/2 -translate-y-1/2 w-1 h-6 bg-emerald-400 rounded-l-full" />
                  )}
                </button>
              );
            })}
          </nav>

          <div className="px-2 pb-4 border-t border-white/10 pt-3">
            <button
              id="btn-toggle-sidebar"
              onClick={onToggleCollapse}
              title={isCollapsed ? 'Expandir sidebar' : 'Recolher sidebar'}
              className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-blue-200/70 hover:bg-white/10 hover:text-white text-sm font-medium transition-all ${isCollapsed ? 'justify-center' : ''}`}
            >
              <svg
                width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
                style={{ transform: isCollapsed ? 'rotate(180deg)' : 'rotate(0deg)', transition: 'transform 0.3s ease' }}
              >
                <polyline points="15 18 9 12 15 6"/>
              </svg>
              {!isCollapsed && <span>Recolher</span>}
            </button>
          </div>
        </aside>
      );
    }

    // =============================================
    // COMPONENTE: HEADER (CABEÇALHO)
    // =============================================
    function Header({ activeNav, onToggleTheme, theme, onResetAllData }) {
      const activeItem = NAV_ITEMS.find(i => i.id === activeNav);

      return (
        <header className="sticky top-0 z-30 bg-white/80 dark:bg-slate-900/80 glass border-b border-slate-200 dark:border-slate-700/60 px-6 py-4 flex items-center justify-between">
          <div>
            <h2 className="text-base font-bold text-slate-800 dark:text-white">
              {activeItem?.label || 'Início'}
            </h2>
            <p className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
              {new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}
            </p>
          </div>

          <div className="flex items-center gap-3">
            <button
              id="btn-reset-all"
              type="button"
              onClick={onResetAllData}
              className="inline-flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-bold bg-emerald-500 hover:bg-emerald-600 text-white shadow-lg shadow-emerald-500/30 hover:shadow-emerald-500/50 hover:scale-[1.02] active:scale-[0.98] transition-all cursor-pointer"
              title="Zerar todo o histórico para um novo usuário"
            >
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                <path d="M3 3v5h5"/>
              </svg>
              Zerar Dados
            </button>

            <button
              id="btn-toggle-theme"
              type="button"
              onClick={onToggleTheme}
              title={theme === 'dark' ? 'Alternar para modo claro' : 'Alternar para modo escuro'}
              className="relative w-14 h-7 rounded-full transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:ring-offset-2 focus:ring-offset-white dark:focus:ring-offset-slate-900 cursor-pointer"
              style={{ backgroundColor: theme === 'dark' ? '#10B981' : '#CBD5E1' }}
              aria-label="Alternar tema"
            >
              <span
                className="absolute top-0.5 left-0.5 w-6 h-6 rounded-full bg-white shadow-md flex items-center justify-center transition-transform duration-300"
                style={{ transform: theme === 'dark' ? 'translateX(28px)' : 'translateX(0px)' }}
              >
                {theme === 'dark' ? (
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="#0F172A" stroke="none">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                  </svg>
                ) : (
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="#F59E0B" stroke="#F59E0B" strokeWidth="1">
                    <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                  </svg>
                )}
              </span>
            </button>
          </div>
        </header>
      );
    }

    // =============================================
    // APP PRINCIPAL
    // =============================================
    function AppContent() {
      const { theme, toggleTheme } = useTheme();
      const [activeNav, setActiveNav] = useState('subjects');
      const [sidebarCollapsed, setSidebarCollapsed] = useState(false);

      const dbState = useIndexedDBFiles();

      // Função para apagar TUDO (Histórico, Disciplinas, Notas e Arquivos)
      async function handleResetAllData() {
        const confirmou = window.confirm(
          "⚠️ ATENÇÃO: Isso vai apagar TODO o histórico de estudos, disciplinas, post-its e arquivos salvos.\n\nDeseja zerar o aplicativo completamente?"
        );
        if (confirmou) {
          try {
            window.localStorage.clear();
            await dbState.clearAllFiles();
          } catch (e) {
            console.error('Erro ao limpar dados:', e);
          }
          window.location.reload();
        }
      }

      function renderPage() {
        switch (activeNav) {
          case 'subjects':
            return (
              <SubjectsPage
                dbFiles={dbState.filesList}
                onUploadFile={dbState.uploadFile}
                onViewFile={dbState.viewOrDownloadFile}
                onDeleteFile={dbState.deleteFile}
                onOpenClearAllModal={() => dbState.setIsClearModalOpen(true)}
                onPreviewFile={dbState.setPreviewFile}
              />
            );
          case 'study':    return <StudyPage />;
          case 'notes':    return <NotesPage />;
          case 'progress': return <ProgressPage />;
          default:
            return (
              <div className="flex flex-col items-center justify-center py-24 text-center animate-fade-in">
                <div className="w-16 h-16 rounded-2xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center mb-4">
                  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
                    <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
                  </svg>
                </div>
                <h3 className="text-lg font-bold text-slate-700 dark:text-slate-200 mb-1">Em desenvolvimento</h3>
                <p className="text-sm text-slate-500 dark:text-slate-400 max-w-xs">
                  Esta seção será implementada nas próximas fases do projeto.
                </p>
              </div>
            );
        }
      }

      const sidebarWidth = sidebarCollapsed ? 64 : 240;

      return (
        <div className="min-h-screen bg-slate-50 dark:bg-navy-900 text-slate-900 dark:text-white">
          <Sidebar
            activeNav={activeNav}
            onNavChange={setActiveNav}
            isCollapsed={sidebarCollapsed}
            onToggleCollapse={() => setSidebarCollapsed(v => !v)}
          />
          <div
            className="flex flex-col min-h-screen transition-all duration-300"
            style={{ marginLeft: `${sidebarWidth}px` }}
          >
            <Header
              activeNav={activeNav}
              onToggleTheme={toggleTheme}
              theme={theme}
              onResetAllData={handleResetAllData}
            />
            <main className="flex-1 p-6 lg:p-8">
              {renderPage()}
            </main>
            <footer className="px-6 py-3 text-center text-xs text-slate-400 dark:text-slate-600 border-t border-slate-200 dark:border-slate-800">
              StudyFlow © {new Date().getFullYear()} · Arquivos armazenados no IndexedDB do seu navegador
            </footer>
          </div>

          <ConfirmClearFilesModal
            isOpen={dbState.isClearModalOpen}
            onClose={() => dbState.setIsClearModalOpen(false)}
            onConfirm={dbState.clearAllFiles}
            totalFiles={dbState.filesList.length}
          />

          <FilePreviewModal
            file={dbState.previewFile}
            onClose={() => dbState.setPreviewFile(null)}
            onDownload={dbState.viewOrDownloadFile}
          />
        </div>
      );
    }

    function App() {
      return (
        <ThemeProvider>
          <AppContent />
        </ThemeProvider>
      );
    }

    // Renderização
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
