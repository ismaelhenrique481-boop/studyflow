          </div>

          {/* SIMULADOR PREDITIVO EM TEMPO REAL */}
          <section className="glass-card rounded-3xl p-6 sm:p-8 border-2 border-brand-500/30 space-y-6">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-brand-500/20 pb-4">
              <div>
                <span className="px-3 py-0.5 rounded-full bg-brand-500/20 text-brand-700 dark:text-brand-300 text-[10px] font-black uppercase tracking-wider">
                  ✦ Simulação Preditiva — 4º Semestre (2026.2)
                </span>
                <h3 className="text-xl font-bold text-[#111c38] dark:text-slate-100 mt-1">
                  Simulador de Impacto de Notas no IRA Geral
                </h3>
                <p className="text-xs text-[#111c38]/80 dark:text-slate-300">
                  Ajuste a <strong className="text-slate-800 dark:text-white">Carga Horária (Ci)</strong>, o <strong className="text-slate-800 dark:text-white">Peso (Pi = 4)</strong> e a <strong className="text-slate-800 dark:text-white">Nota (Ni)</strong> para projetar o impacto matemático exato em tempo real.
                </p>
              </div>

              {/* Comparativo de Impacto */}
              <div className="flex items-center gap-3 bg-white/90 dark:bg-[#162347] p-3 rounded-2xl border border-brand-500/30 shadow-sm">
                <div className="text-right">
                  <span className="text-[10px] text-slate-400 dark:text-slate-300 block uppercase font-bold">IRA Projetado</span>
                  <span className="text-2xl font-black text-brand-600 dark:text-brand-400">
                    {projectedIra.toFixed(2)}
                  </span>
                </div>
                <div className={`px-2 py-1 rounded-xl text-xs font-black ${
                  deltaIra >= 0
                    ? 'bg-emerald-500/20 text-emerald-600 dark:text-emerald-400'
                    : 'bg-rose-500/20 text-rose-600 dark:text-rose-400'
                }`}>
                  {deltaIra >= 0 ? `+${deltaIra.toFixed(2)}` : deltaIra.toFixed(2)} Δ
                </div>
              </div>
            </div>

            {/* Listagem Interativa de Disciplinas Simuladas (com Ci e Pi obrigatórios e editáveis) */}
            <div className="space-y-4">
              {predictiveSubjects.map((sub) => {
                const ponderation = (Number(sub.hours || 0) * Number(sub.weight || 1) * Number(sub.simulatedGrade || 0)).toFixed(1);
                return (
                  <div key={sub.id} className="p-5 rounded-2xl bg-white/90 dark:bg-[#162347] border border-brand-500/30 shadow-md space-y-3">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                      <div>
                        <h4 className="text-sm font-bold text-darkSlate dark:text-white">{sub.name}</h4>
                        <span className="text-[11px] text-brand-700 dark:text-brand-300 font-semibold">
                          Ponderação: <span className="font-mono font-bold">{ponderation}</span> pts (Ci × Pi × Ni)
                        </span>
                      </div>

                      <div className="flex items-center gap-3">
                        <div className="text-right">
                          <span className="text-[10px] text-slate-500 dark:text-slate-300 block uppercase font-bold">Nota Simulada</span>
                          <span className="text-lg font-black text-brand-600 dark:text-brand-400 font-mono">
                            {Number(sub.simulatedGrade).toFixed(1)}
                          </span>
                        </div>
                        <button
                          onClick={() => handleRemovePredictiveSubject(sub.id)}
                          className="text-slate-400 hover:text-red-500 text-sm p-1.5 rounded-lg hover:bg-red-50 dark:hover:bg-red-950/40 transition-colors"
                          title="Remover da simulação"
                        >
                          ✕
                        </button>
                      </div>
                    </div>

                    {/* Linha com inputs de Carga Horária (Ci) e Peso (Pi) */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2 border-t border-slate-100 dark:border-brand-500/20">
                      <div>
                        <label className="block text-[11px] font-bold text-slate-700 dark:text-slate-200 mb-1">
                          Carga Horária (Ci) *:
                        </label>
                        <div className="flex items-center gap-1.5">
                          <input
                            type="number"
                            min="10"
                            max="300"
                            step="1"
                            required
                            value={sub.hours}
                            onChange={(e) => {
                              const val = parseFloat(e.target.value) || 0;
                              setPredictiveSubjects(prev => prev.map(s => s.id === sub.id ? { ...s, hours: val } : s));
                            }}
                            className="w-24 px-2.5 py-1.5 rounded-xl bg-slate-50 dark:bg-[#0b132b] border border-brand-500/30 dark:border-brand-500/40 text-xs font-mono font-bold text-darkSlate dark:text-white focus:outline-none focus:ring-1 focus:ring-brand-500"
                          />
                          <span className="text-xs text-slate-500 dark:text-slate-300 font-semibold">horas</span>
                        </div>
                      </div>

                      <div>
                        <label className="block text-[11px] font-bold text-slate-700 dark:text-slate-200 mb-1">
                          Peso do Período (Pi) *:
                        </label>
                        <div className="flex items-center gap-1.5">
                          <input
                            type="number"
                            min="1"
                            max="10"
                            step="1"
                            required
                            value={sub.weight}
                            onChange={(e) => {
                              const val = parseFloat(e.target.value) || 1;
                              setPredictiveSubjects(prev => prev.map(s => s.id === sub.id ? { ...s, weight: val } : s));
                            }}
                            className="w-20 px-2.5 py-1.5 rounded-xl bg-slate-50 dark:bg-[#0b132b] border border-brand-500/30 dark:border-brand-500/40 text-xs font-mono font-bold text-darkSlate dark:text-white focus:outline-none focus:ring-1 focus:ring-brand-500"
                          />
                          <span className="text-xs text-slate-500 dark:text-slate-300 font-semibold">peso</span>
                        </div>
                      </div>
                    </div>

                    {/* Slider e input numérico da Nota (Ni) */}
                    <div className="pt-1">
                      <div className="flex items-center justify-between text-xs mb-1 font-semibold text-slate-600 dark:text-slate-200">
                        <span>Ajustar Nota (Ni):</span>
                        <div className="flex items-center gap-1">
                          <input
                            type="number"
                            min="0"
                            max="10"
                            step="0.1"
                            value={sub.simulatedGrade}
                            onChange={(e) => handleGradeSliderChange(sub.id, e.target.value)}
                            className="w-16 px-2 py-0.5 rounded-lg bg-slate-50 dark:bg-[#0b132b] border border-brand-500/30 dark:border-brand-500/40 text-xs font-mono font-bold text-brand-600 dark:text-brand-400 text-center"
                          />
                          <span className="text-[10px] text-slate-400 dark:text-slate-300">/ 10.0</span>
                        </div>
                      </div>
                      <div className="flex items-center gap-3">
                        <span className="text-[10px] font-bold text-slate-400 dark:text-slate-300">0.0</span>
                        <input
                          type="range"
                          min="0"
                          max="10"
                          step="0.1"
                          value={sub.simulatedGrade}
                          onChange={(e) => handleGradeSliderChange(sub.id, e.target.value)}
                          className="w-full h-2 bg-slate-200 dark:bg-[#0b132b] rounded-lg appearance-none cursor-pointer accent-brand-500"
                        />
                        <span className="text-[10px] font-bold text-slate-400 dark:text-slate-300">10.0</span>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>

            {/* Formulário para Adicionar Nova Disciplina à Simulação com Ci e Pi Obrigatórios */}
            <div className="p-5 rounded-2xl bg-white/90 dark:bg-[#162347] border border-brand-500/30 shadow-md space-y-3">
              <h4 className="text-xs font-bold uppercase tracking-wider text-darkSlate dark:text-white">
                Adicionar Nova Disciplina ao Simulador (4º Semestre)
              </h4>
              <div className="grid grid-cols-1 sm:grid-cols-12 gap-2.5 items-end">
                <div className="sm:col-span-5">
                  <label className="block text-[10px] font-bold text-slate-600 dark:text-slate-200 mb-1">Nome da Disciplina *</label>
                  <input
                    type="text"
                    required
                    value={newPredName}
                    onChange={(e) => setNewPredName(e.target.value)}
                    placeholder="Ex: Teoria das Estruturas II"
                    className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-[#0b132b] border border-brand-500/30 dark:border-brand-500/40 text-xs text-darkSlate dark:text-white focus:outline-none focus:ring-1 focus:ring-brand-500"
                  />
                </div>
                <div className="sm:col-span-2">
                  <label className="block text-[10px] font-bold text-slate-600 dark:text-slate-200 mb-1">Carga (Ci) *</label>
                  <input
                    type="number"
                    min="10"
                    max="300"
                    required
                    value={newPredHours}
                    onChange={(e) => setNewPredHours(e.target.value)}
                    placeholder="88"
                    className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-[#0b132b] border border-brand-500/30 dark:border-brand-500/40 text-xs text-darkSlate dark:text-white font-mono"
                  />
                </div>
                <div className="sm:col-span-2">
                  <label className="block text-[10px] font-bold text-slate-600 dark:text-slate-200 mb-1">Peso (Pi) *</label>
                  <input
                    type="number"
                    min="1"
                    max="10"
                    required
                    value={newPredWeight}
                    onChange={(e) => setNewPredWeight(e.target.value)}
                    placeholder="4"
                    className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-[#0b132b] border border-brand-500/30 dark:border-brand-500/40 text-xs text-darkSlate dark:text-white font-mono"
                  />
                </div>
                <div className="sm:col-span-1">
                  <label className="block text-[10px] font-bold text-slate-600 dark:text-slate-200 mb-1">Nota (Ni)</label>
                  <input
                    type="number"
                    min="0"
                    max="10"
                    step="0.1"
                    required
                    value={newPredGrade}
                    onChange={(e) => setNewPredGrade(e.target.value)}
                    placeholder="8.0"
                    className="w-full px-2 py-2 rounded-xl bg-slate-50 dark:bg-[#0b132b] border border-brand-500/30 dark:border-brand-500/40 text-xs text-darkSlate dark:text-white font-mono"
                  />
                </div>
                <div className="sm:col-span-2">
                  <button
                    type="button"
                    onClick={handleAddPredictiveSubject}
                    className="w-full py-2.5 rounded-xl bg-brand-500 hover:bg-brand-600 text-white text-xs font-bold transition-all cursor-pointer shadow-md shadow-brand-500/25"
                  >
                    + Simular
                  </button>
                </div>
              </div>
            </div>

            {/* Ações da Simulação */}
            <div className="flex flex-wrap items-center justify-between gap-3 pt-4 border-t border-brand-500/20">
              <span className="text-xs text-slate-500 dark:text-slate-400">
                A simulação pondera os valores informados de Ci e Pi sem alterar seus dados até que você decida consolidar.
              </span>
              <div className="flex gap-2">
                <button
                  type="button"
                  onClick={() => setPredictiveSubjects([
                    { id: 'pred-1', name: 'Resistência dos Materiais I', hours: 88, weight: 3, simulatedGrade: 8.5 },
                    { id: 'pred-2', name: 'Mecânica dos Fluidos', hours: 88, weight: 3, simulatedGrade: 8.2 },
                    { id: 'pred-3', name: 'Materiais de Construção Civil I', hours: 88, weight: 3, simulatedGrade: 9.0 },
                  ])}
                  className="px-3 py-2 rounded-xl border border-slate-200 dark:border-zinc-700 text-xs font-semibold hover:bg-slate-50 dark:hover:bg-zinc-800 cursor-pointer"
                >
                  Resetar Projeção
                </button>
                <button
                  type="button"
                  onClick={handleApplySimulationToRecords}
                  className="px-4 py-2 rounded-xl bg-brand-500 hover:bg-brand-600 text-white text-xs font-bold shadow-md shadow-brand-500/25 transition-all cursor-pointer"
                >
                  Consolidar no Histórico Oficial
                </button>
              </div>
            </div>
          </section>

          {/* TABELA DE DISCIPLINAS DO HISTÓRICO OFICIAL */}
          <section className="glass-card rounded-3xl p-6 border border-brand-500/25 space-y-4">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-100 dark:border-brand-500/20 pb-4">
              <div>
                <h3 className="text-base font-bold text-[#111c38] dark:text-slate-100 flex items-center gap-2">
                  <span className="w-2.5 h-2.5 rounded-full bg-brand-500"></span>
                  Disciplinas Registradas no Histórico Oficial
                </h3>
                <p className="text-xs text-[#111c38]/80 dark:text-slate-300">
                  Base de cálculo oficial universitária com cargas horárias (Ci) e pesos (Pi) reais.
                </p>
              </div>
              <button
                onClick={() => setIsAddModalOpen(true)}
                className="px-4 py-2 rounded-2xl bg-brand-500 hover:bg-brand-600 text-white text-xs font-bold shadow-md shadow-brand-500/25 transition-all flex items-center gap-1.5 cursor-pointer"
              >
                <span>+ Lançar Disciplina</span>
              </button>
            </div>

            <div className="overflow-x-auto touch-scroll">
              <div className="sm:hidden text-[10px] text-slate-400 dark:text-slate-400 mb-2 flex items-center gap-1.5 px-1">
                <span>↔</span>
                <span>Deslize lateralmente para ver todas as colunas de notas</span>
              </div>
              <table className="w-full text-left text-xs min-w-[620px]">
                <thead>
                  <tr className="border-b border-slate-100 dark:border-brand-500/20 text-slate-500 dark:text-slate-300 font-bold uppercase tracking-wider text-[10px]">
                    <th className="py-3 px-4">Disciplina</th>
                    <th className="py-3 px-3">Semestre</th>
                    <th className="py-3 px-3 font-mono">Carga (Ci)</th>
                    <th className="py-3 px-3 font-mono">Peso (Pi)</th>
                    <th className="py-3 px-3 font-mono">Nota (Ni)</th>
                    <th className="py-3 px-4 font-mono">Ponderação (Ci × Pi × Ni)</th>
                    <th className="py-3 px-3">Situação</th>
                    <th className="py-3 px-4 text-right">Ações</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100 dark:divide-brand-500/15">
                  {iraRecords.map((item) => {
                    const pond = (Number(item.hours || 0) * Number(item.semesterWeight || 1) * Number(item.grade || 0)).toFixed(1);
                    return (
                      <tr key={item.id} className="hover:bg-brand-500/5 transition-colors">
                        <td className="py-3 px-4 font-semibold text-slate-800 dark:text-white">
                          {item.subjectName}
                        </td>
                        <td className="py-3 px-3 text-slate-600 dark:text-slate-300">
                          {item.semester}
                        </td>
                        <td className="py-3 px-3 font-mono text-slate-600 dark:text-slate-300 font-bold">
                          {item.hours}h
                        </td>
                        <td className="py-3 px-3 font-mono text-slate-600 dark:text-slate-300 font-bold">
                          {item.semesterWeight || 1}
                        </td>
                        <td className="py-3 px-3 font-mono font-bold text-brand-600 dark:text-brand-400">
                          {Number(item.grade).toFixed(1)}
                        </td>
                        <td className="py-3 px-4 font-mono text-slate-600 dark:text-slate-300">
                          {pond}
                        </td>
                        <td className="py-3 px-3">
                          <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${
                            Number(item.grade) >= 5 ? 'bg-emerald-500/15 text-emerald-600 dark:text-emerald-400' : 'bg-rose-500/15 text-rose-600 dark:text-rose-400'
                          }`}>
                            {Number(item.grade) >= 5 ? 'Aprovado' : 'Reprovado'}
                          </span>
                        </td>
                        <td className="py-3 px-4 text-right">
                          <button
                            onClick={() => {
                              if (window.confirm(`Remover "${item.subjectName}" do cálculo oficial?`)) {
                                setIraRecords(prev => prev.filter(r => r.id !== item.id));
                              }
                            }}
                            className="text-slate-400 hover:text-red-500 p-1"
                            title="Excluir disciplina"
                          >
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                              <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
                            </svg>
                          </button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
                <tfoot>
                  <tr className="border-t-2 border-brand-500/25 bg-brand-500/5 font-bold text-xs">
                    <td className="py-3 px-4 text-slate-800 dark:text-white" colSpan={2}>
                      Total Geral Acumulado ({iraRecords.length} disciplinas)
                    </td>
                    <td className="py-3 px-3 font-mono text-brand-700 dark:text-brand-300">
                      {totalHours}h
                    </td>
                    <td className="py-3 px-3 font-mono text-slate-600 dark:text-slate-300">
                      Divisor: {currentDivisor}
                    </td>
                    <td className="py-3 px-3" colSpan={1}></td>
                    <td className="py-3 px-4 font-mono text-brand-700 dark:text-brand-300">
                      Pontos: {currentPoints.toFixed(1)}
                    </td>
                    <td className="py-3 px-4 text-right font-black text-sm text-brand-600 dark:text-brand-400" colSpan={2}>
                      IRA Oficial: {currentIra.toFixed(2)}
                    </td>
                  </tr>
                </tfoot>
              </table>
            </div>
          </section>

          {/* MODAL PARA LANÇAR DISCIPLINA MANUALMENTE (COM Ci E Pi OBRIGATÓRIOS) */}
          <Modal
            isOpen={isAddModalOpen}
            onClose={() => setIsAddModalOpen(false)}
            title="Lançar Disciplina no Histórico do IRA"
          >
            <form onSubmit={handleAddRecord} className="space-y-4">
              {formError && (
                <div className="p-3 rounded-xl bg-red-50 dark:bg-red-950/30 text-red-600 text-xs font-semibold">
                  {formError}
                </div>
              )}

              <div>
                <label className="block text-xs font-bold text-darkSlate dark:text-slate-300 mb-1">
                  Nome da Disciplina *
                </label>
                <input
                  type="text"
                  required
                  value={formSubjectName}
                  onChange={(e) => setFormSubjectName(e.target.value)}
                  placeholder="Ex: Estruturas de Aço e Madeira"
                  className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-[#0b132b] border border-slate-200 dark:border-brand-500/30 text-xs text-darkSlate dark:text-white focus:outline-none focus:border-brand-500"
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-bold text-darkSlate dark:text-slate-300 mb-1">
                    Semestre Letivo *
                  </label>
                  <input
                    type="text"
                    required
                    value={formSemester}
                    onChange={(e) => setFormSemester(e.target.value)}
                    placeholder="2026.2"
                    className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-[#0b132b] border border-slate-200 dark:border-brand-500/30 text-xs text-darkSlate dark:text-white"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-darkSlate dark:text-slate-300 mb-1">
                    Peso do Semestre (Pi) *
                  </label>
                  <input
                    type="number"
                    min="1"
                    max="10"
                    step="1"
                    required
                    value={formWeight}
                    onChange={(e) => setFormWeight(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-[#0b132b] border border-slate-200 dark:border-brand-500/30 text-xs text-darkSlate dark:text-white font-mono"
                  />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-bold text-darkSlate dark:text-slate-300 mb-1">
                    Carga Horária (Ci em horas) *
                  </label>
                  <input
                    type="number"
                    min="10"
                    max="300"
                    step="1"
                    required
                    value={formHours}
                    onChange={(e) => setFormHours(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-[#0b132b] border border-slate-200 dark:border-brand-500/30 text-xs text-darkSlate dark:text-white font-mono"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-darkSlate dark:text-slate-300 mb-1">
                    Nota Final Obtida (Ni) *
                  </label>
                  <input
                    type="number"
                    min="0"
                    max="10"
                    step="0.1"
                    required
                    value={formGrade}
                    onChange={(e) => setFormGrade(e.target.value)}
                    placeholder="8.5"
                    className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-[#0b132b] border border-slate-200 dark:border-brand-500/30 text-xs text-darkSlate dark:text-white font-mono"
                  />
                </div>
              </div>

              <div className="flex gap-2 pt-3">
                <button
                  type="button"
                  onClick={() => setIsAddModalOpen(false)}
                  className="flex-1 py-2 rounded-xl border border-slate-200 dark:border-zinc-700 text-xs font-semibold hover:bg-slate-50 dark:hover:bg-zinc-800"
                >
                  Cancelar
                </button>
                <button
                  type="submit"
                  className="flex-1 py-2 rounded-xl bg-brand-500 hover:bg-brand-600 text-white text-xs font-bold shadow-md shadow-brand-500/25"
                >
                  Salvar no Histórico
                </button>
              </div>
            </form>
          </Modal>
        </div>
      );
    }

    // =============================================
    // COMPONENTE AUXILIAR: CHECKLIST E SUBTAREFAS EM ETAPAS
    // =============================================
    function SubtasksSection({ task, onAddSubtask, onToggleSubtask, onDeleteSubtask }) {
      const [isExpanded, setIsExpanded] = useState(false);
      const [newTitle, setNewTitle] = useState('');

      const subtasks = Array.isArray(task.subtasks) ? task.subtasks : [];
      const total = subtasks.length;
      const completedCount = subtasks.filter(st => st.completed).length;
      const percent = total > 0 ? Math.round((completedCount / total) * 100) : 0;

      function handleAdd(e) {
        if (e) e.preventDefault();
        const trimmed = newTitle.trim();
        if (!trimmed) return;
        onAddSubtask(task.id, trimmed);
        setNewTitle('');
      }

      return (
        <div className="pt-2 mt-2 border-t border-slate-100 dark:border-zinc-800/80 space-y-2">
          {/* Cabeçalho do Expansor com Mini Barra de Progresso */}
          <div
            onClick={() => setIsExpanded(prev => !prev)}
            role="button"
            tabIndex="0"
            onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setIsExpanded(prev => !prev); } }}
            className="flex items-center justify-between gap-2 p-1.5 rounded-xl hover:bg-slate-50 dark:hover:bg-zinc-800/60 cursor-pointer transition-all select-none group"
            title={isExpanded ? 'Recolher etapas' : 'Expandir etapas e checklist'}
          >
            <div className="flex items-center gap-1.5 text-[11px] font-bold text-slate-600 dark:text-slate-300">
              <span className={`inline-block transition-transform duration-200 text-brand-600 dark:text-brand-400 ${isExpanded ? 'rotate-90' : ''}`}>
                ▶
              </span>
              <span>Etapas / Checklist</span>
              <span className="text-[10px] px-1.5 py-0.2 rounded-md font-semibold bg-brand-500/10 text-brand-700 dark:text-brand-300">
                {completedCount}/{total}
              </span>
            </div>

            {total > 0 && (
              <div className="flex items-center gap-2">
                <span className={`text-[10px] font-bold ${percent === 100 ? 'text-emerald-600 dark:text-emerald-400' : 'text-brand-600 dark:text-brand-400'}`}>
                  {percent}%
                </span>
                <div className="w-14 h-1.5 rounded-full bg-slate-200 dark:bg-zinc-700 overflow-hidden">
                  <div
                    className={`h-full rounded-full transition-all duration-300 ${percent === 100 ? 'bg-emerald-500' : 'bg-brand-500'}`}
                    style={{ width: `${percent}%` }}
                  />
                </div>
              </div>
            )}
          </div>

          {/* Painel Expansível de Checklist */}
          {isExpanded && (
            <div className="space-y-2.5 p-2 rounded-2xl bg-slate-50/70 dark:bg-zinc-900/50 border border-slate-200/60 dark:border-zinc-800/80 animate-fade-in">
              {/* Barra de Progresso Detalhada */}
              <div className="space-y-1">
                <div className="flex items-center justify-between text-[10px]">
                  <span className="font-semibold text-slate-500 dark:text-slate-400">
                    Progresso de Execução
                  </span>
                  <span className={`font-bold ${percent === 100 ? 'text-emerald-600 dark:text-emerald-400 flex items-center gap-1' : 'text-brand-600 dark:text-brand-400'}`}>
                    {percent === 100 && <span>✓</span>}
                    {completedCount} de {total} concluídas ({percent}%)
                  </span>
                </div>
                <div className="w-full h-2 rounded-full bg-slate-200 dark:bg-zinc-700 overflow-hidden">
                  <div
                    className={`h-full rounded-full transition-all duration-300 ${percent === 100 ? 'bg-emerald-500' : 'bg-brand-500'}`}
                    style={{ width: `${percent}%` }}
                  />
                </div>
              </div>

              {/* Lista de Itens do Checklist */}
              {total === 0 ? (
                <p className="text-[11px] text-slate-400 italic py-1 text-center">
                  Nenhuma subtarefa adicionada ainda.
                </p>
              ) : (
                <div className="space-y-1 max-h-48 overflow-y-auto pr-0.5">
                  {subtasks.map(st => (
                    <div
                      key={st.id}
                      className="group/item flex items-center justify-between gap-2 p-1.5 rounded-xl hover:bg-white dark:hover:bg-zinc-800/80 transition-colors border border-transparent hover:border-slate-200/60 dark:hover:border-zinc-700/60"
                    >
                      <label className="flex items-center gap-2.5 py-1 flex-1 cursor-pointer select-none min-w-0">
                        <input
                          type="checkbox"
                          checked={!!st.completed}
                          onChange={() => onToggleSubtask(task.id, st.id)}
                          className="w-4 h-4 sm:w-3.5 sm:h-3.5 rounded border-slate-300 dark:border-zinc-600 text-brand-600 focus:ring-brand-500 cursor-pointer accent-[#90a14a] shrink-0"
                        />
                        <span className={`text-[11px] sm:text-xs leading-snug break-words transition-all ${
                          st.completed
                            ? 'line-through text-slate-400 dark:text-slate-500 font-normal'
                            : 'text-darkSlate dark:text-slate-200 font-medium'
                        }`}>
                          {st.title}
                        </span>
                      </label>
                      <button
                        type="button"
                        onClick={() => onDeleteSubtask(task.id, st.id)}
                        className="opacity-70 sm:opacity-0 sm:group-hover/item:opacity-100 p-1.5 text-slate-400 hover:text-red-500 transition-opacity text-xs cursor-pointer shrink-0"
                        title="Excluir etapa"
                        aria-label="Excluir etapa"
                      >
                        ✕
                      </button>
                    </div>
                  ))}
                </div>
              )}

              {/* Input para Inserir Nova Subtarefa */}
              <form onSubmit={handleAdd} className="flex items-center gap-1.5 pt-1">
                <input
                  type="text"
                  value={newTitle}
                  onChange={(e) => setNewTitle(e.target.value)}
                  onKeyDown={(e) => {
                    if (e.key === 'Enter') {
                      e.preventDefault();
                      handleAdd();
                    }
                  }}
                  placeholder="Nova etapa (pressione Enter)..."
                  className="flex-1 px-2.5 py-1.5 rounded-xl bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-700 text-[11px] text-darkSlate dark:text-white placeholder:text-slate-400 focus:outline-none focus:ring-1 focus:ring-brand-500"
                />
                <button
                  type="submit"
                  disabled={!newTitle.trim()}
                  className="px-2.5 py-1.5 rounded-xl bg-brand-500 hover:bg-brand-600 disabled:opacity-40 text-white text-[11px] font-bold shadow-sm transition-all flex items-center gap-1"
                  title="Adicionar etapa"
                >
                  <span>+</span>
                </button>
              </form>
            </div>
          )}
        </div>
      );
    }

    // =============================================
    // TELA 3: PROJETOS (GESTÃO KANBAN & LISTA TÉCNICA)
    // =============================================
    function ProjectsPage({ tasks, setTasks, subjects }) {
      const [viewMode, setViewMode] = useState('kanban'); // 'kanban' | 'list'
      const [search, setSearch] = useState('');
      const [filterSubject, setFilterSubject] = useState('all');
      const [isModalOpen, setIsModalOpen] = useState(false);

      // Form state do Modal
      const [taskTitle, setTaskTitle] = useState('');
      const [taskDesc, setTaskDesc] = useState('');
      const [taskSubject, setTaskSubject] = useState(subjects[0]?.id || '');
      const [taskDueDate, setTaskDueDate] = useState('');
      const [taskPriority, setTaskPriority] = useState('medium');
      const [modalSubtasks, setModalSubtasks] = useState([]);
      const [modalSubtaskInput, setModalSubtaskInput] = useState('');

      const filteredTasks = useMemo(() => {
        return tasks.filter(t => {
          const matchSearch = t.title.toLowerCase().includes(search.toLowerCase()) || (t.description && t.description.toLowerCase().includes(search.toLowerCase()));
          const matchSubj = filterSubject === 'all' || t.subjectId === filterSubject;
          return matchSearch && matchSubj;
        });
      }, [tasks, search, filterSubject]);

      function handleSaveTask(e) {
        e.preventDefault();
        if (!taskTitle.trim()) return;

        const newTask = {
          id: `task-${Date.now()}-${Math.random().toString(36).slice(2, 5)}`,
          title: taskTitle.trim(),
          description: taskDesc.trim(),
          subjectId: taskSubject,
          dueDate: taskDueDate,
          priority: taskPriority,
          status: 'todo',
          subtasks: modalSubtasks.map(title => ({
            id: `sub-${Date.now()}-${Math.random().toString(36).slice(2, 5)}`,
            title,
            completed: false
          }))
        };

        setTasks(prev => [newTask, ...prev]);
        setIsModalOpen(false);
        setTaskTitle('');
        setTaskDesc('');
        setModalSubtasks([]);
        setModalSubtaskInput('');
      }

      // Conclusão rápida instantânea (Marca como done ou volta para todo)
      function handleToggleQuickComplete(taskId) {
        setTasks(prev => prev.map(t => {
          if (t.id === taskId) {
            const nextStatus = t.status === 'done' ? 'todo' : 'done';
            if (nextStatus === 'done' && typeof playChimeAlert === 'function') {
              playChimeAlert(true);
            }
            return { ...t, status: nextStatus };
          }
          return t;
        }));
      }

      // Adicionar Subtarefa / Etapa
      function handleAddSubtask(taskId, title) {
        const cleanTitle = (title || '').trim();
        if (!cleanTitle) return;
        const newSub = {
          id: `sub-${Date.now()}-${Math.random().toString(36).slice(2, 5)}`,
          title: cleanTitle,
          completed: false
        };

        setTasks(prev => prev.map(t => {
          if (t.id === taskId) {
            const subtasks = Array.isArray(t.subtasks) ? [...t.subtasks, newSub] : [newSub];
            return { ...t, subtasks };
          }
          return t;
        }));
      }

      // Alternar estado de conclusão da subtarefa
      function handleToggleSubtask(taskId, subtaskId) {
        setTasks(prev => prev.map(t => {
          if (t.id === taskId) {
            const currentSubtasks = Array.isArray(t.subtasks) ? t.subtasks : [];
            const updatedSubtasks = currentSubtasks.map(st => {
              if (st.id === subtaskId) {
                const nextState = !st.completed;
                if (nextState && typeof playChimeAlert === 'function') {
                  playChimeAlert(true);
                }
                return { ...st, completed: nextState };
              }
              return st;
            });
            return { ...t, subtasks: updatedSubtasks };
          }
          return t;
        }));
      }

      // Excluir subtarefa
      function handleDeleteSubtask(taskId, subtaskId) {
        setTasks(prev => prev.map(t => {
          if (t.id === taskId) {
            const currentSubtasks = Array.isArray(t.subtasks) ? t.subtasks : [];
            return { ...t, subtasks: currentSubtasks.filter(st => st.id !== subtaskId) };
          }
          return t;
        }));
      }

      function handleUpdateStatus(taskId, nextStatus) {
        setTasks(prev => prev.map(t => t.id === taskId ? { ...t, status: nextStatus } : t));
      }

      function handleDeleteTask(taskId) {
        if (window.confirm('Excluir este projeto/tarefa?')) {
          setTasks(prev => prev.filter(t => t.id !== taskId));
        }
      }

      // Helpers para subtarefas no modal de criação
      function handleAddModalSubtask(e) {
        if (e) e.preventDefault();
        const trimmed = modalSubtaskInput.trim();
        if (!trimmed) return;
        setModalSubtasks(prev => [...prev, trimmed]);
        setModalSubtaskInput('');
      }

      function handleRemoveModalSubtask(index) {
        setModalSubtasks(prev => prev.filter((_, i) => i !== index));
      }

      return (
        <div className="max-w-6xl mx-auto space-y-6 animate-fade-in">
          {/* Header */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h1 className="text-2xl sm:text-3xl font-black text-[#111c38] dark:text-[#111c38] flex items-center gap-3">
                <span className="p-2 rounded-2xl bg-brand-500 text-white shadow-md shadow-brand-500/30">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
                    <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
                  </svg>
                </span>
                Projetos & Atividades de Engenharia
              </h1>
              <p className="text-xs sm:text-sm text-[#111c38]/80 dark:text-[#111c38] mt-1">
                Controle de entregas de dimensionamentos, relatórios de ensaios e laudos técnicos com checklist em etapas.
              </p>
            </div>

            <div className="flex items-center gap-2">
              <div className="p-1 rounded-2xl bg-slate-100 dark:bg-[#0b132b] border border-brand-500/20 flex gap-1">
                <button
                  onClick={() => setViewMode('kanban')}
                  className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-colors ${
                    viewMode === 'kanban'
                      ? 'bg-white dark:bg-[#162347] text-brand-600 dark:text-white shadow-sm border border-brand-500/30'
                      : 'text-slate-600 dark:text-slate-300 hover:text-brand-600 dark:hover:text-brand-400 hover:bg-brand-500/10'
                  }`}
                >
                  Kanban
                </button>
                <button
                  onClick={() => setViewMode('list')}
                  className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-colors ${
                    viewMode === 'list'
                      ? 'bg-white dark:bg-[#162347] text-brand-600 dark:text-white shadow-sm border border-brand-500/30'
                      : 'text-slate-600 dark:text-slate-300 hover:text-brand-600 dark:hover:text-brand-400 hover:bg-brand-500/10'
                  }`}
                >
                  Lista
                </button>
              </div>

              <button
                onClick={() => setIsModalOpen(true)}
                className="px-4 py-2.5 rounded-2xl bg-brand-500 hover:bg-brand-600 text-white text-xs font-bold shadow-md shadow-brand-500/25 transition-all cursor-pointer flex items-center gap-1.5"
              >
                <span>+ Novo Projeto</span>
              </button>
            </div>
          </div>

          {/* Filtros */}
          <div className="flex flex-wrap gap-3 items-center">
            <input
              type="text"
              value={search}
              onChange={(e) => setSearch(e.target.value)}
              placeholder="Buscar projetos, vigas, ensaios..."
              className="flex-1 min-w-[200px] px-4 py-2.5 rounded-2xl bg-white/90 dark:bg-[#0b132b] border border-brand-500/25 text-xs text-slate-800 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-brand-500"
            />
            <select
              value={filterSubject}
              onChange={(e) => setFilterSubject(e.target.value)}
              className="px-3 py-2.5 rounded-2xl bg-white/90 dark:bg-[#0b132b] border border-brand-500/25 text-xs text-slate-800 dark:text-white"
            >
              <option value="all">Todas as Disciplinas</option>
              {subjects.map(s => (
                <option key={s.id} value={s.id}>{s.name}</option>
              ))}
            </select>
          </div>

          {/* Visualização KANBAN */}
          {viewMode === 'kanban' ? (
            <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
              {[
                { key: 'todo', label: 'A Fazer', color: 'bg-slate-400' },
                { key: 'in_progress', label: 'Em Andamento', color: 'bg-brand-500' },
                { key: 'done', label: 'Concluído', color: 'bg-emerald-500' },
              ].map(col => {
                const colTasks = filteredTasks.filter(t => t.status === col.key);
                return (
                  <div key={col.key} className="glass-card rounded-3xl p-4 border border-brand-500/20 flex flex-col min-h-[420px]">
                    <div className="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-brand-500/20 mb-3">
                      <div className="flex items-center gap-2">
                        <span className={`w-2.5 h-2.5 rounded-full ${col.color}`}></span>
                        <h3 className="text-xs font-bold uppercase tracking-wider text-[#111c38] dark:text-slate-100">
                          {col.label}
                        </h3>
                      </div>
                      <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-slate-100 dark:bg-[#0b132b] text-slate-600 dark:text-slate-300">
                        {colTasks.length}
                      </span>
                    </div>

                    <div className="space-y-3 flex-1 overflow-y-auto">
                      {colTasks.map(t => {
                        const subj = subjects.find(s => s.id === t.subjectId);
                        const isDone = t.status === 'done';

                        return (
                          <div key={t.id} className="p-4 rounded-2xl bg-white/90 dark:bg-[#162347] border border-brand-500/20 shadow-sm space-y-2.5 card-hover">
                            {/* Linha Superior: Botão Conclusão Rápida + Tag Disciplina + Excluir */}
                            <div className="flex items-center justify-between gap-2">
                              <div className="flex items-center gap-2 min-w-0">
                                {/* Botão de Conclusão Rápida */}
                                <button
                                  type="button"
                                  onClick={() => handleToggleQuickComplete(t.id)}
                                  className={`w-6 h-6 rounded-lg flex items-center justify-center transition-all flex-shrink-0 cursor-pointer ${
                                    isDone
                                      ? 'bg-emerald-500 text-white shadow-sm shadow-emerald-500/30'
                                      : 'border-2 border-slate-300 dark:border-zinc-600 hover:border-emerald-500 hover:bg-emerald-50 dark:hover:bg-emerald-950/30 text-transparent hover:text-emerald-600'
                                  }`}
                                  title={isDone ? 'Concluído! Clique para marcar como pendente' : 'Marcar como concluído instantaneamente'}
                                >
                                  <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3">
                                    <polyline points="20 6 9 17 4 12" />
                                  </svg>
                                </button>

                                <span className="text-[10px] font-black px-2 py-0.5 rounded-md bg-brand-500/15 text-brand-700 dark:text-brand-300 truncate">
                                  {subj?.name || 'Geral'}
                                </span>
                              </div>

                              <button
                                onClick={() => handleDeleteTask(t.id)}
                                className="text-slate-300 hover:text-red-500 text-xs p-1"
                                title="Excluir projeto/tarefa"
                              >
                                ✕
                              </button>
                            </div>

                            {/* Título do Projeto com Riscado se Concluído */}
                            <h4 className={`text-xs font-bold leading-snug transition-all ${
                              isDone ? 'line-through text-slate-400 dark:text-slate-500' : 'text-darkSlate dark:text-white'
                            }`}>
                              {t.title}
                            </h4>

                            {t.description && (
                              <p className="text-[11px] text-slate-500 dark:text-slate-400 line-clamp-2">
                                {t.description}
                              </p>
                            )}

                            {/* Sistema de Checklist e Subtarefas em Etapas */}
                            <SubtasksSection
                              task={t}
                              onAddSubtask={handleAddSubtask}
                              onToggleSubtask={handleToggleSubtask}
                              onDeleteSubtask={handleDeleteSubtask}
                            />

                            {/* Rodapé do Card: Data e Botões de Mover */}
                            <div className="flex items-center justify-between pt-2 text-[10px] border-t border-slate-100 dark:border-zinc-800">
                              <div className="flex flex-col gap-0.5">
                                <span className="text-slate-400 font-medium">
                                  📅 {t.dueDate || 'Sem prazo'}
                                </span>
                                {(() => {
                                  const dueInfo = getDueStatus(t.dueDate);
                                  return dueInfo ? (
                                    <span className={`text-[9px] px-1.5 py-0.5 rounded-md font-bold inline-block w-fit ${dueInfo.badgeClass}`}>
                                      {dueInfo.text}
                                    </span>
                                  ) : null;
                                })()}
                              </div>
                              <div className="flex gap-1">
                                {col.key !== 'todo' && (
                                  <button
                                    onClick={() => handleUpdateStatus(t.id, col.key === 'done' ? 'in_progress' : 'todo')}
                                    className="p-1 rounded hover:bg-slate-100 dark:hover:bg-zinc-800 text-slate-500"
                                    title="Mover para anterior"
                                  >
                                    ←
                                  </button>
                                )}
                                {col.key !== 'done' && (
                                  <button
                                    onClick={() => handleUpdateStatus(t.id, col.key === 'todo' ? 'in_progress' : 'done')}
                                    className="p-1 rounded hover:bg-slate-100 dark:hover:bg-zinc-800 text-brand-600 font-bold"
                                    title="Avançar status"
                                  >
                                    →
                                  </button>
                                )}
                              </div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                );
              })}
            </div>
          ) : (
            /* Visualização Lista */
            <div className="glass-card rounded-3xl overflow-hidden border border-brand-500/20">
              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs">
                  <thead>
                    <tr className="border-b border-slate-100 dark:border-zinc-800 text-slate-400 font-bold uppercase tracking-wider text-[10px]">
                      <th className="py-3 px-4 text-center w-12">Check</th>
                      <th className="py-3 px-4">Projeto / Entrega</th>
                      <th className="py-3 px-4">Disciplina</th>
                      <th className="py-3 px-4">Etapas / Checklist</th>
                      <th className="py-3 px-4">Prazo</th>
                      <th className="py-3 px-4">Prioridade</th>
                      <th className="py-3 px-4">Status</th>
                      <th className="py-3 px-6 text-right">Ação</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100 dark:divide-zinc-800">
                    {filteredTasks.map(t => {
                      const subj = subjects.find(s => s.id === t.subjectId);
                      const isDone = t.status === 'done';
                      const subtasks = Array.isArray(t.subtasks) ? t.subtasks : [];
                      const completedCount = subtasks.filter(st => st.completed).length;
                      const percent = subtasks.length > 0 ? Math.round((completedCount / subtasks.length) * 100) : 0;

                      return (
                        <tr key={t.id} className="hover:bg-brand-500/5">
                          {/* Botão Conclusão Rápida na Tabela */}
                          <td className="py-3.5 px-4 text-center">
                            <button
                              type="button"
                              onClick={() => handleToggleQuickComplete(t.id)}
                              className={`w-6 h-6 mx-auto rounded-lg flex items-center justify-center transition-all cursor-pointer ${
                                isDone
                                  ? 'bg-emerald-500 text-white shadow-sm shadow-emerald-500/30'
                                  : 'border-2 border-slate-300 dark:border-zinc-600 hover:border-emerald-500 hover:bg-emerald-50 dark:hover:bg-emerald-950/30 text-transparent hover:text-emerald-600'
                              }`}
                              title={isDone ? 'Concluído! Clique para marcar como pendente' : 'Marcar como concluído instantaneamente'}
                            >
                              <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3">
                                <polyline points="20 6 9 17 4 12" />
                              </svg>
                            </button>
                          </td>

                          {/* Título do Projeto */}
                          <td className="py-3.5 px-4 font-semibold">
                            <div className={`transition-all ${isDone ? 'line-through text-slate-400 dark:text-slate-500' : 'text-darkSlate dark:text-white'}`}>
                              {t.title}
                            </div>
                            {t.description && (
                              <div className="text-[10px] text-slate-400 font-normal line-clamp-1 mt-0.5">
                                {t.description}
                              </div>
                            )}
                          </td>

                          {/* Disciplina */}
                          <td className="py-3.5 px-4 text-slate-600 dark:text-slate-300">
                            {subj?.name || 'Geral'}
                          </td>

                          {/* Progresso de Subtarefas na Lista */}
                          <td className="py-3.5 px-4">
                            {subtasks.length > 0 ? (
                              <div className="space-y-1">
                                <div className="flex items-center gap-1.5 text-[10px] font-bold text-slate-500 dark:text-slate-400">
                                  <span>{completedCount}/{subtasks.length}</span>
                                  <span className={percent === 100 ? 'text-emerald-500 font-bold' : 'text-brand-600'}>
                                    ({percent}%)
                                  </span>
                                </div>
                                <div className="w-20 h-1.5 rounded-full bg-slate-200 dark:bg-zinc-700 overflow-hidden">
                                  <div
                                    className={`h-full rounded-full transition-all ${percent === 100 ? 'bg-emerald-500' : 'bg-brand-500'}`}
                                    style={{ width: `${percent}%` }}
                                  />
                                </div>
                              </div>
                            ) : (
                              <span className="text-[10px] text-slate-400">Sem etapas</span>
                            )}
                          </td>

                          {/* Prazo */}
                          <td className="py-3.5 px-4 font-mono text-slate-600 dark:text-slate-300">
                            <div>{t.dueDate || 'Sem prazo'}</div>
                            {(() => {
                              const dueInfo = getDueStatus(t.dueDate);
                              return dueInfo ? (
                                <div className={`text-[9px] px-1.5 py-0.5 rounded-md font-bold inline-block mt-0.5 ${dueInfo.badgeClass}`}>
                                  {dueInfo.text}
                                </div>
                              ) : null;
                            })()}
                          </td>

                          {/* Prioridade */}
                          <td className="py-3.5 px-4">
                            <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${
                              t.priority === 'high' ? 'bg-red-500/15 text-red-600' : 'bg-brand-500/15 text-brand-700'
                            }`}>
                              {t.priority === 'high' ? 'Alta' : 'Normal'}
                            </span>
                          </td>

                          {/* Status */}
                          <td className="py-3.5 px-4">
                            <span className={`text-[11px] font-bold ${
                              t.status === 'done' ? 'text-emerald-600 dark:text-emerald-400' : t.status === 'in_progress' ? 'text-brand-600' : 'text-slate-500'
                            }`}>
                              {t.status === 'done' ? 'Concluído' : t.status === 'in_progress' ? 'Em Andamento' : 'A Fazer'}
                            </span>
                          </td>

                          {/* Ações */}
                          <td className="py-3.5 px-6 text-right">
                            <button
                              onClick={() => handleDeleteTask(t.id)}
                              className="text-slate-400 hover:text-red-500 p-1"
                              title="Excluir"
                            >
                              ✕
                            </button>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* Modal Novo Projeto */}
          <Modal isOpen={isModalOpen} onClose={() => setIsModalOpen(false)} title="Cadastrar Novo Projeto de Engenharia">
            <form onSubmit={handleSaveTask} className="space-y-4">
              <div>
                <label className="block text-xs font-bold text-darkSlate dark:text-slate-300 mb-1">Título do Projeto *</label>
                <input
                  type="text"
                  required
                  value={taskTitle}
                  onChange={(e) => setTaskTitle(e.target.value)}
                  placeholder="Ex: Memorial Descritivo de Fundação Rasa"
                  className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 text-xs text-darkSlate dark:text-white"
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-darkSlate dark:text-slate-300 mb-1">Descrição / Detalhes</label>
                <textarea
                  rows="2"
                  value={taskDesc}
                  onChange={(e) => setTaskDesc(e.target.value)}
                  placeholder="Critérios de dimensionamento, normas ABNT aplicáveis..."
                  className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 text-xs text-darkSlate dark:text-white"
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-bold text-darkSlate dark:text-slate-300 mb-1">Disciplina</label>
                  <select
                    value={taskSubject}
                    onChange={(e) => setTaskSubject(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 text-xs text-darkSlate dark:text-white"
                  >
                    {subjects.map(s => (
                      <option key={s.id} value={s.id}>{s.name}</option>
                    ))}
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-bold text-darkSlate dark:text-slate-300 mb-1">Data de Entrega</label>
                  <input
                    type="date"
                    value={taskDueDate}
                    onChange={(e) => setTaskDueDate(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 text-xs text-darkSlate dark:text-white"
                  />
                </div>
              </div>

              {/* Subtarefas / Checklist Iniciais no Modal */}
              <div className="p-3 rounded-2xl bg-slate-50 dark:bg-zinc-850 border border-slate-200/80 dark:border-zinc-700/80 space-y-2">
                <label className="block text-xs font-bold text-darkSlate dark:text-slate-300">
                  Etapas e Checklist Inicial (Opcional)
                </label>

                {modalSubtasks.length > 0 && (
                  <div className="space-y-1.5 max-h-32 overflow-y-auto pr-1">
                    {modalSubtasks.map((stTitle, idx) => (
                      <div key={idx} className="flex items-center justify-between gap-2 p-1.5 rounded-xl bg-white dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 text-xs">
                        <span className="text-darkSlate dark:text-white truncate flex items-center gap-1.5">
                          <span className="text-brand-500 font-bold">•</span> {stTitle}
                        </span>
                        <button
                          type="button"
                          onClick={() => handleRemoveModalSubtask(idx)}
                          className="text-slate-400 hover:text-red-500 text-xs px-1"
                        >
                          ✕
                        </button>
                      </div>
                    ))}
                  </div>
                )}

                <div className="flex gap-2">
                  <input
                    type="text"
                    value={modalSubtaskInput}
                    onChange={(e) => setModalSubtaskInput(e.target.value)}
                    onKeyDown={(e) => {
                      if (e.key === 'Enter') {
                        e.preventDefault();
                        handleAddModalSubtask();
                      }
                    }}
                    placeholder="Adicionar etapa inicial (pressione Enter)..."
                    className="flex-1 px-3 py-1.5 rounded-xl bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-700 text-xs text-darkSlate dark:text-white"
                  />
                  <button
                    type="button"
                    onClick={handleAddModalSubtask}
                    disabled={!modalSubtaskInput.trim()}
                    className="px-3 py-1.5 rounded-xl bg-slate-200 dark:bg-zinc-700 hover:bg-brand-500 hover:text-white disabled:opacity-40 text-xs font-bold transition-colors"
                  >
                    + Adicionar
                  </button>
                </div>
              </div>

              <div className="flex gap-2 pt-3">
                <button
                  type="button"
                  onClick={() => setIsModalOpen(false)}
                  className="flex-1 py-2 rounded-xl border border-slate-200 dark:border-zinc-700 text-xs font-semibold"
                >
                  Cancelar
                </button>
                <button
                  type="submit"
                  className="flex-1 py-2 rounded-xl bg-brand-500 hover:bg-brand-600 text-white text-xs font-bold shadow-md shadow-brand-500/25"
                >
                  Criar Projeto
                </button>
              </div>
            </form>
          </Modal>
        </div>
      );
    }

    // =============================================
    // TELA 4: POMODORO COM TEMPO PERSONALIZADO LIVRE
    // =============================================
    // COMPONENTE COMPLETO: POMODORO & DASHBOARD DE HORAS
    // =============================================
    function PomodoroDashboardModule({ subjects, inStudiesTab = false }) {
      const [mode, setMode] = useState('focus'); // 'focus' | 'short_break' | 'long_break' | 'custom'
      const [customFocusMinutes, setCustomFocusMinutes] = useLocalStorage('studyflow-pomodoro-custom-focus', 45);
      const [customBreakMinutes, setCustomBreakMinutes] = useLocalStorage('studyflow-pomodoro-custom-break', 10);
      const [selectedSubject, setSelectedSubject] = useState(subjects[0]?.id || '');
      const [status, setStatus] = useState('idle'); // 'idle' | 'running' | 'paused'
      const [timeLeft, setTimeLeft] = useState(25 * 60);
      const [isCustomModalOpen, setIsCustomModalOpen] = useState(false);
      const [soundTestActive, setSoundTestActive] = useState(false);

      // Persistência robusta de estatísticas de estudo
      const todayStr = new Date().toISOString().slice(0, 10);
      const [studyStats, setStudyStats] = useLocalStorage('studyflow-study-stats-v2', {
        totalMinutes: 1710, // ~28.5 horas iniciais acumuladas realistas
        todayDate: todayStr,
        todayCycles: 3,
        subjectMinutes: {
          'subj-1': 480, // Resistência dos Materiais I (8h)
          'subj-2': 360, // Mecânica dos Fluidos (6h)
          'subj-3': 300, // Materiais de Construção Civil I (5h)
          'subj-4': 270, // Topografia & Geodésia (4.5h)
          'subj-5': 300, // Concreto Armado I (5h)
        }
      });

      // Validação de troca de dia para os ciclos diários
      useEffect(() => {
        if (studyStats.todayDate !== todayStr) {
          setStudyStats(prev => ({
            ...prev,
            todayDate: todayStr,
            todayCycles: 0,
          }));
        }
      }, [todayStr, studyStats.todayDate, setStudyStats]);

      const endTimeRef = useRef(null);
      const timerRef = useRef(null);

      // Retorna a duração em segundos
      function getDurationForMode(m) {
        if (m === 'focus') return 25 * 60;
        if (m === 'short_break') return 5 * 60;
        if (m === 'long_break') return 15 * 60;
        return (customFocusMinutes || 45) * 60;
      }

      function switchMode(newMode) {
        setMode(newMode);
        setStatus('idle');
        if (timerRef.current) clearInterval(timerRef.current);
        setTimeLeft(getDurationForMode(newMode));
      }

      function handleStart() {
        if (status === 'running') return;
        const now = Date.now();
        endTimeRef.current = now + (timeLeft * 1000);
        setStatus('running');

        timerRef.current = setInterval(() => {
          const remaining = Math.max(0, Math.ceil((endTimeRef.current - Date.now()) / 1000));
          setTimeLeft(remaining);

          if (remaining <= 0) {
            clearInterval(timerRef.current);
            setStatus('idle');
            
            // Disparo automático do alarme sonoro harmônico polifônico
            playPomodoroAlarm();

            if (mode === 'focus' || mode === 'custom') {
              const minutesSpent = mode === 'custom' ? (customFocusMinutes || 45) : 25;
              setStudyStats(prev => {
                const prevSubjMins = prev.subjectMinutes || {};
                const currentSubj = selectedSubject || subjects[0]?.id || 'subj-1';
                return {
                  ...prev,
                  totalMinutes: (prev.totalMinutes || 0) + minutesSpent,
                  todayCycles: (prev.todayCycles || 0) + 1,
                  subjectMinutes: {
                    ...prevSubjMins,
                    [currentSubj]: (prevSubjMins[currentSubj] || 0) + minutesSpent,
                  }
                };
              });
              alert('🎉 Ciclo de Foco em Engenharia Concluído! O alarme foi acionado e suas horas foram contabilizadas.');
            } else {
              alert('⏰ Pausa finalizada! O alarme tocou. Pronto para o próximo ciclo de foco?');
            }
          }
        }, 1000);
      }

      function handlePause() {
        if (status !== 'running') return;
        clearInterval(timerRef.current);
        setStatus('paused');
      }

      function handleReset() {
        if (timerRef.current) clearInterval(timerRef.current);
        setStatus('idle');
        setTimeLeft(getDurationForMode(mode));
      }

      function handleTestSound() {
        setSoundTestActive(true);
        playPomodoroAlarm();
        setTimeout(() => setSoundTestActive(false), 2000);
      }

      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      const formattedTime = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      const totalDuration = getDurationForMode(mode);
      const progressPercent = Math.max(0, Math.min(100, ((totalDuration - timeLeft) / totalDuration) * 100));

      const totalHoursStudied = ((studyStats.totalMinutes || 0) / 60).toFixed(1);
      const currentTodayCycles = studyStats.todayCycles || 0;

      return (
        <div className="space-y-8 animate-fade-in">
          {/* Header descritivo se não estiver embutido com header próprio */}
          {!inStudiesTab && (
            <div className="text-center max-w-2xl mx-auto">
              <h1 className="text-2xl sm:text-3xl font-black text-[#111c38] dark:text-[#111c38] flex items-center justify-center gap-3">
                <span className="p-2 rounded-2xl bg-brand-500 text-white shadow-md shadow-brand-500/30">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
                    <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                  </svg>
                </span>
                Pomodoro & Dashboard de Horas
              </h1>
              <p className="text-xs sm:text-sm text-[#111c38]/80 dark:text-[#111c38] mt-1">
                Temporizador integrado para projetos estruturais, alerta sonoro nativo e controle semanal de metas.
              </p>
            </div>
          )}

          {/* PAINEL CENTRAL: CRONÔMETRO POMODORO */}
          <div className="glass-card rounded-3xl p-6 sm:p-8 border border-brand-500/25 space-y-6 max-w-3xl mx-auto text-center">
            {/* Seletor de Modo e Botão de Testar Som */}
            <div className="flex flex-wrap items-center justify-center gap-2">
              <div className="inline-flex p-1 rounded-2xl bg-slate-100 dark:bg-[#0b132b] border border-brand-500/20 gap-1 flex-wrap justify-center">
                {[
                  { key: 'focus', label: 'Foco (25 min)' },
                  { key: 'short_break', label: 'Pausa Curta (5 min)' },
                  { key: 'long_break', label: 'Pausa Longa (15 min)' },
                  { key: 'custom', label: `Personalizado (${customFocusMinutes}m)` },
                ].map(m => (
                  <button
                    key={m.key}
                    onClick={() => switchMode(m.key)}
                    className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all cursor-pointer ${
                      mode === m.key
                        ? 'bg-brand-500 text-white shadow-md shadow-brand-500/30'
                        : 'text-slate-600 dark:text-slate-300 hover:text-brand-600 hover:bg-brand-500/10'
                    }`}
                  >
                    {m.label}
                  </button>
                ))}
              </div>

              <button
                onClick={() => setIsCustomModalOpen(true)}
                className="px-3 py-1.5 rounded-xl border border-brand-500/30 text-xs font-bold text-brand-700 dark:text-brand-300 hover:bg-brand-500/15 cursor-pointer transition-all"
                title="Ajustar tempo personalizado"
              >
                ⚙ Duração
              </button>

              {/* Botão de Teste do Alarme Sonoro */}
              <button
                onClick={handleTestSound}
                className={`px-3 py-1.5 rounded-xl border text-xs font-bold flex items-center gap-1.5 transition-all cursor-pointer ${
                  soundTestActive
                    ? 'bg-amber-500 text-white border-amber-500 shadow-md scale-105'
                    : 'border-amber-500/40 text-amber-600 dark:text-amber-400 hover:bg-amber-500/15'
                }`}
                title="Testar o alarme polifônico harmônico (Web Audio API)"
              >
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
                  <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
                </svg>
                <span>{soundTestActive ? 'Tocando...' : 'Testar Alarme'}</span>
              </button>
            </div>

            {/* Mostrador Circular do Relógio */}
            <div className="relative w-60 h-60 sm:w-68 sm:h-68 mx-auto flex items-center justify-center my-2">
              <svg className="w-full h-full -rotate-90" viewBox="0 0 240 240">
                <circle cx="120" cy="120" r="100" stroke="currentColor" strokeWidth="8" className="text-slate-100 dark:text-[#0b132b]" fill="none" />
                <circle
                  cx="120"
                  cy="120"
                  r="100"
                  stroke="#90a14a"
                  strokeWidth="8"
                  strokeDasharray={2 * Math.PI * 100}
                  strokeDashoffset={(2 * Math.PI * 100) * (1 - progressPercent / 100)}
                  strokeLinecap="round"
                  fill="none"
                  className="transition-all duration-300"
                />
              </svg>

              <div className="absolute inset-0 flex flex-col items-center justify-center">
                <span className="text-5xl sm:text-6xl font-black text-slate-800 dark:text-white tracking-tighter font-mono">
                  {formattedTime}
                </span>
                <span className="text-[11px] font-bold uppercase tracking-widest text-brand-600 dark:text-brand-400 mt-2 px-2.5 py-0.5 rounded-full bg-brand-500/10">
                  {status === 'running' ? '● Foco Ativo' : status === 'paused' ? '❚❚ Pausado' : 'Pronto para Iniciar'}
                </span>
              </div>
            </div>

            {/* Vínculo da Disciplina Estudada */}
            <div className="flex items-center justify-center gap-2">
              <span className="text-xs text-slate-500 dark:text-slate-300 font-semibold">Disciplina vinculada:</span>
              <select
                value={selectedSubject}
                onChange={(e) => setSelectedSubject(e.target.value)}
                className="px-3 py-1.5 rounded-xl bg-slate-50 dark:bg-[#0b132b] border border-brand-500/30 text-xs font-bold text-slate-800 dark:text-white focus:outline-none"
              >
                {subjects.map(s => (
                  <option key={s.id} value={s.id}>{s.name} ({s.code || 'ENG'})</option>
                ))}
              </select>
            </div>

            {/* Botões de Ação Principais */}
            <div className="flex items-center justify-center gap-3 pt-2">
              {status !== 'running' ? (
                <button
                  onClick={handleStart}
                  className="px-8 py-3 rounded-2xl bg-brand-500 hover:bg-brand-600 text-white font-black text-sm shadow-lg shadow-brand-500/30 transition-all hover:scale-105 active:scale-95 cursor-pointer flex items-center gap-2"
                >
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <polygon points="5 3 19 12 5 21 5 3"/>
                  </svg>
                  <span>Iniciar Foco</span>
                </button>
              ) : (
                <button
                  onClick={handlePause}
                  className="px-8 py-3 rounded-2xl bg-amber-500 hover:bg-amber-600 text-white font-black text-sm shadow-lg shadow-amber-500/30 transition-all hover:scale-105 active:scale-95 cursor-pointer flex items-center gap-2"
                >
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>
                  </svg>
                  <span>Pausar</span>
                </button>
              )}

              <button
                onClick={handleReset}
                className="p-3 rounded-2xl border border-slate-200 dark:border-brand-500/30 hover:bg-slate-100 dark:hover:bg-[#0b132b] text-slate-600 dark:text-slate-300 transition-all cursor-pointer"
                title="Reiniciar timer"
              >
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
                  <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>
                </svg>
              </button>
            </div>
          </div>

          {/* DASHBOARD DE HORAS LÍQUIDAS & DISTRIBUIÇÃO POR DISCIPLINA */}
          <div className="space-y-6">
            <div className="flex items-center justify-between">
              <div>
                <h3 className="text-base font-bold text-[#111c38] dark:text-[#111c38] flex items-center gap-2">
                  <span className="w-2.5 h-2.5 rounded-full bg-brand-500"></span>
                  Dashboard de Horas Líquidas de Estudo
                </h3>
                <p className="text-xs text-[#111c38]/80 dark:text-[#111c38]">
                  Horas contabilizadas automaticamente ao concluir ciclos de foco, comparadas com as metas semanais.
                </p>
              </div>
            </div>

            {/* Cartões de Indicadores Gerais */}
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
              <div className="glass-card rounded-3xl p-5 border border-brand-500/25 space-y-1">
                <span className="text-[11px] font-bold text-slate-500 dark:text-slate-300 uppercase tracking-wider">
                  Horas Totais Acumuladas
                </span>
                <div className="flex items-baseline gap-2">
                  <span className="text-3xl font-black text-brand-600 dark:text-brand-400 font-mono">
                    {totalHoursStudied}h
                  </span>
