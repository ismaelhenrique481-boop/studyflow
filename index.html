  <script type="text/babel">
    const { useState, useEffect, useCallback, createContext, useContext, useRef, useMemo } = React;

    // =============================================
    // HOOKS UTILITÁRIOS
    // =============================================
    function useLocalStorage(key, initialValue) {
      const [storedValue, setStoredValue] = useState(() => {
        try {
          const item = window.localStorage.getItem(key);
          return item ? JSON.parse(item) : initialValue;
        } catch (error) {
          console.warn(`Erro ao ler LocalStorage [${key}]:`, error);
          return initialValue;
        }
      });

      const setValue = useCallback((value) => {
        try {
          setStoredValue((prev) => {
            const valueToStore = value instanceof Function ? value(prev) : value;
            try {
              window.localStorage.setItem(key, JSON.stringify(valueToStore));
            } catch (err) {
              console.warn(`Erro ao salvar no LocalStorage [${key}]:`, err);
            }
            return valueToStore;
          });
        } catch (error) {
          console.warn(`Erro ao atualizar LocalStorage [${key}]:`, error);
        }
      }, [key]);

      return [storedValue, setValue];
    }

    // =============================================
    // TEMA & CONTEXTO GLOBAL
    // =============================================
    const ThemeContext = createContext(null);

    function ThemeProvider({ children }) {
      const [theme, setTheme] = useLocalStorage('studyflow-theme', 'light');

      useEffect(() => {
        const root = document.documentElement;
        if (theme === 'dark') {
          root.classList.add('dark');
        } else {
          root.classList.remove('dark');
        }
      }, [theme]);

      const toggleTheme = useCallback(() => {
        setTheme(prev => prev === 'dark' ? 'light' : 'dark');
      }, [setTheme]);

      return (
        <ThemeContext.Provider value={{ theme, toggleTheme }}>
          {children}
        </ThemeContext.Provider>
      );
    }

    function useTheme() {
      return useContext(ThemeContext);
    }

    // =============================================
    // CONTEXTO DE AUTENTICAÇÃO FIREBASE
    // =============================================
    const AuthContext = createContext(null);

    function AuthProvider({ children }) {
      const [currentUser, setCurrentUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [authError, setAuthError] = useState(null);

      useEffect(() => {
        let unsubscribe = null;

        function setupListener() {
          if (window.firebaseAuth && window.firebaseAuthMethods) {
            try {
              unsubscribe = window.firebaseAuthMethods.onAuthStateChanged(
                window.firebaseAuth,
                (user) => {
                  setCurrentUser(user);
                  setAuthLoading(false);
                },
                (err) => {
                  console.error('Erro no listener de autenticação Firebase:', err);
                  setAuthLoading(false);
                }
              );
              return true;
            } catch (e) {
              console.warn('Tentando reconectar listener do Firebase...', e);
              return false;
            }
          }
          return false;
        }

        if (!setupListener()) {
          const onReady = () => {
            setupListener();
          };
          window.addEventListener('firebase-ready', onReady);
          const timer = setInterval(() => {
            if (setupListener()) {
              clearInterval(timer);
            }
          }, 150);

          return () => {
            window.removeEventListener('firebase-ready', onReady);
            clearInterval(timer);
            if (unsubscribe) unsubscribe();
          };
        }

        return () => {
          if (unsubscribe) unsubscribe();
        };
      }, []);

      const translateFirebaseError = (error) => {
        const code = error?.code || '';
        switch (code) {
          case 'auth/invalid-email':
            return 'O endereço de e-mail informado é inválido.';
          case 'auth/user-disabled':
            return 'Esta conta de usuário foi desativada pelo administrador.';
          case 'auth/user-not-found':
          case 'auth/wrong-password':
          case 'auth/invalid-credential':
            return 'E-mail ou senha incorretos. Por favor, verifique os dados.';
          case 'auth/email-already-in-use':
            return 'Este e-mail já está cadastrado. Tente entrar na conta.';
          case 'auth/weak-password':
            return 'A senha deve conter no mínimo 6 caracteres.';
          case 'auth/network-request-failed':
            return 'Falha de conexão com a rede. Verifique sua conexão com a internet.';
          case 'auth/too-many-requests':
            return 'Muitas tentativas malsucedidas. Aguarde um momento e tente novamente.';
          default:
            return error?.message || 'Ocorreu um erro ao processar a autenticação.';
        }
      };

      const login = async (email, password) => {
        setAuthError(null);
        if (!window.firebaseAuth || !window.firebaseAuthMethods) {
          throw new Error('O serviço de autenticação ainda está inicializando. Aguarde 1 segundo.');
        }
        try {
          const userCredential = await window.firebaseAuthMethods.signInWithEmailAndPassword(
            window.firebaseAuth,
            email,
            password
          );
          return userCredential.user;
        } catch (err) {
          const msg = translateFirebaseError(err);
          setAuthError(msg);
          throw new Error(msg);
        }
      };

      const register = async (email, password) => {
        setAuthError(null);
        if (!window.firebaseAuth || !window.firebaseAuthMethods) {
          throw new Error('O serviço de autenticação ainda está inicializando. Aguarde 1 segundo.');
        }
        try {
          const userCredential = await window.firebaseAuthMethods.createUserWithEmailAndPassword(
            window.firebaseAuth,
            email,
            password
          );
          return userCredential.user;
        } catch (err) {
          const msg = translateFirebaseError(err);
          setAuthError(msg);
          throw new Error(msg);
        }
      };

      const logout = async () => {
        if (!window.firebaseAuth || !window.firebaseAuthMethods) return;
        try {
          await window.firebaseAuthMethods.signOut(window.firebaseAuth);
        } catch (err) {
          console.error('Erro ao sair da conta:', err);
        }
      };

      return (
        <AuthContext.Provider value={{ currentUser, authLoading, authError, setAuthError, login, register, logout }}>
          {children}
        </AuthContext.Provider>
      );
    }

    function useAuth() {
      return useContext(AuthContext);
    }

    // =============================================
    // SÍNTESE DE ÁUDIO WEB (SEM ARQUIVOS EXTERNOS QUEBRADOS)
    // =============================================
    function playChimeAlert(isSuccess = true) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.connect(gain);
        gain.connect(ctx.destination);

        if (isSuccess) {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now);       // C5
          osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.12); // E5
          osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.25); // G5
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
          osc.start(now);
          osc.stop(now + 0.6);
        } else {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, now);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        }
      } catch (e) {
        console.warn('Áudio não inicializado:', e);
      }
    }

    // =============================================
    // ALARME POLIFÔNICO HARMÔNICO DE POMODORO (WEB AUDIO API)
    // Toca sequência suave de carrilhão harmônico sem dependência de arquivos externos
    // =============================================
    function playPomodoroAlarm() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const start = ctx.currentTime + 0.05;

        // Tríade harmônica com decaimento suave estilo sino/carrilhão
        // C5 (523Hz), E5 (659Hz), G5 (784Hz), C6 (1046Hz)
        const notes = [
          { freq: 523.25, offset: 0.00, dur: 1.2 },
          { freq: 659.25, offset: 0.16, dur: 1.2 },
          { freq: 783.99, offset: 0.32, dur: 1.4 },
          { freq: 1046.50, offset: 0.48, dur: 2.0 },
        ];

        notes.forEach(({ freq, offset, dur }) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, start + offset);

          // Envelope sonoro suave (fade in rápido + decaimento exponencial natural)
          gain.gain.setValueAtTime(0.0001, start + offset);
          gain.gain.exponentialRampToValueAtTime(0.22, start + offset + 0.04);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + offset + dur);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start(start + offset);
          osc.stop(start + offset + dur);
        });
      } catch (e) {
        console.warn('Erro na síntese do alarme Pomodoro:', e);
      }
    }

    // =============================================
    // CÁLCULO DINÂMICO DE PRAZOS RESTRITO AOS PROJETOS
    // =============================================
    function getDueStatus(dueDateStr) {
      if (!dueDateStr) return null;
      const parts = dueDateStr.split('-');
      if (parts.length !== 3) return null;
      const year = parseInt(parts[0], 10);
      const month = parseInt(parts[1], 10) - 1;
      const day = parseInt(parts[2], 10);

      const dueDate = new Date(year, month, day);
      dueDate.setHours(0, 0, 0, 0);

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const diffTime = dueDate.getTime() - today.getTime();
      const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));

      if (diffDays < 0) {
        const abs = Math.abs(diffDays);
        return {
          text: `Atrasado há ${abs} ${abs === 1 ? 'dia' : 'dias'}`,
          badgeClass: 'bg-rose-500/20 text-rose-600 dark:text-rose-400 border border-rose-500/30'
        };
      }
      if (diffDays === 0) {
        return {
          text: 'Vence hoje!',
          badgeClass: 'bg-amber-500/25 text-amber-700 dark:text-amber-300 border border-amber-500/40 font-black animate-pulse'
        };
      }
      if (diffDays === 1) {
        return {
          text: 'Vence amanhã',
          badgeClass: 'bg-amber-500/15 text-amber-700 dark:text-amber-300 border border-amber-500/30 font-bold'
        };
      }
      return {
        text: `Faltam ${diffDays} dias`,
        badgeClass: 'bg-brand-500/15 text-brand-700 dark:text-brand-300 border border-brand-500/30 font-semibold'
      };
    }

    function AppBrandLogo({ className = "h-11 md:h-12" }) {
      const { theme } = useTheme();
      const [imageFailed, setImageFailed] = useState(false);

      const logoSrc = theme === 'dark'
        ? "Imagens Para o Site/Logo StudyFlow - Modo Escuro.png"
        : "Imagens Para o Site/Logo - SyudyFlow VEC.png";

      if (!imageFailed) {
        return (
          <img
            key={theme}
            src={logoSrc}
            alt="StudyFlow — Versão Engenharia Civil"
            className={`${className} object-contain cursor-pointer transition-transform hover:scale-105`}
            onError={() => setImageFailed(true)}
          />
        );
      }

      // Fallback tipográfico vetorial minimalista com o "Study" arqueado sobre o "Flow"
      return (
        <div className="flex items-center gap-2 cursor-pointer select-none">
          <svg viewBox="0 0 160 55" className="h-10 w-auto" fill="currentColor">
            {/* Texto Study arqueado */}
            <path id="curve" d="M 10,25 Q 35,5 60,25" fill="transparent" />
            <text className="text-[12px] font-bold tracking-wider" fill="#90a14a">
              <textPath href="#curve" startOffset="50%" textAnchor="middle">
                study
              </textPath>
            </text>
            {/* Texto Flow grande */}
            <text x="5" y="48" className="text-[34px] font-black tracking-tight" fill={theme === 'dark' ? '#ffffff' : '#3d3d3d'}>
              Flow
            </text>
          </svg>
          <span className="text-[10px] font-bold tracking-widest px-1.5 py-0.5 rounded bg-brand-500/15 text-brand-700 dark:text-brand-300 uppercase">
            VEC
          </span>
        </div>
      );
    }

    // =============================================
    // TELA DE AUTENTICAÇÃO (LOGIN / REGISTRO COM FIREBASE)
    // =============================================
    function AuthScreen() {
      const { login, register, authError, setAuthError } = useAuth();
      const { theme, toggleTheme } = useTheme();

      const [isLoginMode, setIsLoginMode] = useState(true);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [confirmPassword, setConfirmPassword] = useState('');
      const [showPassword, setShowPassword] = useState(false);
      const [isLoading, setIsLoading] = useState(false);
      const [localError, setLocalError] = useState('');

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLocalError('');
        setAuthError(null);

        if (!email.trim() || !password) {
          setLocalError('Por favor, preencha todos os campos obrigatórios.');
          return;
        }

        if (!isLoginMode && password !== confirmPassword) {
          setLocalError('As senhas digitadas não coincidem.');
          return;
        }

        if (!isLoginMode && password.length < 6) {
          setLocalError('A senha precisa ter no mínimo 6 caracteres.');
          return;
        }

        setIsLoading(true);
        try {
          if (isLoginMode) {
            await login(email.trim(), password);
          } else {
            await register(email.trim(), password);
          }
        } catch (err) {
          // O erro já foi traduzido e atribuído no contexto
          setLocalError(err.message || 'Erro ao processar autenticação.');
        } finally {
          setIsLoading(false);
        }
      };

      const displayedError = localError || authError;

      return (
        <div className="min-h-screen flex flex-col justify-center items-center px-4 py-12 relative overflow-hidden bg-civil-overlay-light dark:bg-civil-overlay-dark transition-colors duration-200">
          {/* Botão de Tema no Canto Superior */}
          <div className="absolute top-6 right-6 z-20">
            <button
              onClick={toggleTheme}
              title={theme === 'dark' ? 'Alternar para Modo Claro' : 'Alternar para Modo Escuro'}
              className="w-11 h-11 rounded-2xl flex items-center justify-center border border-brand-500/20 bg-white/80 dark:bg-zinc-800/80 backdrop-blur-md shadow-md text-slate-700 dark:text-slate-200 hover:bg-brand-500/10 transition-all cursor-pointer"
            >
              {theme === 'dark' ? (
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#eab308" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                </svg>
              ) : (
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3d3d3d" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
              )}
            </button>
          </div>

          <div className="w-full max-w-md animate-scale-in z-10">
            {/* Card Principal de Autenticação */}
            <div className="glass-card rounded-4xl p-8 sm:p-10 border border-brand-500/25 shadow-2xl relative">
              {/* Cabeçalho do Card com Logo */}
              <div className="flex flex-col items-center text-center mb-8">
                <div className="mb-4">
                  <AppBrandLogo className="h-12 md:h-14" />
                </div>
                <h1 className="text-xl sm:text-2xl font-black text-[#111c38] dark:text-slate-100 tracking-tight">
                  {isLoginMode ? 'Acessar Plataforma' : 'Criar Nova Conta'}
                </h1>
                <p className="text-xs sm:text-sm text-[#111c38]/80 dark:text-slate-300 mt-1">
                  Gestão acadêmica e cálculo preditivo para Engenharia Civil
                </p>
              </div>

              {/* Seletor de Modo: Entrar vs Cadastrar */}
              <div className="grid grid-cols-2 p-1.5 mb-6 rounded-2xl bg-slate-100 dark:bg-zinc-800/80 border border-slate-200 dark:border-zinc-700/60">
                <button
                  type="button"
                  onClick={() => {
                    setIsLoginMode(true);
                    setLocalError('');
                    setAuthError(null);
                  }}
                  className={`py-2.5 text-xs sm:text-sm font-bold rounded-xl transition-all duration-200 cursor-pointer ${
                    isLoginMode
                      ? 'bg-brand-500 text-white shadow-md shadow-brand-500/25'
                      : 'text-slate-600 dark:text-slate-400 hover:text-darkSlate dark:hover:text-white'
                  }`}
                >
                  Entrar
                </button>
                <button
                  type="button"
                  onClick={() => {
                    setIsLoginMode(false);
                    setLocalError('');
                    setAuthError(null);
                  }}
                  className={`py-2.5 text-xs sm:text-sm font-bold rounded-xl transition-all duration-200 cursor-pointer ${
                    !isLoginMode
                      ? 'bg-brand-500 text-white shadow-md shadow-brand-500/25'
                      : 'text-slate-600 dark:text-slate-400 hover:text-darkSlate dark:hover:text-white'
                  }`}
                >
                  Criar Conta
                </button>
              </div>

              {/* Mensagem de Erro (se houver) */}
              {displayedError && (
                <div className="mb-6 p-3.5 rounded-2xl bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-900/50 text-red-700 dark:text-red-300 text-xs flex items-start gap-2.5 animate-fade-in">
                  <svg className="w-5 h-5 shrink-0 text-red-500 mt-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
                  </svg>
                  <span className="leading-relaxed font-medium">{displayedError}</span>
                </div>
              )}

              {/* Formulário */}
              <form onSubmit={handleSubmit} className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-darkSlate dark:text-slate-200 mb-1.5">
                    E-mail Acadêmico / Pessoal
                  </label>
                  <div className="relative">
                    <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                        <polyline points="22,6 12,13 2,6"/>
                      </svg>
                    </div>
                    <input
                      type="email"
                      required
                      value={email}
                      onChange={(e) => setEmail(e.target.value)}
                      placeholder="estudante@universidade.br"
                      disabled={isLoading}
                      className="w-full pl-10 pr-4 py-3 rounded-2xl bg-slate-50 dark:bg-zinc-800/90 border border-slate-200 dark:border-zinc-700 text-xs sm:text-sm text-darkSlate dark:text-white focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 transition-all"
                    />
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-bold text-darkSlate dark:text-slate-200 mb-1.5">
                    Senha
                  </label>
                  <div className="relative">
                    <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                      </svg>
                    </div>
                    <input
                      type={showPassword ? 'text' : 'password'}
                      required
                      value={password}
                      onChange={(e) => setPassword(e.target.value)}
                      placeholder="••••••••"
                      disabled={isLoading}
                      className="w-full pl-10 pr-11 py-3 rounded-2xl bg-slate-50 dark:bg-zinc-800/90 border border-slate-200 dark:border-zinc-700 text-xs sm:text-sm text-darkSlate dark:text-white focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 transition-all"
                    />
                    <button
                      type="button"
                      onClick={() => setShowPassword(!showPassword)}
                      className="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-darkSlate dark:hover:text-white cursor-pointer"
                    >
                      {showPassword ? (
                        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                          <line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                      ) : (
                        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                          <circle cx="12" cy="12" r="3"/>
                        </svg>
                      )}
                    </button>
                  </div>
                </div>

                {!isLoginMode && (
                  <div className="animate-fade-in">
                    <label className="block text-xs font-bold text-darkSlate dark:text-slate-200 mb-1.5">
                      Confirmar Senha
                    </label>
                    <div className="relative">
                      <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                      </div>
                      <input
                        type={showPassword ? 'text' : 'password'}
                        required
                        value={confirmPassword}
                        onChange={(e) => setConfirmPassword(e.target.value)}
                        placeholder="••••••••"
                        disabled={isLoading}
                        className="w-full pl-10 pr-4 py-3 rounded-2xl bg-slate-50 dark:bg-zinc-800/90 border border-slate-200 dark:border-zinc-700 text-xs sm:text-sm text-darkSlate dark:text-white focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 transition-all"
                      />
                    </div>
                  </div>
                )}

                <button
                  type="submit"
                  disabled={isLoading}
                  className="w-full mt-2 py-3.5 px-4 rounded-2xl bg-brand-500 hover:bg-brand-600 text-white font-bold text-sm shadow-lg shadow-brand-500/30 hover:shadow-brand-500/40 hover:scale-[1.01] active:scale-[0.99] transition-all flex items-center justify-center gap-2 cursor-pointer disabled:opacity-60 disabled:cursor-not-allowed"
                >
                  {isLoading ? (
                    <>
                      <svg className="animate-spin h-5 w-5 text-white" viewBox="0 0 24 24" fill="none">
                        <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                        <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                      </svg>
                      <span>Processando...</span>
                    </>
                  ) : (
                    <span>{isLoginMode ? 'Entrar no StudyFlow' : 'Cadastrar e Começar'}</span>
                  )}
                </button>
              </form>

              {/* Informação de Segurança / Nuvem */}
              <div className="mt-6 pt-5 border-t border-slate-100 dark:border-zinc-800 text-center flex items-center justify-center gap-2 text-xs text-slate-500 dark:text-slate-400">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#90a14a" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
                <span>Autenticação e Cloud Firestore integrados</span>
              </div>
            </div>
          </div>
        </div>
      );

    // =============================================
    // MODAL BASE
    // =============================================
    function Modal({ isOpen, onClose, title, children, maxWidth = "max-w-md" }) {
      useEffect(() => {
        if (isOpen) {
          document.body.style.overflow = 'hidden';
        } else {
          document.body.style.overflow = '';
        }
        return () => { document.body.style.overflow = ''; };
      }, [isOpen]);

      if (!isOpen) return null;

      return (
        <div
          className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-black/60 backdrop-blur-sm animate-fade-in"
          onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}
        >
          <div className={`bg-white dark:bg-zinc-900 border border-brand-500/20 rounded-t-[2.25rem] sm:rounded-3xl shadow-2xl w-full ${maxWidth} max-h-[92vh] sm:max-h-[85vh] flex flex-col overflow-hidden animate-slide-up sm:animate-scale-in`}>
            {/* Drag Handle Visual para Smartphones */}
            <div className="sm:hidden pt-3 pb-1 flex justify-center shrink-0">
              <div className="w-12 h-1.5 bg-slate-300 dark:bg-slate-600 rounded-full"></div>
            </div>

            <div className="flex items-center justify-between px-5 sm:px-6 py-3.5 sm:py-4 border-b border-slate-100 dark:border-zinc-800 bg-slate-50/70 dark:bg-zinc-900/70 shrink-0">
              <h3 className="text-base font-bold text-[#111c38] dark:text-slate-100 flex items-center gap-2">
                <span className="w-2.5 h-2.5 rounded-full bg-brand-500 inline-block"></span>
                {title}
              </h3>
              <button
                onClick={onClose}
                className="w-11 h-11 rounded-full flex items-center justify-center text-slate-400 hover:text-darkSlate dark:hover:text-white hover:bg-slate-100 dark:hover:bg-zinc-800 transition-colors cursor-pointer shrink-0"
                aria-label="Fechar modal"
              >
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                  <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
              </button>
            </div>
            <div className="p-5 sm:p-6 overflow-y-auto flex-1 touch-scroll pb-safe">
              {children}
            </div>
          </div>
        </div>
      );
    }

    // =============================================
    // MODAL DE CONFIRMAÇÃO DE RESET
    // =============================================
    function ResetConfirmModal({ isOpen, onClose, onConfirm }) {
      if (!isOpen) return null;

      return (
        <Modal isOpen={isOpen} onClose={onClose} title="Zerar Dados do Aplicativo" maxWidth="max-w-sm">

    // =============================================
    // MODAL DE PRÉ-VISUALIZAÇÃO DE ARQUIVOS EM TELA CHEIA (PDF & IMAGENS)
    // =============================================
    function FilePreviewModal({ file, isOpen, onClose, subjects = [] }) {
      const [blobUrl, setBlobUrl] = useState(null);
      const [loading, setLoading] = useState(true);
      const [errorMsg, setErrorMsg] = useState(null);

      // Suporte à tecla ESC para fechar
      useEffect(() => {
        if (!isOpen) return;
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') onClose();
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [isOpen, onClose]);

      // Bloqueio do scroll do body
      useEffect(() => {
        if (isOpen) {
          document.body.style.overflow = 'hidden';
        } else {
          document.body.style.overflow = '';
        }
        return () => { document.body.style.overflow = ''; };
      }, [isOpen]);

      // Geração do Blob e ObjectURL seguro a partir do IndexedDB
      useEffect(() => {
        if (!isOpen || !file) {
          setBlobUrl(null);
          return;
        }

        let currentUrl = null;
        let isMounted = true;
        setLoading(true);
        setErrorMsg(null);

        async function prepareBlob() {
          try {
            let blob = null;
            if (file.blob instanceof Blob) {
              blob = file.blob;
            } else if (typeof file.data === 'string') {
              if (file.data.startsWith('data:')) {
                const res = await fetch(file.data);
                blob = await res.blob();
              } else {
                blob = new Blob([file.data], { type: file.type || 'application/octet-stream' });
              }
            }

            if (!blob) {
              throw new Error('Formato de arquivo inválido para visualização.');
            }

            let effectiveMime = file.type || blob.type;
            if (file.name.toLowerCase().endsWith('.pdf') && (!effectiveMime || !effectiveMime.includes('pdf'))) {
              blob = new Blob([blob], { type: 'application/pdf' });
            }

            if (isMounted) {
              currentUrl = URL.createObjectURL(blob);
              setBlobUrl(currentUrl);
            }
          } catch (err) {
            console.error('Erro ao preparar visualização do arquivo:', err);
            if (isMounted) setErrorMsg('Não foi possível carregar o arquivo para visualização.');
          } finally {
            if (isMounted) setLoading(false);
          }
        }

        prepareBlob();

        return () => {
          isMounted = false;
          if (currentUrl) {
            URL.revokeObjectURL(currentUrl);
          }
        };
      }, [isOpen, file]);

      if (!isOpen || !file) return null;

      const isPdf = file.name?.toLowerCase().endsWith('.pdf') || (file.type && file.type.includes('pdf'));
      const isImage = /\.(png|jpe?g|gif|webp|svg|bmp)$/i.test(file.name || '') || (file.type && file.type.startsWith('image/'));
      const linkedSubj = subjects.find(s => s.id === file.subjectId);
      const formattedSize = file.size > 1024 * 1024
        ? `${(file.size / (1024 * 1024)).toFixed(1)} MB`
        : `${Math.round(file.size / 1024)} KB`;

      return (
        <div
          className="fixed inset-0 z-50 flex items-center justify-center p-2 sm:p-4 md:p-6 bg-black/85 backdrop-blur-md animate-fade-in"
          onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}
        >
          <div className="relative w-full h-[94vh] max-w-6xl bg-white dark:bg-zinc-900 border border-brand-500/30 rounded-3xl shadow-2xl flex flex-col overflow-hidden animate-scale-in">
            {/* Barra Superior / Header */}
            <div className="flex items-center justify-between px-5 py-3.5 border-b border-slate-200 dark:border-zinc-800 bg-slate-50/90 dark:bg-zinc-900/90 shrink-0">
              <div className="flex items-center gap-3 overflow-hidden">
                <span className="text-xl shrink-0">{isPdf ? '📕' : isImage ? '🖼️' : '📄'}</span>
                <div className="truncate">
                  <h3 className="text-sm font-bold text-[#111c38] dark:text-slate-100 truncate" title={file.name}>
                    {file.name}
                  </h3>
                  <div className="flex items-center gap-2 text-[11px] text-slate-500 dark:text-slate-400">
                    <span>{formattedSize}</span>
                    <span>•</span>
                    <span className="font-semibold text-brand-600 dark:text-brand-400">
                      {linkedSubj ? linkedSubj.name : 'Geral / Normas'}
                    </span>
                    <span>•</span>
                    <span>{isPdf ? 'Documento PDF' : isImage ? 'Imagem' : 'Arquivo'}</span>
                  </div>
                </div>
              </div>

              {/* Botões de Ação */}
              <div className="flex items-center gap-2 shrink-0">
                {file.data && (
                  <a
                    href={file.data}
                    download={file.name}
                    className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-brand-500/15 hover:bg-brand-500 text-brand-700 hover:text-white dark:text-brand-300 font-bold text-xs transition-colors cursor-pointer"
                    title="Baixar arquivo no dispositivo"
                  >
                    <span>⬇ Baixar</span>
                  </a>
                )}
                <button
                  type="button"
                  onClick={onClose}
                  className="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-zinc-800 dark:hover:bg-zinc-700 text-slate-700 dark:text-slate-200 text-xs font-bold transition-colors flex items-center gap-1 cursor-pointer"
                  title="Fechar visualizador (ESC)"
                >
                  <span>✕ Fechar</span>
                  <span className="text-[10px] text-slate-400 font-mono ml-0.5">ESC</span>
                </button>
              </div>
            </div>

            {/* Conteúdo da Pré-visualização */}
            <div className="flex-1 w-full h-full p-2 sm:p-4 bg-slate-100 dark:bg-zinc-950 overflow-hidden flex items-center justify-center relative">
              {loading && (
                <div className="flex flex-col items-center gap-3 text-slate-500 dark:text-slate-400">
                  <div className="w-8 h-8 border-3 border-brand-500 border-t-transparent rounded-full animate-spin"></div>
                  <span className="text-xs font-semibold">Carregando arquivo do IndexedDB...</span>
                </div>
              )}

              {errorMsg && (
                <div className="text-center p-6 space-y-3">
                  <div className="text-3xl">⚠️</div>
                  <p className="text-sm font-semibold text-red-500">{errorMsg}</p>
                  <button
                    type="button"
                    onClick={onClose}
                    className="px-4 py-2 rounded-xl bg-slate-200 dark:bg-zinc-800 text-xs font-bold"
                  >
                    Voltar
                  </button>
                </div>
              )}

              {!loading && !errorMsg && blobUrl && (
                isPdf ? (
                  <iframe
                    src={blobUrl}
                    title={file.name}
                    className="w-full h-full rounded-2xl border-0 bg-white shadow-inner"
                  />
                ) : isImage ? (
                  <div className="w-full h-full flex items-center justify-center p-2 overflow-auto">
                    <img
                      src={blobUrl}
                      alt={file.name}
                      className="max-w-full max-h-full object-contain rounded-2xl shadow-xl border border-slate-200 dark:border-zinc-800"
                    />
                  </div>
                ) : (
                  <div className="text-center p-6 space-y-2">
                    <div className="text-3xl">📄</div>
                    <p className="text-sm font-semibold text-darkSlate dark:text-white">
                      Este tipo de arquivo não suporta pré-visualização direta.
                    </p>
                    <p className="text-xs text-slate-500 dark:text-slate-400">
                      Utilize o botão de download para abri-lo no seu leitor de preferência.
                    </p>
                  </div>
                )
              )}
            </div>
          </div>
        </div>
      );
    }

    // =============================================

    // =============================================
    function openStudyFlowDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('StudyFlowFilesDB', 2);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('files')) {
            const store = db.createObjectStore('files', { keyPath: 'id' });
            store.createIndex('subjectId', 'subjectId', { unique: false });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    function useIndexedDBFiles() {
      const [filesList, setFilesList] = useState([]);

      const loadFiles = useCallback(async () => {
        try {
          const db = await openStudyFlowDB();
          const tx = db.transaction('files', 'readonly');
          const store = tx.objectStore('files');
          const req = store.getAll();
          req.onsuccess = async () => {
            const current = req.result || [];
            if (current.length === 0) {
              try {
                const seedTx = db.transaction('files', 'readwrite');
                const seedStore = seedTx.objectStore('files');
                SAMPLE_INITIAL_FILES.forEach(f => seedStore.add(f));
                seedTx.oncomplete = () => setFilesList(SAMPLE_INITIAL_FILES);
              } catch (seedErr) {
                setFilesList([]);
              }
            } else {
              setFilesList(current);
            }
          };
        } catch (e) {
          console.warn('Erro ao carregar arquivos IndexedDB:', e);
        }
      }, []);

      useEffect(() => { loadFiles(); }, [loadFiles]);

      const uploadFile = useCallback(async (fileObj, subjectId = '') => {
        const db = await openStudyFlowDB();
        const reader = new FileReader();
        return new Promise((resolve, reject) => {
          reader.onload = () => {
            const tx = db.transaction('files', 'readwrite');
            const store = tx.objectStore('files');
            const item = {
              id: `file-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
              name: fileObj.name,
              size: fileObj.size,
              type: fileObj.type,
              lastModified: fileObj.lastModified,
              subjectId: subjectId || 'general',
              data: reader.result,
            };
            store.add(item);
            tx.oncomplete = () => {
              loadFiles();
              resolve(item);
            };
            tx.onerror = () => reject(tx.error);
          };
          reader.readAsDataURL(fileObj);
        });
      }, [loadFiles]);

      const deleteFile = useCallback(async (id) => {
        const db = await openStudyFlowDB();
        const tx = db.transaction('files', 'readwrite');
        tx.objectStore('files').delete(id);
        tx.oncomplete = () => loadFiles();
      }, [loadFiles]);

      const clearAllFiles = useCallback(async () => {
        const db = await openStudyFlowDB();
        const tx = db.transaction('files', 'readwrite');
        tx.objectStore('files').clear();
        tx.oncomplete = () => loadFiles();
      }, [loadFiles]);

      return { filesList, uploadFile, deleteFile, clearAllFiles, reload: loadFiles };
    }

                    title="Terminar sessão"
                    className="h-9 px-2.5 sm:h-10 sm:px-3 rounded-2xl flex items-center gap-1 border border-slate-200 dark:border-zinc-700 bg-white/70 dark:bg-zinc-800/70 text-slate-700 dark:text-slate-200 hover:text-red-600 dark:hover:text-red-400 hover:bg-red-50 dark:hover:bg-red-950/30 transition-all text-xs font-bold cursor-pointer shrink-0"
                  >
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                      <polyline points="16 17 21 12 16 7"/>
                      <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                    <span className="hidden md:inline">Sair</span>
                  </button>
                </div>
              )}
            </div>
          </div>
        </header>
      );
    }

    // =============================================
    // BARRA DE NAVEGAÇÃO INFERIOR (BOTTOM NAV BAR) PARA CELULAR
    // Experiência nativa responsiva para Smartphones (md:hidden)
    // =============================================
    function BottomNavBar({ activeNav, onNavChange }) {
      function renderNavIcon(id, isActive) {
        const strokeWidth = isActive ? "2.5" : "2";
        switch (id) {
          case 'home':
            return (
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round">
                <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
              </svg>
            );
          case 'ira':
            return (
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round">
                <rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="16" y1="14" x2="16" y2="18"/>
                <path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/>
              </svg>
            );
          case 'tasks':
            return (
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round">
                <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
              </svg>
            );
          case 'pomodoro':
            return (
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
              </svg>
            );
          case 'schedule':
            return (
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
              </svg>
            );
          case 'study':
            return (
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round">
                <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/>
              </svg>
            );
          default:
            return null;
        }
      }

      return (
        <nav
          aria-label="Navegação móvel inferior"
          className="fixed bottom-0 left-0 right-0 z-50 md:hidden glass-nav border-t border-brand-500/25 shadow-2xl backdrop-blur-xl bg-white/95 dark:bg-[#0b132b]/95 pb-safe"
        >
          <div className="grid grid-cols-6 items-center px-1 pt-1.5 pb-1">
            {NAV_ITEMS.map((item) => {
              const isActive = activeNav === item.id;
              return (
                <button
                  key={item.id}
                  id={`bottom-nav-${item.id}`}
                  onClick={() => onNavChange(item.id)}
                  className={`flex flex-col items-center justify-center py-1 px-0.5 rounded-xl transition-all duration-150 cursor-pointer min-h-[48px] active:scale-95 ${
                    isActive
                      ? 'text-brand-600 dark:text-brand-400 font-bold'
                      : 'text-slate-500 dark:text-slate-400 hover:text-brand-600 dark:hover:text-brand-400'
                  }`}
                >
                  <div className={`p-1 rounded-xl transition-colors ${isActive ? 'bg-brand-500/15' : ''}`}>
                    {renderNavIcon(item.id, isActive)}
                  </div>
                  <span className="text-[10px] leading-none mt-1 tracking-tight truncate max-w-full">
                    {item.label}
                  </span>
                  {isActive && (
                    <span className="w-1 h-1 rounded-full bg-brand-500 mt-1"></span>
                  )}
                </button>
              );
            })}
          </div>
        </nav>
      );
    }

    // =============================================
    // TELA 1: INÍCIO (DASHBOARD EXECUTIVO & HERO DA PONTE)
    // =============================================
    function HomePage({ iraRecords, setIraRecords, onNavigate, onOpenAddDiscipline }) {
      const [globalSearch, setGlobalSearch] = useState('');
      const [bridgeFailed, setBridgeFailed] = useState(false);

      // Cálculos Matemáticos Oficiais do IRA
      const totalPoints = iraRecords.reduce((acc, r) => acc + (Number(r.semesterWeight || 1) * Number(r.hours || 0) * Number(r.grade || 0)), 0);
      const totalDivisor = iraRecords.reduce((acc, r) => acc + (Number(r.semesterWeight || 1) * Number(r.hours || 0)), 0);
      const totalHours = iraRecords.reduce((acc, r) => acc + Number(r.hours || 0), 0);
      const overallIra = totalDivisor > 0 ? (totalPoints / totalDivisor) : 8.19;

      // Semestres agrupados
      const semestersList = Array.from(new Set(iraRecords.map(r => r.semester))).sort().reverse();
      const currentSemesterName = semestersList[0] || '2025.1';

      // Filtro da busca global
      const filteredRecords = useMemo(() => {
        if (!globalSearch.trim()) return iraRecords;
        const query = globalSearch.toLowerCase();
        return iraRecords.filter(r =>
          r.subjectName.toLowerCase().includes(query) ||
          r.semester.toLowerCase().includes(query) ||
          (r.status && r.status.toLowerCase().includes(query))
        );
      }, [iraRecords, globalSearch]);

      return (
        <div className="space-y-8 animate-fade-in">
          {/* HERO SECTION ENGENHARIA CIVIL */}
          <section className="relative overflow-hidden rounded-4xl glass-card p-6 sm:p-10 border border-brand-500/25">
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">
              {/* Lado Esquerdo: Tipografia Institucional */}
              <div className="lg:col-span-7 space-y-4">
                <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-brand-500/15 border border-brand-500/30 text-brand-700 dark:text-brand-300 text-xs font-bold tracking-wide uppercase">
                  <span>✦ StudyFlow VEC</span>
                  <span className="w-1.5 h-1.5 rounded-full bg-brand-500"></span>
                  <span>Gestão Acadêmica de Alto Desempenho</span>
                </div>

                <div>
                  <h2 className="text-xl sm:text-2xl font-light text-[#111c38]/70 dark:text-slate-300 tracking-wider">
                    Versão
                  </h2>
                  <h1 className="text-4xl sm:text-5xl lg:text-6xl font-black text-[#111c38] dark:text-slate-100 tracking-tight leading-none mt-1">
                    Engenharia Civil
                  </h1>
                </div>

                <p className="text-sm sm:text-base text-[#111c38]/80 dark:text-slate-300 max-w-xl leading-relaxed">
                  Ambiente integrado para dimensionamento de estudos, controle preditivo de rendimento acadêmico (IRA), gestão estrutural de cronogramas e entregas técnicas.
                </p>

                <div className="flex flex-wrap items-center gap-3 pt-2">
                  <button
                    onClick={() => onNavigate('ira')}
                    className="px-5 py-3 rounded-2xl bg-brand-500 hover:bg-brand-600 text-white text-sm font-bold shadow-lg shadow-brand-500/30 transition-all hover:scale-[1.02] active:scale-[0.98] cursor-pointer"
                  >
                    Simulador Preditivo de IRA →
                  </button>
                  <button
                    onClick={() => onNavigate('schedule')}
                    className="px-5 py-3 rounded-2xl border border-brand-500/30 bg-white/60 dark:bg-zinc-800/60 hover:bg-brand-500/10 text-darkSlate dark:text-slate-200 text-sm font-semibold transition-all cursor-pointer"
                  >
                    Ver Cronograma Semanal
                  </button>
                </div>
              </div>

              {/* Lado Direito: A Ponte Estrutural */}
              <div className="lg:col-span-5 flex justify-center lg:justify-end relative">
                {!bridgeFailed ? (
                  <div className="relative group">
                    <img
                      src="Imagens Para o Site/Ponte no inicio - SyudyFlow VEC.png"
                      alt="Ponte Estrutural Engenharia Civil"
                      className="max-h-72 sm:max-h-80 w-auto object-contain bridge-hero-img select-none pointer-events-none"
                      onError={() => setBridgeFailed(true)}
                    />
                    <div className="absolute -bottom-2 -right-2 bg-white/85 dark:bg-zinc-900/85 backdrop-blur-md px-3.5 py-1.5 rounded-xl border border-brand-500/30 text-[11px] font-semibold text-slate-700 dark:text-slate-200 shadow-md">
                      Ponte Treliçada em Aço
                    </div>
                  </div>
                ) : (
                  <div className="w-64 h-64 rounded-3xl bg-brand-500/10 border-2 border-dashed border-brand-500/30 flex flex-col items-center justify-center p-6 text-center text-brand-600 dark:text-brand-400">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5">
                      <path d="M3 20h18"/><path d="M5 20V8l7-5 7 5v12"/>
                    </svg>
                    <span className="text-xs font-bold mt-2">Versão Engenharia Civil</span>
                  </div>
                )}
              </div>
            </div>
          </section>

          {/* CARTÕES DE MÉTRICAS PRINCIPAIS (ROUNDED-3XL) */}
          <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
            {/* Card 1: IRA Atual */}
            <div className="glass-card rounded-3xl p-6 relative overflow-hidden card-hover border-t-4 border-t-brand-500">
              <div className="flex items-center justify-between mb-3">
                <span className="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-300">
                  IRA Geral Atual
                </span>
                <span className="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-brand-500/15 text-brand-700 dark:text-brand-300">
                  Excelente
                </span>
              </div>
              <div className="flex items-baseline gap-2">
                <span className="text-4xl sm:text-5xl font-black text-slate-800 dark:text-white tracking-tight">
                  {overallIra.toFixed(2)}
                </span>
                <span className="text-sm font-semibold text-slate-400 dark:text-slate-300">/ 10.00</span>
              </div>
              <p className="text-xs text-slate-500 dark:text-slate-300 mt-2">
                Calculado com base em {iraRecords.length} disciplinas concluídas e ponderadas.
              </p>
              <div className="flex items-center gap-2 mt-4 pt-3 border-t border-slate-100 dark:border-brand-500/20">
                <button
                  onClick={onOpenAddDiscipline}
                  className="text-xs font-bold text-brand-600 dark:text-brand-400 hover:text-brand-700 flex items-center gap-1 cursor-pointer"
                >
                  <span>+ Adicionar Disciplina</span>
                </button>
                <span className="text-slate-300 dark:text-slate-600">·</span>
                <button
                  onClick={() => onNavigate('ira')}
                  className="text-xs font-semibold text-slate-500 dark:text-slate-400 hover:text-brand-500 cursor-pointer"
                >
                  Simular Notas
                </button>
              </div>
            </div>

            {/* Card 2: Horas Integralizadas */}
            <div className="glass-card rounded-3xl p-6 relative overflow-hidden card-hover border-t-4 border-t-brand-500">
              <div className="flex items-center justify-between mb-3">
                <span className="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-300">
                  Horas Integralizadas
                </span>
                <span className="text-[11px] font-bold text-brand-600 dark:text-brand-400">
                  {Math.min(100, Math.round((totalHours / 3600) * 100))}% do Curso
                </span>
              </div>
              <div className="flex items-baseline gap-2">
                <span className="text-4xl sm:text-5xl font-black text-slate-800 dark:text-white tracking-tight">
                  {totalHours}h
                </span>
                <span className="text-sm font-semibold text-slate-400 dark:text-slate-300">/ 3.600h</span>
              </div>
              {/* Barra de Progresso */}
              <div className="w-full h-2 bg-slate-100 dark:bg-[#0b132b] rounded-full mt-3 overflow-hidden">
                <div
                  className="h-full bg-brand-500 rounded-full transition-all duration-500"
                  style={{ width: `${Math.min(100, (totalHours / 3600) * 100)}%` }}
                />
              </div>
              <p className="text-xs text-slate-500 dark:text-slate-300 mt-2.5">
                Carga horária total acumulada aprovada no histórico do estudante.
              </p>
            </div>

            {/* Card 3: Semestre Atual */}
            <div className="glass-card rounded-3xl p-6 relative overflow-hidden card-hover border-t-4 border-t-brand-500">
              <div className="flex items-center justify-between mb-3">
                <span className="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-300">
                  Semestre Atual
                </span>
                <span className="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-emerald-500/15 text-emerald-600 dark:text-emerald-400">
                  4º Semestre (Em Curso)
                </span>
              </div>
              <div className="flex items-baseline gap-2">
                <span className="text-4xl sm:text-5xl font-black text-slate-800 dark:text-white tracking-tight">
                  2026.2
                </span>
                <span className="text-xs font-bold text-brand-600 dark:text-brand-400">4º Período</span>
              </div>
              <p className="text-xs text-slate-500 dark:text-slate-300 mt-2">
                Período letivo vigente (4º Semestre) com acompanhamento corrente e simulações de rendimento.
              </p>
              <div className="flex items-center gap-2 mt-4 pt-3 border-t border-slate-100 dark:border-brand-500/20">
                <button
                  onClick={() => onNavigate('tasks')}
                  className="text-xs font-bold text-brand-600 dark:text-brand-400 hover:text-brand-700 flex items-center gap-1 cursor-pointer"
                >
                  <span>Ver Entregas do 4º Semestre →</span>
                </button>
              </div>
            </div>
          </div>

          {/* BANNER DE INFORMAÇÃO E CONSOLIDAÇÃO DO HISTÓRICO */}
          <div className="p-5 rounded-3xl glass-card border border-brand-500/30 flex items-start gap-4 shadow-sm">
            <span className="p-2.5 rounded-2xl bg-brand-500 text-white text-base font-bold shadow-md shadow-brand-500/30 flex-shrink-0">
              ℹ
            </span>
            <div className="space-y-1">
              <h4 className="text-xs font-black uppercase tracking-wider text-[#111c38] dark:text-slate-100">
                Status de Consolidação Acadêmica — Engenharia Civil (VEC)
              </h4>
              <p className="text-xs text-[#111c38]/80 dark:text-slate-300 leading-relaxed">
                Os dados reais consolidados no histórico oficial compreendem até o <strong className="text-slate-800 dark:text-white">3º Semestre (2026.1)</strong>. O <strong className="text-brand-600 dark:text-brand-400">4º Semestre (2026.2)</strong> é o período letivo vigente, composto por simulações preditivas e dados correntes de rendimento.
              </p>
            </div>
          </div>

          {/* BARRA DE BUSCA GLOBAL RÁPIDA */}
          <div className="relative">
            <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 dark:text-slate-300">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
              </svg>
            </div>
            <input
              type="text"
              id="global-search-input"
              value={globalSearch}
              onChange={(e) => setGlobalSearch(e.target.value)}
              placeholder="Barra de busca para disciplinas, matérias e semestres..."
              className="w-full pl-12 pr-4 py-4 rounded-3xl bg-white/90 dark:bg-[#0b132b] border border-brand-500/25 shadow-sm text-sm text-slate-800 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500/40 focus:border-brand-500 transition-all"
            />
            {globalSearch && (
              <button
                onClick={() => setGlobalSearch('')}
                className="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"
              >
                ✕
              </button>
            )}
          </div>

          {/* LISTAGEM DE SEMESTRES E DISCIPLINAS (DESIGN CONFORME O FLUXO INICIAL) */}
          <div className="space-y-6">
            <div className="flex items-center justify-between">
              <h3 className="text-xl font-bold text-[#111c38] dark:text-[#111c38] flex items-center gap-2">
                <span className="w-3 h-3 rounded-full bg-brand-500"></span>
                Grade e Histórico Acadêmico por Semestre
              </h3>
              <button
                onClick={onOpenAddDiscipline}
                className="px-4 py-2 rounded-2xl bg-brand-500 hover:bg-brand-600 text-white text-xs font-bold shadow-md shadow-brand-500/25 transition-all flex items-center gap-1.5 cursor-pointer"
              >
                <span>Adicionar Disciplina +</span>
              </button>
            </div>

            {semestersList.map((sem) => {
              const semDisciplines = filteredRecords.filter(r => r.semester === sem);
              if (semDisciplines.length === 0) return null;

              const semHours = semDisciplines.reduce((a, b) => a + Number(b.hours || 0), 0);
              const semPoints = semDisciplines.reduce((a, b) => a + (Number(b.semesterWeight || 1) * Number(b.hours || 0) * Number(b.grade || 0)), 0);
              const semDivisor = semDisciplines.reduce((a, b) => a + (Number(b.semesterWeight || 1) * Number(b.hours || 0)), 0);
              const semIra = semDivisor > 0 ? (semPoints / semDivisor) : 0;

              return (
                <div key={sem} className="glass-card rounded-3xl overflow-hidden border border-brand-500/20">
                  {/* Cabeçalho do Semestre */}
                  <div className="px-6 py-4 bg-brand-500/10 dark:bg-[#162347] border-b border-brand-500/20 flex flex-wrap items-center justify-between gap-3">
                    <div className="flex items-center gap-3">
                      <span className="px-3 py-1 rounded-xl bg-brand-500 text-white text-xs font-black">
                        {sem}
                      </span>
                      <span className="text-xs font-semibold text-slate-600 dark:text-slate-300">
                        {semDisciplines.length} disciplinas
                      </span>
                      <span className="text-slate-300 dark:text-brand-500/40">·</span>
                      <span className="text-xs font-semibold text-slate-600 dark:text-slate-300">
                        {semHours}h
                      </span>
                    </div>

                    <div className="text-xs font-bold text-slate-800 dark:text-white">
                      IRA do Semestre: <span className="text-brand-600 dark:text-brand-400 font-extrabold text-sm">{semIra.toFixed(2)}</span>
                    </div>
                  </div>

                  {/* Tabela de Disciplinas */}
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs">
                      <thead>
                        <tr className="border-b border-slate-100 dark:border-brand-500/20 text-slate-500 dark:text-slate-300 font-bold uppercase tracking-wider text-[10px]">
                          <th className="py-3.5 px-6">Disciplina</th>
                          <th className="py-3.5 px-4">Carga Horária (Ci)</th>
                          <th className="py-3.5 px-4">Peso (Pi)</th>
                          <th className="py-3.5 px-4">Nota (Ni)</th>
                          <th className="py-3.5 px-4">Ponderação (Ci × Pi × Ni)</th>
                          <th className="py-3.5 px-4">Situação</th>
                          <th className="py-3.5 px-6 text-right">Ações</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100 dark:divide-brand-500/15">
                        {semDisciplines.map((item) => {
                          const ponderation = (Number(item.hours || 0) * Number(item.semesterWeight || 1) * Number(item.grade || 0)).toFixed(1);
                          return (
                            <tr key={item.id} className="hover:bg-brand-500/5 transition-colors">
                              <td className="py-3.5 px-6 font-semibold text-slate-800 dark:text-white">
                                {item.subjectName}
                              </td>
                              <td className="py-3.5 px-4 text-slate-600 dark:text-slate-300 font-mono">
                                {item.hours}h
                              </td>
                              <td className="py-3.5 px-4 text-slate-600 dark:text-slate-300 font-mono">
                                {item.semesterWeight || 1}
                              </td>
                              <td className="py-3.5 px-4 font-bold text-brand-600 dark:text-brand-400 text-sm font-mono">
                                {Number(item.grade).toFixed(1)}
                              </td>
                              <td className="py-3.5 px-4 font-mono text-slate-600 dark:text-slate-300">
                                {ponderation}
                              </td>
                              <td className="py-3.5 px-4">
                                <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${
                                  Number(item.grade) >= 7
                                    ? 'bg-emerald-500/15 text-emerald-600 dark:text-emerald-400'
                                    : Number(item.grade) >= 5
                                    ? 'bg-amber-500/15 text-amber-600 dark:text-amber-400'
                                    : 'bg-rose-500/15 text-rose-600 dark:text-rose-400'
                                }`}>
                                  {Number(item.grade) >= 5 ? 'Aprovado' : 'Reprovado'}
                                </span>
                              </td>
                              <td className="py-3.5 px-6 text-right">
                                <button
                                  onClick={() => {
                                    if (window.confirm(`Remover "${item.subjectName}" do cálculo de IRA?`)) {
                                      setIraRecords(prev => prev.filter(r => r.id !== item.id));
                                    }
                                  }}
                                  className="text-slate-400 hover:text-red-500 transition-colors p-1"
                                  title="Excluir disciplina"
                                >
                                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                    <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
                                  </svg>
                                </button>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // =============================================
    // TELA 2: CÁLCULO DE IRA & SIMULADOR PREDITIVO AVANÇADO
    // =============================================
    function IraCalculatorPage({ iraRecords, setIraRecords }) {
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [formSemester, setFormSemester] = useState('2026.2');
      const [formWeight, setFormWeight] = useState('4');
      const [formSubjectName, setFormSubjectName] = useState('');
      const [formHours, setFormHours] = useState('88');
      const [formGrade, setFormGrade] = useState('');
      const [formError, setFormError] = useState('');

      // Estado do SIMULADOR PREDITIVO (Projeção de notas futuras) persistido no LocalStorage
      const [predictiveSubjects, setPredictiveSubjects] = useLocalStorage('studyflow-predictive-subjects', CIVIL_DEFAULT_PREDICTIVE_SUBJECTS);
      const [newPredName, setNewPredName] = useState('');
      const [newPredHours, setNewPredHours] = useState('88');
      const [newPredWeight, setNewPredWeight] = useState('4');
      const [newPredGrade, setNewPredGrade] = useState('8.0');

      // Cálculo do IRA Atual Oficial
      const currentPoints = iraRecords.reduce((acc, r) => acc + (Number(r.semesterWeight || 1) * Number(r.hours || 0) * Number(r.grade || 0)), 0);
      const currentDivisor = iraRecords.reduce((acc, r) => acc + (Number(r.semesterWeight || 1) * Number(r.hours || 0)), 0);
      const currentIra = currentDivisor > 0 ? (currentPoints / currentDivisor) : 8.19;
      const totalHours = iraRecords.reduce((acc, r) => acc + Number(r.hours || 0), 0);

      // Cálculo do IRA com a SIMULAÇÃO PREDITIVA
      const simulatedExtraPoints = predictiveSubjects.reduce((acc, s) => acc + (Number(s.weight || 4) * Number(s.hours || 0) * Number(s.simulatedGrade || 0)), 0);
      const simulatedExtraDivisor = predictiveSubjects.reduce((acc, s) => acc + (Number(s.weight || 4) * Number(s.hours || 0)), 0);

      const projectedPoints = currentPoints + simulatedExtraPoints;
      const projectedDivisor = currentDivisor + simulatedExtraDivisor;
      const projectedIra = projectedDivisor > 0 ? (projectedPoints / projectedDivisor) : currentIra;
      const deltaIra = projectedIra - currentIra;

      function handleAddRecord(e) {
        e.preventDefault();
        const sem = formSemester.trim();
        const weight = parseFloat(formWeight);
        const name = formSubjectName.trim();
        const hours = parseFloat(formHours);
        const grade = parseFloat(formGrade);

        if (!sem || !name || isNaN(weight) || isNaN(hours) || isNaN(grade)) {
          setFormError('Preencha obrigatoriamente a disciplina, semestre, carga horária (Ci), peso (Pi) e nota (Ni).');
          return;
        }

        const newRec = {
          id: `rec-${Date.now()}-${Math.random().toString(36).slice(2, 5)}`,
          semester: sem,
          semesterWeight: weight,
          subjectName: name,
          hours: hours,
          grade: grade,
          status: grade >= 5 ? 'Aprovado' : 'Reprovado'
        };

        setIraRecords(prev => [...prev, newRec]);
        setIsAddModalOpen(false);
        setFormSubjectName('');
        setFormGrade('');
        setFormError('');
      }

      function handleAddPredictiveSubject(e) {
        if (e && e.preventDefault) e.preventDefault();
        if (!newPredName.trim()) return;

        const hours = parseFloat(newPredHours);
        const weight = parseFloat(newPredWeight);
        const grade = parseFloat(newPredGrade);

        if (isNaN(hours) || hours <= 0 || isNaN(weight) || weight <= 0 || isNaN(grade)) {
          alert('Informe obrigatoriamente a Carga Horária (Ci) e o Peso (Pi) válidos.');
          return;
        }

        const newSub = {
          id: `pred-${Date.now()}`,
          name: newPredName.trim(),
          hours: hours,
          weight: weight,
          simulatedGrade: grade,
        };
        setPredictiveSubjects(prev => [...prev, newSub]);
        setNewPredName('');
        setNewPredHours('88');
        setNewPredWeight('4');
        setNewPredGrade('8.0');
      }

      function handleRemovePredictiveSubject(id) {
        setPredictiveSubjects(prev => prev.filter(s => s.id !== id));
      }

      function handleGradeSliderChange(id, value) {
        setPredictiveSubjects(prev => prev.map(s => s.id === id ? { ...s, simulatedGrade: parseFloat(value) || 0 } : s));
      }

      function handleApplySimulationToRecords() {
        if (!window.confirm('Deseja consolidar estas notas simuladas do 4º Semestre (2026.2) no seu histórico oficial?')) return;
        const newRecordsToAdd = predictiveSubjects.map(s => ({
          id: `rec-sim-${Date.now()}-${Math.random().toString(36).slice(2, 5)}`,
          semester: '2026.2',
          semesterWeight: s.weight || 4,
          subjectName: s.name,
          hours: s.hours,
          grade: s.simulatedGrade,
          status: s.simulatedGrade >= 5 ? 'Aprovado' : 'Reprovado'
        }));
        setIraRecords(prev => [...prev, ...newRecordsToAdd]);
        alert('Notas do 4º Semestre consolidadas com sucesso no cálculo oficial do IRA!');
      }

      return (
        <div className="max-w-6xl mx-auto space-y-8 animate-fade-in">
          {/* Topo / Título */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h1 className="text-2xl sm:text-3xl font-black text-[#111c38] dark:text-[#111c38] flex items-center gap-3">
                <span className="p-2 rounded-2xl bg-brand-500 text-white shadow-md shadow-brand-500/30">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
                    <rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="16" y1="14" x2="16" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/>
                  </svg>
                </span>
                Cálculo de IRA & Simulador Acadêmico Avançado
              </h1>
              <p className="text-xs sm:text-sm text-[#111c38]/80 dark:text-[#111c38] mt-1">
                Fórmula oficial universitária ponderada por Carga Horária (Ci) e Peso do Período (Pi).
              </p>
            </div>

            <div className="flex items-center gap-2">
              <button
                onClick={() => setIsAddModalOpen(true)}
                className="px-4 py-2.5 rounded-2xl bg-brand-500 hover:bg-brand-600 text-white text-xs font-bold shadow-md shadow-brand-500/25 transition-all cursor-pointer flex items-center gap-1.5"
              >
                <span>+ Lançar Disciplina no Histórico</span>
              </button>
            </div>
          </div>

          {/* BANNER DE STATUS DO SEMESTRE E CONSOLIDAÇÃO */}
          <div className="p-5 rounded-3xl glass-card border border-brand-500/30 flex items-start gap-4 shadow-sm">
            <span className="p-2.5 rounded-2xl bg-brand-500 text-white text-base font-bold shadow-md shadow-brand-500/30 flex-shrink-0">
              ℹ
            </span>
            <div className="space-y-1">
              <h4 className="text-xs font-black uppercase tracking-wider text-[#111c38] dark:text-slate-100">
                Critério de Consolidação do Histórico Acadêmico
              </h4>
              <p className="text-xs text-[#111c38]/80 dark:text-slate-300 leading-relaxed">
                Os dados reais consolidados no cálculo oficial compreendem até o <strong className="text-slate-800 dark:text-white">3º Semestre (2026.1)</strong>. O <strong className="text-brand-600 dark:text-brand-400">4º Semestre (2026.2)</strong> é o período letivo vigente, composto por simulações preditivas interativas e notas estimadas abaixo.
              </p>
            </div>
          </div>

          {/* PAINEL DE FÓRMULA OFICIAL COM ALTO CONTRASTE */}
          <div className="glass-card rounded-3xl p-6 border border-brand-500/25">
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 items-center">
              <div className="md:col-span-2 space-y-2">
                <h4 className="text-xs font-bold uppercase tracking-wider text-brand-700 dark:text-brand-300">
                  Fórmula Oficial de Cálculo do Rendimento (IRA)
                </h4>
                <div className="p-4 bg-slate-50 dark:bg-[#0b132b] rounded-2xl border border-brand-500/30 font-mono text-xs sm:text-sm text-brand-700 dark:text-emerald-300 font-bold shadow-inner">
                  IRA = Σ ( Carga_i × Peso_i × Nota_i ) / Σ ( Carga_i × Peso_i )
                </div>
                <p className="text-[11px] text-slate-500 dark:text-slate-300 leading-relaxed">
                  Onde <strong className="text-slate-800 dark:text-white">Ci</strong> é a carga horária em horas, <strong className="text-slate-800 dark:text-white">Pi</strong> é o peso do período letivo e <strong className="text-slate-800 dark:text-white">Ni</strong> é a nota final obtida (0 a 10).
                </p>
              </div>

              <div className="p-4 rounded-2xl bg-brand-500/10 dark:bg-[#162347] border border-brand-500/30 text-center">
                <span className="text-xs font-bold text-slate-600 dark:text-slate-200 block">IRA Oficial Consolidado</span>
                <span className="text-3xl font-black text-brand-600 dark:text-brand-400">{currentIra.toFixed(2)}</span>
                <span className="text-[10px] text-slate-400 dark:text-slate-300 block mt-0.5">Base: {currentDivisor}h ponderadas ({totalHours}h reais)</span>
              </div>
            </div>
