                  <span className="text-xs font-semibold text-slate-400">líquidas</span>
                </div>
                <p className="text-[11px] text-slate-500 dark:text-slate-300">Tempo real de estudo focado</p>
              </div>

              <div className="glass-card rounded-3xl p-5 border border-brand-500/25 space-y-1">
                <span className="text-[11px] font-bold text-slate-500 dark:text-slate-300 uppercase tracking-wider">
                  Ciclos de Foco Hoje
                </span>
                <div className="flex items-baseline gap-2">
                  <span className="text-3xl font-black text-slate-800 dark:text-white font-mono">
                    {currentTodayCycles}
                  </span>
                  <span className="text-xs font-semibold text-emerald-600 dark:text-emerald-400">
                    / 4 meta diária
                  </span>
                </div>
                <p className="text-[11px] text-slate-500 dark:text-slate-300">
                  {currentTodayCycles >= 4 ? '🎉 Meta diária atingida!' : 'Continue para atingir a meta'}
                </p>
              </div>

              <div className="glass-card rounded-3xl p-5 border border-brand-500/25 space-y-1">
                <span className="text-[11px] font-bold text-slate-500 dark:text-slate-300 uppercase tracking-wider">
                  Alarme Sonoro
                </span>
                <div className="flex items-center gap-2 pt-1">
                  <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                  <span className="text-xs font-bold text-slate-800 dark:text-white">Web Audio Polifônico</span>
                </div>
                <p className="text-[11px] text-slate-500 dark:text-slate-300">
                  Síntese harmônica suave (C5-E5-G5-C6) sem arquivos externos
                </p>
              </div>
            </div>

            {/* Progresso de Horas por Disciplina vs Meta Semanal */}
            <div className="glass-card rounded-3xl p-6 border border-brand-500/25 space-y-4">
              <h4 className="text-xs font-bold uppercase tracking-wider text-slate-800 dark:text-white flex items-center justify-between">
                <span>Distribuição por Disciplina vs Meta Semanal</span>
                <span className="text-[10px] text-brand-600 dark:text-brand-400 font-bold">Semestre 2026.2</span>
              </h4>

              <div className="space-y-4">
                {subjects.map(s => {
                  const subjectMins = (studyStats.subjectMinutes && studyStats.subjectMinutes[s.id]) || 0;
                  const hoursDone = Math.round((subjectMins / 60) * 10) / 10;
                  const weeklyGoal = Number(s.weeklyHours) || 6;
                  const percent = Math.min(100, Math.round((hoursDone / weeklyGoal) * 100));
                  const isGoalReached = hoursDone >= weeklyGoal;

                  return (
                    <div key={s.id} className="p-4 rounded-2xl bg-white/80 dark:bg-[#162347] border border-brand-500/25 space-y-2">
                      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-1 text-xs">
                        <div className="flex items-center gap-2">
                          <span className="px-2 py-0.5 rounded-lg bg-brand-500/15 text-brand-700 dark:text-brand-300 font-bold font-mono text-[10px]">
                            {s.code || 'ENG'}
                          </span>
                          <span className="font-bold text-darkSlate dark:text-white">{s.name}</span>
                        </div>
                        <div className="flex items-center gap-3">
                          <span className="font-mono text-slate-600 dark:text-slate-300">
                            <strong className="text-brand-600 dark:text-brand-400">{hoursDone.toFixed(1)}h</strong> / {weeklyGoal}h semana
                          </span>
                          <span className={`px-2 py-0.5 rounded-full text-[10px] font-black ${
                            isGoalReached
                              ? 'bg-emerald-500/20 text-emerald-600 dark:text-emerald-400'
                              : 'bg-amber-500/20 text-amber-600 dark:text-amber-400'
                          }`}>
                            {percent}% {isGoalReached ? '✓ Meta' : ''}
                          </span>
                        </div>
                      </div>

                      {/* Barra de Progresso */}
                      <div className="w-full h-2.5 bg-slate-100 dark:bg-[#0b132b] rounded-full overflow-hidden p-0.5 border border-brand-500/15">
                        <div
                          className={`h-full rounded-full transition-all duration-500 ${
                            isGoalReached ? 'bg-emerald-500' : 'bg-brand-500'
                          }`}
                          style={{ width: `${percent}%` }}
                        />
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>

          {/* Modal Ajustar Tempo Personalizado */}
          <Modal isOpen={isCustomModalOpen} onClose={() => setIsCustomModalOpen(false)} title="Configurar Duração Personalizada">
            <div className="space-y-4 text-left">
              <div>
                <label className="block text-xs font-bold text-darkSlate dark:text-slate-300 mb-1">
                  Tempo de Foco (1 a 120 minutos)
                </label>
                <div className="flex items-center gap-3">
                  <input
                    type="range"
                    min="1"
                    max="120"
                    step="5"
                    value={customFocusMinutes}
                    onChange={(e) => setCustomFocusMinutes(Number(e.target.value))}
                    className="flex-1 accent-brand-500"
                  />
                  <span className="w-12 text-center text-sm font-black font-mono text-brand-600">
                    {customFocusMinutes}m
                  </span>
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold text-darkSlate dark:text-slate-300 mb-1">
                  Tempo de Pausa (1 a 60 minutos)
                </label>
                <div className="flex items-center gap-3">
                  <input
                    type="range"
                    min="1"
                    max="60"
                    step="1"
                    value={customBreakMinutes}
                    onChange={(e) => setCustomBreakMinutes(Number(e.target.value))}
                    className="flex-1 accent-brand-500"
                  />
                  <span className="w-12 text-center text-sm font-black font-mono text-brand-600">
                    {customBreakMinutes}m
                  </span>
                </div>
              </div>

              <div className="flex gap-2 pt-2">
                {[30, 45, 50, 60, 90].map(val => (
                  <button
                    key={val}
                    type="button"
                    onClick={() => setCustomFocusMinutes(val)}
                    className="flex-1 py-1.5 rounded-xl border border-brand-500/30 text-xs font-bold hover:bg-brand-500/15"
                  >
                    {val}m
                  </button>
                ))}
              </div>

              <button
                type="button"
                onClick={() => {
                  setIsCustomModalOpen(false);
                  if (mode === 'custom') {
                    setTimeLeft((customFocusMinutes || 45) * 60);
                  }
                }}
                className="w-full py-2.5 rounded-xl bg-brand-500 hover:bg-brand-600 text-white text-xs font-bold mt-3"
              >
                Salvar Configurações
              </button>
            </div>
          </Modal>
        </div>
      );
    }

    // =============================================
    // TELA 4: POMODORO PAGE (WRAPPER PRINCIPAL)
    // =============================================
    function PomodoroPage({ subjects }) {
      return (
        <div className="max-w-4xl mx-auto space-y-8">
          <PomodoroDashboardModule subjects={subjects} inStudiesTab={false} />
        </div>
      );
    }

    // =============================================
    // TELA 5: CRONOGRAMA INTEGRADO COM PRAZOS DE PROJETOS
    // =============================================
    function SchedulePage({ schedule, setSchedule, subjects, tasks }) {
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [formDay, setFormDay] = useState('seg');
      const [formStartTime, setFormStartTime] = useState('08:00');
      const [formEndTime, setFormEndTime] = useState('10:00');
      const [formSubjectId, setFormSubjectId] = useState(subjects[0]?.id || '');
      const [formNotes, setFormNotes] = useState('');

      const DAYS = [
        { key: 'seg', label: 'Segunda-feira', short: 'SEG', dayIndex: 1 },
        { key: 'ter', label: 'Terça-feira',   short: 'TER', dayIndex: 2 },
        { key: 'qua', label: 'Quarta-feira',  short: 'QUA', dayIndex: 3 },
        { key: 'qui', label: 'Quinta-feira',  short: 'QUI', dayIndex: 4 },
        { key: 'sex', label: 'Sexta-feira',   short: 'SEX', dayIndex: 5 },
        { key: 'sab', label: 'Sábado',        short: 'SÁB', dayIndex: 6 },
        { key: 'dom', label: 'Domingo',       short: 'DOM', dayIndex: 0 },
      ];

      const currentDayIndex = new Date().getDay();
      const currentDayKey = DAYS.find(d => d.dayIndex === currentDayIndex)?.key || 'seg';

      function getDayKeyFromDate(dateStr) {
        if (!dateStr) return null;
        try {
          const parts = dateStr.split('-');
          if (parts.length === 3) {
            const d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
            const idx = d.getDay();
            return DAYS.find(day => day.dayIndex === idx)?.key || null;
          }
        } catch (e) {}
        return null;
      }

      function handleSaveBlock(e) {
        e.preventDefault();
        const newBlock = {
          id: `sch-${Date.now()}-${Math.random().toString(36).slice(2, 5)}`,
          day: formDay,
          startTime: formStartTime,
          endTime: formEndTime,
          subjectId: formSubjectId,
          notes: formNotes.trim(),
        };
        setSchedule(prev => [...prev, newBlock]);
        setIsAddModalOpen(false);
        setFormNotes('');
      }

      function handleDeleteBlock(id) {
        if (window.confirm('Excluir este bloco de estudo/aula?')) {
          setSchedule(prev => prev.filter(b => b.id !== id));
        }
      }

      function handleOpenAddForDay(dayKey) {
        setFormDay(dayKey);
        setIsAddModalOpen(true);
      }

      const todayFormatted = (() => {
        const d = new Date();
        const s = d.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        return s.charAt(0).toUpperCase() + s.slice(1);
      })();

      return (
        <div className="max-w-7xl mx-auto space-y-6 animate-fade-in">
          {/* Header */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <div className="flex items-center gap-3 flex-wrap">
                <h1 className="text-2xl sm:text-3xl font-black text-[#111c38] dark:text-[#111c38] flex items-center gap-3">
                  <span className="p-2 rounded-2xl bg-brand-500 text-white shadow-md shadow-brand-500/30">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
                      <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
                    </svg>
                  </span>
                  Cronograma Semanal & Prazos Integrados
                </h1>
                <span className="px-3.5 py-1 rounded-2xl bg-brand-500/15 border border-brand-500/30 text-brand-700 dark:text-brand-300 text-xs font-bold shadow-sm flex items-center gap-1.5">
                  <span>📅</span> Hoje: {todayFormatted}
                </span>
              </div>
              <p className="text-xs sm:text-sm text-[#111c38]/80 dark:text-[#111c38] mt-1">
                Visualização semanal horizontal (Segunda a Domingo) para gestão ágil de horários de aulas e entregas de projetos.
              </p>
            </div>

            <div className="flex items-center gap-2">
              <button
                onClick={() => { setFormDay(currentDayKey); setIsAddModalOpen(true); }}
                className="px-4 py-2.5 rounded-2xl bg-brand-500 hover:bg-brand-600 text-white text-xs font-bold shadow-md shadow-brand-500/25 transition-all cursor-pointer flex items-center gap-1.5"
              >
                <span>+ Adicionar Aula / Bloco</span>
              </button>
            </div>
          </div>

          {/* BANNER DE PRAZOS DE PROJETOS E DISCIPLINAS INTEGRADOS */}
          <div className="glass-card rounded-3xl p-5 border-l-4 border-l-brand-500 border border-brand-500/20 space-y-3">
            <div className="flex items-center justify-between">
              <h3 className="text-xs font-black uppercase tracking-wider text-[#111c38] dark:text-slate-100 flex items-center gap-2">
                <span>📌 Entregas e Prazos Integrados dos Projetos</span>
              </h3>
              <span className="text-xs font-semibold text-brand-600 dark:text-brand-400">
                {tasks.filter(t => t.status !== 'done').length} pendentes
              </span>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 pt-1">
              {tasks.filter(t => t.status !== 'done').slice(0, 4).map(t => {
                const subj = subjects.find(s => s.id === t.subjectId);
                const dueInfo = getDueStatus(t.dueDate);
                return (
                  <div key={t.id} className="p-3.5 rounded-2xl bg-white/90 dark:bg-[#162347] border border-brand-500/20 space-y-1.5 shadow-sm">
                    <span className="text-[10px] font-bold text-brand-700 dark:text-brand-300 block">
                      {subj?.name || 'Geral'}
                    </span>
                    <h5 className="text-xs font-bold text-slate-800 dark:text-white line-clamp-1">
                      {t.title}
                    </h5>
                    <div className="flex items-center justify-between text-[11px] text-slate-500 dark:text-slate-300 pt-1 flex-wrap gap-1">
                      <span>Prazo: {t.dueDate || 'Sem data'}</span>
                      {dueInfo ? (
                        <span className={`px-2 py-0.5 rounded-md text-[10px] font-bold ${dueInfo.badgeClass}`}>
                          {dueInfo.text}
                        </span>
                      ) : (
                        <span className={`px-1.5 py-0.2 rounded text-[9px] font-bold ${
                          t.priority === 'high' ? 'bg-red-500/20 text-red-600' : 'bg-brand-500/20 text-brand-700'
                        }`}>
                          {t.priority === 'high' ? 'Crítico' : 'Normal'}
                        </span>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Dica de navegação horizontal */}
          <div className="flex items-center justify-between text-xs text-slate-400 dark:text-[#111c38] px-1">
            <span className="flex items-center gap-1.5">
              <span>↔</span>
              <span>Visualização Semanal Horizontal (Segunda a Domingo em colunas lado a lado)</span>
            </span>
            <span className="hidden sm:inline-block text-[11px]">
              Dica: Role horizontalmente se sua tela for compacta
            </span>
          </div>

          {/* GRADE SEMANAL EM VISUALIZAÇÃO HORIZONTAL (SEGUNDA A DOMINGO LADO A LADO) */}
          <div className="overflow-x-auto pb-4 pt-1 -mx-2 px-2">
            <div className="flex gap-4 min-w-[1240px] items-stretch">
              {DAYS.map(day => {
                const isToday = day.key === currentDayKey;
                const dayBlocks = schedule
                  .filter(b => b.day === day.key)
                  .sort((a, b) => a.startTime.localeCompare(b.startTime));
                const dayTasks = tasks
                  .filter(t => t.status !== 'done' && getDayKeyFromDate(t.dueDate) === day.key);

                return (
                  <div
                    key={day.key}
                    className={`flex-1 min-w-[210px] rounded-3xl p-4 flex flex-col transition-all duration-200 ${
                      isToday
                        ? 'glass-card border-2 border-brand-500 shadow-lg shadow-brand-500/10 ring-4 ring-brand-500/10 dark:ring-brand-500/15'
                        : 'glass-card border border-brand-500/20'
                    }`}
                  >
                    {/* Cabeçalho da Coluna do Dia */}
                    <div className="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-brand-500/20 mb-3">
                      <div>
                        <div className="flex items-center gap-1.5">
                          <span className="text-xs font-black uppercase tracking-wider text-brand-600 dark:text-brand-400 font-mono">
                            {day.short}
                          </span>
                          {isToday && (
                            <span className="text-[9px] font-black px-2 py-0.5 rounded-full bg-brand-500 text-white shadow-sm">
                              Hoje
                            </span>
                          )}
                        </div>
                        <h4 className="text-xs font-bold text-slate-800 dark:text-white mt-0.5">
                          {day.label}
                        </h4>
                      </div>
                      <span className="text-[10px] font-semibold text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-[#0b132b] px-2 py-0.5 rounded-lg">
                        {dayBlocks.length} {dayBlocks.length === 1 ? 'bloco' : 'blocos'}
                      </span>
                    </div>

                    {/* Entregas / Prazos de Projetos do Dia (se houver) */}
                    {dayTasks.length > 0 && (
                      <div className="mb-3 space-y-1.5">
                        <div className="text-[10px] font-bold text-amber-600 dark:text-amber-400 flex items-center gap-1">
                          <span>⚠️</span> Prazos Neste Dia ({dayTasks.length})
                        </div>
                        {dayTasks.map(t => (
                          <div
                            key={t.id}
                            className="p-2 rounded-xl bg-amber-500/10 border border-amber-500/30 text-[11px] text-amber-800 dark:text-amber-200"
                            title={`Projeto com entrega para este dia: ${t.title}`}
                          >
                            <span className="font-bold line-clamp-1">📌 {t.title}</span>
                          </div>
                        ))}
                      </div>
                    )}

                    {/* Lista de Blocos de Horários daquele Dia */}
                    <div className="space-y-2.5 flex-1 overflow-y-auto">
                      {dayBlocks.length === 0 ? (
                        <div className="h-32 flex flex-col items-center justify-center text-xs text-slate-400 dark:text-slate-400 italic text-center p-3 border border-dashed border-slate-200 dark:border-brand-500/30 rounded-2xl">
                          <span>Sem aulas agendadas</span>
                          <button
                            onClick={() => handleOpenAddForDay(day.key)}
                            className="mt-2 text-[11px] font-bold text-brand-600 dark:text-brand-400 hover:underline cursor-pointer"
                          >
                            + Adicionar aula
                          </button>
                        </div>
                      ) : (
                        dayBlocks.map(b => {
                          const subj = subjects.find(s => s.id === b.subjectId);
                          const googleCalendarUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent((subj?.name || 'Aula de Engenharia') + ' - Aula Semanal')}&details=${encodeURIComponent('Disciplina: ' + (subj?.name || 'Engenharia Civil') + '\nHorário: ' + b.startTime + ' às ' + b.endTime + (b.notes ? '\nAnotações: ' + b.notes : '') + '\nOrganizado no StudyFlow VEC')}&location=${encodeURIComponent(b.notes || 'Campus / Laboratório de Engenharia')}`;

                          return (
                            <div key={b.id} className="p-3 rounded-2xl bg-white/90 dark:bg-[#162347] border border-brand-500/20 space-y-2 relative group hover:border-brand-500/40 transition-colors">
                              <div className="flex items-center justify-between">
                                <span className="text-[10px] font-black font-mono text-brand-600 dark:text-brand-400 bg-brand-500/10 px-2 py-0.5 rounded-md">
                                  {b.startTime} - {b.endTime}
                                </span>
                                <button
                                  onClick={() => handleDeleteBlock(b.id)}
                                  className="text-slate-300 hover:text-red-500 text-xs p-0.5 opacity-60 group-hover:opacity-100 transition-opacity"
                                  title="Excluir aula"
                                >
                                  ✕
                                </button>
                              </div>

                              <h5 className="text-xs font-bold text-darkSlate dark:text-white leading-snug">
                                {subj?.name || 'Estudo Livre'}
                              </h5>

                              {b.notes && (
                                <p className="text-[11px] text-slate-500 dark:text-slate-400 line-clamp-2">
                                  📍 {b.notes}
                                </p>
                              )}

                              {/* Sincronização Google Agenda */}
                              <div className="flex items-center justify-between pt-1.5 border-t border-slate-100 dark:border-zinc-800/80">
                                <a
                                  href={googleCalendarUrl}
                                  target="_blank"
                                  rel="noopener noreferrer"
                                  className="inline-flex items-center gap-1 text-[10px] font-bold text-brand-700 dark:text-brand-300 hover:text-brand-800 dark:hover:text-white bg-brand-500/10 hover:bg-brand-500/20 px-2 py-0.5 rounded-lg transition-colors cursor-pointer"
                                  title="Sincronizar esta aula no Google Agenda"
                                >
                                  <span>+ Google Agenda</span>
                                  <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
                                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
                                  </svg>
                                </a>
                              </div>
                            </div>
                          );
                        })
                      )}
                    </div>

                    {/* Botão Rápido de Adicionar no Rodapé da Coluna */}
                    <div className="pt-3 mt-2 border-t border-slate-100 dark:border-zinc-800/80">
                      <button
                        onClick={() => handleOpenAddForDay(day.key)}
                        className="w-full py-1.5 rounded-xl border border-dashed border-slate-200 dark:border-zinc-700/80 hover:border-brand-500 text-[11px] font-bold text-slate-500 dark:text-slate-400 hover:text-brand-600 dark:hover:text-brand-400 hover:bg-brand-500/5 transition-all cursor-pointer"
                      >
                        + Adicionar
                      </button>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Modal Adicionar Bloco */}
          <Modal isOpen={isAddModalOpen} onClose={() => setIsAddModalOpen(false)} title="Adicionar Bloco ao Cronograma">
            <form onSubmit={handleSaveBlock} className="space-y-4">
              <div>
                <label className="block text-xs font-bold text-darkSlate dark:text-slate-300 mb-1">Dia da Semana</label>
                <select
                  value={formDay}
                  onChange={(e) => setFormDay(e.target.value)}
                  className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 text-xs text-darkSlate dark:text-white"
                >
                  {DAYS.map(d => (
                    <option key={d.key} value={d.key}>{d.label}</option>
                  ))}
                </select>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-bold text-darkSlate dark:text-slate-300 mb-1">Horário Início</label>
                  <input
                    type="time"
                    required
                    value={formStartTime}
                    onChange={(e) => setFormStartTime(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 text-xs text-darkSlate dark:text-white"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-darkSlate dark:text-slate-300 mb-1">Horário Fim</label>
                  <input
                    type="time"
                    required
                    value={formEndTime}
                    onChange={(e) => setFormEndTime(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 text-xs text-darkSlate dark:text-white"
                  />
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold text-darkSlate dark:text-slate-300 mb-1">Disciplina</label>
                <select
                  value={formSubjectId}
                  onChange={(e) => setFormSubjectId(e.target.value)}
                  className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 text-xs text-darkSlate dark:text-white"
                >
                  {subjects.map(s => (
                    <option key={s.id} value={s.id}>{s.name}</option>
                  ))}
                </select>
              </div>

              <div>
                <label className="block text-xs font-bold text-darkSlate dark:text-slate-300 mb-1">Anotações / Sala</label>
                <input
                  type="text"
                  value={formNotes}
                  onChange={(e) => setFormNotes(e.target.value)}
                  placeholder="Ex: Sala 204 ou Laboratório de Hidráulica"
                  className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 text-xs text-darkSlate dark:text-white"
                />
              </div>

              <div className="flex gap-2 pt-3">
                <button
                  type="button"
                  onClick={() => setIsAddModalOpen(false)}
                  className="flex-1 py-2 rounded-xl border border-slate-200 dark:border-zinc-700 text-xs font-semibold"
                >
                  Cancelar
                </button>
                <button
                  type="submit"
                  className="flex-1 py-2 rounded-xl bg-brand-500 hover:bg-brand-600 text-white text-xs font-bold shadow-md shadow-brand-500/25"
                >
                  Salvar Bloco
                </button>
              </div>
            </form>
          </Modal>
        </div>
      );
    }

    // =============================================
    // TELA 6: ESTUDOS (DISCIPLINAS, ANEXOS INDEXEDDB & FLASHCARDS)
    // =============================================
    // =============================================
    // TELA 6: ESTUDOS (DISCIPLINAS, ANEXOS INDEXEDDB & FLASHCARDS)
    // =============================================
    function StudiesPage({ subjects, setSubjects, flashcards, setFlashcards, filesList, onUploadFile, onDeleteFile }) {
      const [studySubTab, setStudySubTab] = useState('disciplinas'); // 'disciplinas' | 'anexos' | 'flashcards'
      const [isSubjectModalOpen, setIsSubjectModalOpen] = useState(false);
      const [isFlashcardModalOpen, setIsFlashcardModalOpen] = useState(false);

      // Repositório IndexedDB por Disciplina
      const [uploadSubjectId, setUploadSubjectId] = useState(subjects[0]?.id || 'general');
      const [filterFileSubject, setFilterFileSubject] = useState('all');
      const [previewingFile, setPreviewingFile] = useState(null);

      const filteredFiles = useMemo(() => {
        if (filterFileSubject === 'all') return filesList;
        return filesList.filter(f => f.subjectId === filterFileSubject);
      }, [filesList, filterFileSubject]);

      // Subject form
      const [subName, setSubName] = useState('');
      const [subCode, setSubCode] = useState('');
      const [subHours, setSubHours] = useState('6');

      // Flashcard form
      const [fcSubj, setFcSubj] = useState(subjects[0]?.id || '');
      const [fcFront, setFcFront] = useState('');
      const [fcBack, setFcBack] = useState('');
      const [flippedCards, setFlippedCards] = useState({});

      function handleSaveSubject(e) {
        e.preventDefault();
        if (!subName.trim()) return;
        const newSubj = {
          id: `subj-${Date.now()}`,
          name: subName.trim(),
          code: subCode.trim() || 'CIV-000',
          weeklyHours: parseFloat(subHours) || 6,
          color: 'brand',
        };
        setSubjects(prev => [...prev, newSubj]);
        setIsSubjectModalOpen(false);
        setSubName('');
      }

      function handleSaveFlashcard(e) {
        e.preventDefault();
        if (!fcFront.trim() || !fcBack.trim()) return;
        const newFc = {
          id: `fc-${Date.now()}`,
          subjectId: fcSubj,
          front: fcFront.trim(),
          back: fcBack.trim(),
        };
        setFlashcards(prev => [...prev, newFc]);
        setIsFlashcardModalOpen(false);
        setFcFront('');
        setFcBack('');
      }

      function toggleFlip(id) {
        setFlippedCards(prev => ({ ...prev, [id]: !prev[id] }));
      }

      return (
        <div className="max-w-6xl mx-auto space-y-8 animate-fade-in">
          {/* Header em coluna: Título e subtítulo em cima, abas embaixo */}
          <div className="flex flex-col gap-5">
            <div>
              <h1 className="text-2xl sm:text-3xl font-black text-[#111c38] dark:text-[#111c38] flex items-center gap-3">
                <span className="p-2 rounded-2xl bg-brand-500 text-white shadow-md shadow-brand-500/30">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
                    <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/>
                  </svg>
                </span>
                Centro de Estudos & Materiais Técnicos
              </h1>
              <p className="text-xs sm:text-sm text-[#111c38]/80 dark:text-[#111c38] mt-1">
                Ementas, repositório local de arquivos no IndexedDB e flashcards de memorização.
              </p>
            </div>

            {/* Sub-navegação posicionada abaixo com largura ajustada */}
            <div className="p-1.5 rounded-2xl bg-slate-100 dark:bg-[#0b132b] border border-brand-500/25 flex gap-1.5 flex-wrap w-fit shadow-sm">
              <button
                onClick={() => setStudySubTab('disciplinas')}
                className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${
                  studySubTab === 'disciplinas'
                    ? 'bg-white dark:bg-[#162347] text-brand-600 dark:text-white shadow-sm'
                    : 'text-slate-600 dark:text-slate-300 hover:text-brand-600 dark:hover:text-brand-400 hover:bg-brand-500/10'
                }`}
              >
                Disciplinas ({subjects.length})
              </button>
              <button
                onClick={() => setStudySubTab('pomodoro')}
                className={`px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 ${
                  studySubTab === 'pomodoro'
                    ? 'bg-white dark:bg-[#162347] text-brand-600 dark:text-white shadow-sm'
                    : 'text-slate-600 dark:text-slate-300 hover:text-brand-600 dark:hover:text-brand-400 hover:bg-brand-500/10'
                }`}
              >
                <span>⏱ Pomodoro & Horas</span>
              </button>
              <button
                onClick={() => setStudySubTab('anexos')}
                className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${
                  studySubTab === 'anexos'
                    ? 'bg-white dark:bg-[#162347] text-brand-600 dark:text-white shadow-sm'
                    : 'text-slate-600 dark:text-slate-300 hover:text-brand-600 dark:hover:text-brand-400 hover:bg-brand-500/10'
                }`}
              >
                Repositório Local (IndexedDB) ({filesList.length})
              </button>
              <button
                onClick={() => setStudySubTab('flashcards')}
                className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${
                  studySubTab === 'flashcards'
                    ? 'bg-white dark:bg-[#162347] text-brand-600 dark:text-white shadow-sm'
                    : 'text-slate-600 dark:text-slate-300 hover:text-brand-600 dark:hover:text-brand-400 hover:bg-brand-500/10'
                }`}
              >
                Flashcards 3D ({flashcards.length})
              </button>
            </div>
          </div>

          {/* SUB-ABA: POMODORO & DASHBOARD DE HORAS INTEGRADO */}
          {studySubTab === 'pomodoro' && (
            <div className="space-y-6">
              <PomodoroDashboardModule subjects={subjects} inStudiesTab={true} />
            </div>
          )}

          {/* SUB-ABA 1: DISCIPLINAS */}
          {studySubTab === 'disciplinas' && (
            <div className="space-y-6">
              <div className="flex justify-between items-center">
                <h3 className="text-sm font-bold text-[#111c38] dark:text-[#111c38]">
                  Disciplinas Cadastradas e Metas Semanais
                </h3>
                <button
                  onClick={() => setIsSubjectModalOpen(true)}
                  className="px-4 py-2 rounded-2xl bg-brand-500 hover:bg-brand-600 text-white text-xs font-bold shadow-md shadow-brand-500/25"
                >
                  + Nova Disciplina
                </button>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                {subjects.map(s => {
                  const subjectFiles = filesList.filter(f => f.subjectId === s.id);
                  return (
                    <div key={s.id} className="glass-card rounded-3xl p-6 border border-brand-500/20 card-hover space-y-4">
                      <div className="flex items-center justify-between">
                        <span className="text-[10px] font-black px-2.5 py-0.5 rounded-full bg-brand-500/15 text-brand-700 dark:text-brand-300">
                          {s.code || 'CIV-ENG'}
                        </span>
                        <span className="text-xs text-slate-500 dark:text-slate-300 font-semibold">
                          Meta: {s.weeklyHours}h / semana
                        </span>
                      </div>

                      <h4 className="text-base font-bold text-slate-800 dark:text-white">
                        {s.name}
                      </h4>

                      <div className="pt-2 border-t border-slate-100 dark:border-brand-500/20 text-xs text-slate-500 dark:text-slate-300 flex items-center justify-between">
                        <span>📁 {subjectFiles.length} arquivos locais</span>
                        <button
                          onClick={() => {
                            if (window.confirm(`Remover disciplina ${s.name}?`)) {
                              setSubjects(prev => prev.filter(item => item.id !== s.id));
                            }
                          }}
                          className="text-slate-400 hover:text-red-500 text-xs"
                        >
                          Excluir
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* SUB-ABA 2: REPOSITÓRIO LOCAL INDEXEDDB POR DISCIPLINA */}
          {studySubTab === 'anexos' && (
            <div className="space-y-6">
              <div className="glass-card rounded-3xl p-6 border border-brand-500/20 flex flex-col md:flex-row items-center justify-between gap-4">
                <div>
                  <div className="flex items-center gap-2">
                    <span className="w-2.5 h-2.5 rounded-full bg-brand-500"></span>
                    <h3 className="text-sm font-bold text-[#111c38] dark:text-slate-100">
                      Repositório Local de Arquivos e PDFs por Disciplina (IndexedDB)
                    </h3>
                  </div>
                  <p className="text-xs text-[#111c38]/80 dark:text-slate-300 mt-0.5">
                    Armazenamento seguro no seu navegador para apostilas, normas ABNT (NBR 6118, NBR NM 67) e memoriais de cálculo.
                  </p>
                </div>

                <div className="flex flex-wrap items-center gap-2.5 w-full md:w-auto justify-end">
                  <div className="flex items-center gap-1.5">
                    <label className="text-xs font-bold text-slate-600 dark:text-slate-300">Vincular a:</label>
                    <select
                      value={uploadSubjectId}
                      onChange={(e) => setUploadSubjectId(e.target.value)}
                      className="px-3 py-2 rounded-xl bg-white dark:bg-[#0b132b] border border-brand-500/25 text-xs text-slate-800 dark:text-white font-semibold focus:outline-none"
                    >
                      {subjects.map(s => (
                        <option key={s.id} value={s.id}>{s.name}</option>
                      ))}
                      <option value="general">Geral / Normas Técnicas</option>
                    </select>
                  </div>

                  <label className="px-4 py-2.5 rounded-2xl bg-brand-500 hover:bg-brand-600 text-white text-xs font-bold shadow-md shadow-brand-500/25 cursor-pointer flex items-center gap-2 transition-all hover:scale-[1.02] active:scale-[0.98]">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
                      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                    <span>+ Enviar Arquivo PDF</span>
                    <input
                      type="file"
                      accept=".pdf,application/pdf,.doc,.docx,.xls,.xlsx,image/*"
                      className="hidden"
                      onChange={(e) => {
                        if (e.target.files && e.target.files[0]) {
                          onUploadFile(e.target.files[0], uploadSubjectId);
                        }
                      }}
                    />
                  </label>
                </div>
              </div>

              {/* Filtro por Disciplina e Contagem */}
              <div className="flex items-center justify-between flex-wrap gap-3 px-1">
                <div className="flex items-center gap-2">
                  <span className="text-xs font-semibold text-slate-500">Filtrar por Disciplina:</span>
                  <select
                    value={filterFileSubject}
                    onChange={(e) => setFilterFileSubject(e.target.value)}
                    className="px-3 py-1.5 rounded-xl bg-white/90 dark:bg-zinc-900/90 border border-brand-500/20 text-xs text-darkSlate dark:text-white font-medium"
                  >
                    <option value="all">Todas as Disciplinas ({filesList.length})</option>
                    {subjects.map(s => (
                      <option key={s.id} value={s.id}>
                        {s.name} ({filesList.filter(f => f.subjectId === s.id).length})
                      </option>
                    ))}
                    <option value="general">
                      Geral / Normas ({filesList.filter(f => f.subjectId === 'general').length})
                    </option>
                  </select>
                </div>
                <span className="text-xs text-slate-400">
                  {filteredFiles.length} {filteredFiles.length === 1 ? 'arquivo encontrado' : 'arquivos encontrados'}
                </span>
              </div>

              {/* Lista de Arquivos com Vínculo de Disciplina */}
              <div className="glass-card rounded-3xl overflow-hidden border border-brand-500/20">
                {filteredFiles.length === 0 ? (
                  <div className="py-14 text-center space-y-2">
                    <span className="text-3xl">📁</span>
                    <p className="text-xs text-slate-500 dark:text-slate-400 font-medium">
                      Nenhum arquivo encontrado para o filtro selecionado.
                    </p>
                    <p className="text-[11px] text-slate-400">
                      Envie memoriais, PDFs de normas técnicas ou apostilas selecionando a disciplina acima.
                    </p>
                  </div>
                ) : (
                  <div className="overflow-x-auto touch-scroll">
                    <div className="sm:hidden text-[10px] text-slate-400 dark:text-slate-400 p-2 border-b border-slate-100 dark:border-zinc-800 flex items-center gap-1.5">
                      <span>↔</span>
                      <span>Deslize lateralmente para visualizar ações e detalhes dos arquivos</span>
                    </div>
                    <table className="w-full text-left text-xs min-w-[580px]">
                      <thead>
                        <tr className="border-b border-slate-100 dark:border-zinc-800 text-slate-400 font-bold uppercase tracking-wider text-[10px]">
                          <th className="py-3.5 px-6">Documento / Arquivo</th>
                          <th className="py-3.5 px-4">Disciplina Vinculada</th>
                          <th className="py-3.5 px-4 font-mono">Tamanho</th>
                          <th className="py-3.5 px-4">Tipo</th>
                          <th className="py-3.5 px-6 text-right">Ações</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100 dark:divide-zinc-800">
                        {filteredFiles.map(file => {
                          const linkedSubj = subjects.find(s => s.id === file.subjectId);
                          const isPdf = file.name.toLowerCase().endsWith('.pdf') || (file.type && file.type.includes('pdf'));
                          const isImage = /\.(png|jpe?g|gif|webp|svg|bmp)$/i.test(file.name || '') || (file.type && file.type.startsWith('image/'));
                          const isPreviewable = isPdf || isImage;

                          return (
                            <tr key={file.id} className="hover:bg-brand-500/5 transition-colors">
                              <td className="py-3.5 px-6 font-semibold text-darkSlate dark:text-white flex items-center gap-2.5">
                                <span className="text-base">{isPdf ? '📕' : isImage ? '🖼️' : '📄'}</span>
                                <span className="line-clamp-1 max-w-xs sm:max-w-md">{file.name}</span>
                              </td>
                              <td className="py-3.5 px-4">
                                <span className="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-brand-500/15 text-brand-700 dark:text-brand-300">
                                  {linkedSubj ? linkedSubj.name : 'Geral / Normas'}
                                </span>
                              </td>
                              <td className="py-3.5 px-4 text-slate-500 font-mono">
                                {file.size > 1024 * 1024
                                  ? `${(file.size / (1024 * 1024)).toFixed(1)} MB`
                                  : `${Math.round(file.size / 1024)} KB`}
                              </td>
                              <td className="py-3.5 px-4 text-slate-500 text-[11px]">
                                {isPdf ? 'Documento PDF' : isImage ? 'Imagem' : (file.type || 'Arquivo')}
                              </td>
                              <td className="py-3.5 px-6 text-right space-x-2 whitespace-nowrap">
                                {isPreviewable && (
                                  <button
                                    type="button"
                                    onClick={() => setPreviewingFile(file)}
                                    className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-brand-500 hover:bg-brand-600 text-white font-bold text-xs shadow-md shadow-brand-500/25 transition-all cursor-pointer"
                                    title="Visualizar documento em tela cheia"
                                  >
                                    <span>Visualizar 👁️</span>
                                  </button>
                                )}
                                <a
                                  href={file.data}
                                  download={file.name}
                                  className="inline-flex items-center gap-1 px-3 py-1.5 rounded-xl bg-brand-500/15 hover:bg-brand-500 text-brand-700 hover:text-white dark:text-brand-300 font-bold text-xs transition-colors cursor-pointer"
                                  title="Baixar arquivo no dispositivo"
                                >
                                  <span>⬇ Baixar</span>
                                </a>
                                <button
                                  type="button"
                                  onClick={() => {
                                    if (window.confirm(`Deseja realmente excluir "${file.name}" do IndexedDB local?`)) {
                                      onDeleteFile(file.id);
                                    }
                                  }}
                                  className="text-slate-400 hover:text-red-500 text-xs px-2 py-1 rounded-lg hover:bg-red-50 dark:hover:bg-red-950/20 transition-colors cursor-pointer"
                                  title="Excluir arquivo"
                                >
                                  Excluir
                                </button>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* SUB-ABA 3: FLASHCARDS 3D FLIP */}
          {studySubTab === 'flashcards' && (
            <div className="space-y-6">
              <div className="flex justify-between items-center">
                <h3 className="text-sm font-bold text-[#111c38] dark:text-slate-100">
                  Cartões de Memorização de Fórmulas e Conceitos (Clique para Virar)
                </h3>
                <button
                  onClick={() => setIsFlashcardModalOpen(true)}
                  className="px-4 py-2 rounded-2xl bg-brand-500 hover:bg-brand-600 text-white text-xs font-bold shadow-md shadow-brand-500/25"
                >
                  + Criar Flashcard
                </button>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                {flashcards.map(fc => {
                  const isFlipped = !!flippedCards[fc.id];
                  const subj = subjects.find(s => s.id === fc.subjectId);

                  return (
                    <div
                      key={fc.id}
                      onClick={() => toggleFlip(fc.id)}
                      className="h-56 perspective-1000 cursor-pointer select-none"
                    >
                      <div
                        className={`w-full h-full relative transform-style-preserve-3d transition-transform duration-500 ${
                          isFlipped ? 'rotate-y-180' : ''
                        }`}
                      >
                        {/* Frente */}
                        <div className="absolute inset-0 backface-hidden glass-card rounded-3xl p-6 border border-brand-500/25 flex flex-col justify-between">
                          <div className="flex items-center justify-between">
                            <span className="text-[10px] font-black px-2 py-0.5 rounded-full bg-brand-500/20 text-brand-700 dark:text-brand-300">
                              {subj?.name || 'Fórmula'}
                            </span>
                            <span className="text-[10px] text-slate-400 dark:text-slate-300">Clique para virar ↺</span>
                          </div>

                          <div className="text-center font-bold text-base text-slate-800 dark:text-white">
                            {fc.front}
                          </div>

                          <div className="text-[10px] text-slate-400 dark:text-slate-300 text-right">Frente</div>
                        </div>

                        {/* Verso */}
                        <div className="absolute inset-0 backface-hidden rotate-y-180 bg-brand-500 text-white rounded-3xl p-6 flex flex-col justify-between shadow-xl">
                          <div className="flex items-center justify-between">
                            <span className="text-[10px] font-black px-2 py-0.5 rounded-full bg-white/20 text-white">
                              Resposta / Resolução
                            </span>
                            <span className="text-[10px] text-white/70">Clique para desvirar ↺</span>
                          </div>

                          <div className="text-center font-medium text-sm whitespace-pre-line leading-relaxed">
                            {fc.back}
                          </div>

                          <div className="text-[10px] text-white/70 text-right">Verso</div>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* Modal Nova Disciplina */}
          <Modal isOpen={isSubjectModalOpen} onClose={() => setIsSubjectModalOpen(false)} title="Cadastrar Nova Disciplina">
            <form onSubmit={handleSaveSubject} className="space-y-4">
              <div>
                <label className="block text-xs font-bold text-slate-800 dark:text-slate-300 mb-1">Nome da Disciplina</label>
                <input
                  type="text"
                  required
                  value={subName}
                  onChange={(e) => setSubName(e.target.value)}
                  placeholder="Ex: Teoria das Estruturas II"
                  className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-[#0b132b] border border-slate-200 dark:border-brand-500/30 text-xs text-slate-800 dark:text-white"
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-bold text-slate-800 dark:text-slate-300 mb-1">Código</label>
                  <input
                    type="text"
                    value={subCode}
                    onChange={(e) => setSubCode(e.target.value)}
                    placeholder="CIV-402"
                    className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-[#0b132b] border border-slate-200 dark:border-brand-500/30 text-xs text-slate-800 dark:text-white"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-800 dark:text-slate-300 mb-1">Meta Semanal (Horas)</label>
                  <input
                    type="number"
                    min="1"
                    max="40"
                    value={subHours}
                    onChange={(e) => setSubHours(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-[#0b132b] border border-slate-200 dark:border-brand-500/30 text-xs text-slate-800 dark:text-white"
                  />
                </div>
              </div>

              <div className="flex gap-2 pt-3">
                <button
                  type="button"
                  onClick={() => setIsSubjectModalOpen(false)}
                  className="flex-1 py-2 rounded-xl border border-slate-200 dark:border-brand-500/30 text-xs font-semibold"
                >
                  Cancelar
                </button>
                <button
                  type="submit"
                  className="flex-1 py-2 rounded-xl bg-brand-500 hover:bg-brand-600 text-white text-xs font-bold shadow-md shadow-brand-500/25"
                >
                  Cadastrar
                </button>
              </div>
            </form>
          </Modal>

          {/* Modal Novo Flashcard */}
          <Modal isOpen={isFlashcardModalOpen} onClose={() => setIsFlashcardModalOpen(false)} title="Criar Novo Flashcard de Engenharia">
            <form onSubmit={handleSaveFlashcard} className="space-y-4">
              <div>
                <label className="block text-xs font-bold text-slate-800 dark:text-slate-300 mb-1">Disciplina</label>
                <select
                  value={fcSubj}
                  onChange={(e) => setFcSubj(e.target.value)}
                  className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-[#0b132b] border border-slate-200 dark:border-brand-500/30 text-xs text-slate-800 dark:text-white"
                >
                  {subjects.map(s => (
                    <option key={s.id} value={s.id}>{s.name}</option>
                  ))}
                </select>
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-800 dark:text-slate-300 mb-1">Frente (Pergunta / Fórmula)</label>
                <input
                  type="text"
                  required
                  value={fcFront}
                  onChange={(e) => setFcFront(e.target.value)}
                  placeholder="Ex: Fórmula da Linha Neutra"
                  className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-[#0b132b] border border-slate-200 dark:border-brand-500/30 text-xs text-slate-800 dark:text-white"
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-800 dark:text-slate-300 mb-1">Verso (Resposta / Demonstração)</label>
                <textarea
                  rows="3"
                  required
                  value={fcBack}
                  onChange={(e) => setFcBack(e.target.value)}
                  placeholder="Explicação detalhada da fórmula..."
                  className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-[#0b132b] border border-slate-200 dark:border-brand-500/30 text-xs text-slate-800 dark:text-white"
                />
              </div>

              <div className="flex gap-2 pt-3">
                <button
                  type="button"
                  onClick={() => setIsFlashcardModalOpen(false)}
                  className="flex-1 py-2 rounded-xl border border-slate-200 dark:border-zinc-700 text-xs font-semibold"
                >
                  Cancelar
                </button>
                <button
                  type="submit"
                  className="flex-1 py-2 rounded-xl bg-brand-500 hover:bg-brand-600 text-white text-xs font-bold shadow-md shadow-brand-500/25"
                >
                  Salvar Cartão
                </button>
              </div>
            </form>
          </Modal>

          {/* Modal de Pré-visualização de Arquivos em Tela Cheia */}
          <FilePreviewModal
            file={previewingFile}
            isOpen={!!previewingFile}
            onClose={() => setPreviewingFile(null)}
            subjects={subjects}
          />
        </div>
      );
    }

    // =============================================
    // APLICAÇÃO PRINCIPAL & ROTEAMENTO
    // =============================================
    function AppContent() {
      const { currentUser, logout } = useAuth();
      const [activeNav, setActiveNav] = useLocalStorage('studyflow-active-tab', 'home');

      // Estados Persistidos no LocalStorage (como cache local e fallback)
      const [iraRecords, setIraRecords] = useLocalStorage('studyflow-ira-records', CIVIL_DEFAULT_IRA_RECORDS);
      const [subjects, setSubjects] = useLocalStorage('studyflow-subjects', CIVIL_DEFAULT_SUBJECTS);
      const [tasks, setTasks] = useLocalStorage('studyflow-tasks', CIVIL_DEFAULT_TASKS);
      const [schedule, setSchedule] = useLocalStorage('studyflow-schedule', CIVIL_DEFAULT_SCHEDULE);
      const [flashcards, setFlashcards] = useLocalStorage('studyflow-flashcards', CIVIL_DEFAULT_FLASHCARDS);

      // Estado de Sincronização Firestore
      const [syncStatus, setSyncStatus] = useState('synced'); // 'synced' | 'saving' | 'error'
      const isInitialLoadRef = useRef(true);

      // Sincronização Inicial: Baixar dados do Firestore ao autenticar
      useEffect(() => {
        if (!currentUser) return;
        isInitialLoadRef.current = true;

        async function loadUserData() {
          try {
            setSyncStatus('saving');
            if (window.firebaseDb && window.firebaseFirestoreMethods) {
              const { doc, getDoc, setDoc } = window.firebaseFirestoreMethods;
              const userDocRef = doc(window.firebaseDb, 'users', currentUser.uid);
              const docSnap = await getDoc(userDocRef);

              if (docSnap.exists()) {
                const data = docSnap.data();
                if (data.iraRecords && Array.isArray(data.iraRecords)) setIraRecords(data.iraRecords);
                if (data.subjects && Array.isArray(data.subjects)) setSubjects(data.subjects);
                if (data.tasks && Array.isArray(data.tasks)) setTasks(data.tasks);
                if (data.schedule && Array.isArray(data.schedule)) setSchedule(data.schedule);
                if (data.flashcards && Array.isArray(data.flashcards)) setFlashcards(data.flashcards);
              } else {
                // Primeiro login do usuário: envia o estado inicial completo
                await setDoc(userDocRef, {
                  iraRecords,
                  subjects,
                  tasks,
                  schedule,
                  flashcards,
                  userEmail: currentUser.email,
                  updatedAt: new Date().toISOString()
                });
              }
              setSyncStatus('synced');
            }
          } catch (err) {
            console.error('Erro ao sincronizar com o Firestore:', err);
            setSyncStatus('error');
          } finally {
            setTimeout(() => {
              isInitialLoadRef.current = false;
            }, 800);
          }
        }

        loadUserData();
      }, [currentUser]);

      // Sincronização Contínua: Salvar dados alterados no Firestore com Debounce
      useEffect(() => {
        if (isInitialLoadRef.current || !currentUser) return;

        setSyncStatus('saving');
        const timer = setTimeout(async () => {
          try {
            if (window.firebaseDb && window.firebaseFirestoreMethods) {
              const { doc, setDoc } = window.firebaseFirestoreMethods;
              const userDocRef = doc(window.firebaseDb, 'users', currentUser.uid);
              await setDoc(
                userDocRef,
                {
                  iraRecords,
                  subjects,
                  tasks,
                  schedule,
                  flashcards,
                  userEmail: currentUser.email,
                  updatedAt: new Date().toISOString()
                },
                { merge: true }
              );
              setSyncStatus('synced');
            }
          } catch (err) {
            console.error('Erro ao salvar alterações no Firestore:', err);
            setSyncStatus('error');
          }
        }, 1200);

        return () => clearTimeout(timer);
      }, [iraRecords, subjects, tasks, schedule, flashcards, currentUser]);

      // IndexedDB para Arquivos
      const dbState = useIndexedDBFiles();

      // Modal de Reset Geral
      const [isResetModalOpen, setIsResetModalOpen] = useState(false);

      // Modal de Adição Rápida na Home
      const [isHomeAddOpen, setIsHomeAddOpen] = useState(false);
      const [homeAddName, setHomeAddName] = useState('');
      const [homeAddHours, setHomeAddHours] = useState('88');
      const [homeAddGrade, setHomeAddGrade] = useState('');
      const [homeAddSem, setHomeAddSem] = useState('2025.1');

      function handleConfirmReset() {
        try {
          window.localStorage.clear();
          dbState.clearAllFiles();
        } catch (e) {
          console.error('Erro ao limpar dados:', e);
        }
        window.location.reload();
      }

      function handleSaveQuickDiscipline(e) {
        e.preventDefault();
        if (!homeAddName.trim() || !homeAddGrade) return;

        const newRec = {
          id: `rec-quick-${Date.now()}`,
          semester: homeAddSem,
          semesterWeight: 3,
          subjectName: homeAddName.trim(),
          hours: parseFloat(homeAddHours) || 88,
          grade: parseFloat(homeAddGrade) || 8.0,
          status: parseFloat(homeAddGrade) >= 5 ? 'Aprovado' : 'Reprovado'
        };

        setIraRecords(prev => [...prev, newRec]);
        setIsHomeAddOpen(false);
        setHomeAddName('');
        setHomeAddGrade('');
      }

      function renderCurrentPage() {
        switch (activeNav) {
          case 'home':
            return (
              <HomePage
                iraRecords={iraRecords}
                setIraRecords={setIraRecords}
                onNavigate={setActiveNav}
                onOpenAddDiscipline={() => setIsHomeAddOpen(true)}
              />
            );
          case 'ira':
            return (
              <IraCalculatorPage
                iraRecords={iraRecords}
                setIraRecords={setIraRecords}
              />
            );
          case 'tasks':
            return (
              <ProjectsPage
                tasks={tasks}
                setTasks={setTasks}
                subjects={subjects}
              />
            );
          case 'pomodoro':
            return (
              <PomodoroPage
                subjects={subjects}
              />
            );
          case 'schedule':
            return (
              <SchedulePage
                schedule={schedule}
                setSchedule={setSchedule}
                subjects={subjects}
                tasks={tasks}
              />
            );
          case 'study':
            return (
              <StudiesPage
                subjects={subjects}
                setSubjects={setSubjects}
                flashcards={flashcards}
                setFlashcards={setFlashcards}
                filesList={dbState.filesList}
                onUploadFile={dbState.uploadFile}
                onDeleteFile={dbState.deleteFile}
              />
            );
          default:
            return (
              <HomePage
                iraRecords={iraRecords}
                setIraRecords={setIraRecords}
                onNavigate={setActiveNav}
                onOpenAddDiscipline={() => setIsHomeAddOpen(true)}
              />
            );
        }
      }

      return (
        <div className="min-h-screen bg-civil-overlay-light dark:bg-civil-overlay-dark text-darkSlate dark:text-white flex flex-col transition-colors duration-200 relative">
          {/* Topo / Navbar Horizontal com Perfil, Nuvem e Logout */}
          <TopNavbar
            activeNav={activeNav}
            onNavChange={setActiveNav}
            onOpenResetModal={() => setIsResetModalOpen(true)}
            syncStatus={syncStatus}
            currentUser={currentUser}
            onLogout={logout}
          />

          {/* Conteúdo Central com espaçamento inferior seguro para a BottomNavBar móvel */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-6 lg:px-8 py-4 sm:py-8 pb-28 sm:pb-32">
            {renderCurrentPage()}
          </main>

          {/* Rodapé Institucional com padding seguro para celular */}
          <footer className="py-6 px-4 pb-28 md:pb-6 border-t border-brand-500/20 text-center text-xs text-slate-500 dark:text-slate-400 bg-white/40 dark:bg-zinc-950/40">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
              <div className="flex items-center gap-2">
                <span className="font-bold text-brand-600 dark:text-brand-400">StudyFlow</span>
                <span>— Versão Engenharia Civil (VEC)</span>
              </div>
              <div>
                Persistência em Nuvem via Firebase Firestore & Auth · Cores oficiais #90a14a, #f9f9f9 e #3d3d3d
              </div>
            </div>
          </footer>

          {/* Barra de Navegação Inferior Fixa em Telas Móveis (md:hidden) */}
          <BottomNavBar
            activeNav={activeNav}
            onNavChange={setActiveNav}
          />

          {/* Modal de Reset Geral */}
          <ResetConfirmModal
            isOpen={isResetModalOpen}
            onClose={() => setIsResetModalOpen(false)}
            onConfirm={handleConfirmReset}
          />

          {/* Modal Adicionar Disciplina Rápido (Home) */}
          <Modal
            isOpen={isHomeAddOpen}
            onClose={() => setIsHomeAddOpen(false)}
            title="Lançamento Rápido de Disciplina"
          >
            <form onSubmit={handleSaveQuickDiscipline} className="space-y-4">
              <div>
                <label className="block text-xs font-bold text-darkSlate dark:text-slate-300 mb-1">
                  Nome da Disciplina
                </label>
                <input
                  type="text"
                  required
                  value={homeAddName}
                  onChange={(e) => setHomeAddName(e.target.value)}
                  placeholder="Ex: Concreto Armado I"
                  className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 text-xs text-darkSlate dark:text-white"
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-bold text-darkSlate dark:text-slate-300 mb-1">
                    Semestre
                  </label>
                  <input
                    type="text"
                    required
                    value={homeAddSem}
                    onChange={(e) => setHomeAddSem(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 text-xs text-darkSlate dark:text-white"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-darkSlate dark:text-slate-300 mb-1">
                    Carga Horária (h)
                  </label>
                  <input
                    type="number"
                    min="10"
                    max="200"
                    required
                    value={homeAddHours}
                    onChange={(e) => setHomeAddHours(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 text-xs text-darkSlate dark:text-white"
                  />
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold text-darkSlate dark:text-slate-300 mb-1">
                  Nota Obtida (0 a 10)
                </label>
                <input
                  type="number"
                  min="0"
                  max="10"
                  step="0.1"
                  required
                  value={homeAddGrade}
                  onChange={(e) => setHomeAddGrade(e.target.value)}
                  placeholder="8.5"
                  className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 text-xs text-darkSlate dark:text-white"
                />
              </div>

              <div className="flex gap-2 pt-3">
                <button
                  type="button"
                  onClick={() => setIsHomeAddOpen(false)}
                  className="flex-1 py-2 rounded-xl border border-slate-200 dark:border-zinc-700 text-xs font-semibold"
                >
                  Cancelar
                </button>
                <button
                  type="submit"
                  className="flex-1 py-2 rounded-xl bg-brand-500 hover:bg-brand-600 text-white text-xs font-bold shadow-md shadow-brand-500/25"
                >
                  Salvar
                </button>
              </div>
            </form>
          </Modal>
        </div>
      );
    }

    // =============================================
    // ENVOLTÓRIO PRINCIPAL COM CHECAGEM DE AUTENTICAÇÃO
    // =============================================
    function AppWrapper() {
      const { currentUser, authLoading } = useAuth();

      if (authLoading) {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center bg-civil-overlay-light dark:bg-civil-overlay-dark text-darkSlate dark:text-white">
            <div className="flex flex-col items-center gap-4 animate-fade-in">
              <AppBrandLogo className="h-14 md:h-16" />
              <div className="flex items-center gap-3 mt-4 text-xs sm:text-sm font-semibold text-slate-600 dark:text-slate-300">
                <svg className="animate-spin h-5 w-5 text-brand-500" viewBox="0 0 24 24" fill="none">
                  <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                  <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                </svg>
                <span>Conectando aos serviços do Firebase...</span>
              </div>
            </div>
          </div>
        );
      }

      if (!currentUser) {
        return <AuthScreen />;
      }

      return <AppContent />;
    }

    function App() {
      return (
        <ThemeProvider>
          <AuthProvider>
            <AppWrapper />
          </AuthProvider>
        </ThemeProvider>
      );
    }

    // Renderização no elemento root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
